name: 인스타 연결 테스트

# Actions 탭에서 수동 실행 → 토큰과 계정이 제대로 연결됐는지 확인 (업로드는 하지 않음)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_ACCESS_TOKEN_DEALS: ${{ secrets.IG_ACCESS_TOKEN_DEALS }}   # 혜택 채널 (config.yml channels.deals)
          IG_USER_ID_DEALS: ${{ secrets.IG_USER_ID_DEALS }}
          IG_API_HOST_DEALS: ${{ vars.IG_API_HOST_DEALS }}
        run: |
          python -m screendaily check
          if [ -n "$IG_ACCESS_TOKEN_DEALS" ]; then python -m screendaily check --channel deals; fi
          python -m screendaily list
