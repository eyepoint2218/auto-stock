name: 최신작 목록 갱신

# 한국 OTT(넷플릭스·티빙·디즈니+·쿠팡플레이·웨이브·왓챠) 최근 1년 인기작을 TMDB 에서 받아
# data/trending.md 로 저장합니다. 주간 기획에서 최신작을 고를 때 씁니다.
on:
  schedule:
    - cron: "17 3 * * 6"   # 매주 토요일 12:17 (한국시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screendaily-content
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 최신작 목록 받기
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          git config user.name "screendaily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m screendaily trending --commit
