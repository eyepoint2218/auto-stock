name: 인스타 자동 업로드

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 확인 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트 모드 (실제 업로드 안 함)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screendaily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 올릴 게시물 확인
        id: due
        run: python -m screendaily due

      - name: ffmpeg 설치 (릴스용)
        if: steps.due.outputs.count != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 업로드
        if: steps.due.outputs.count != '0'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name "screendaily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m screendaily publish-due ${{ inputs.dry_run && '--dry-run' || '' }}
