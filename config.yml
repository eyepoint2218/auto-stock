# 스크린데일리 자동 업로드 설정
brand: SCREEN DAILY
handle: "@screendaily.mag"
timezone: Asia/Seoul          # post.yml 의 publish_at 은 이 시간대 기준

# 모든 게시글(caption) 끝, 해시태그 앞에 붙는 채널 소개 (이모지 없이)
channel_intro: |
  스크린데일리 @screendaily.mag
  오늘 뭐 볼지 고민 끝, 넷플릭스·OTT 영화·드라마·예능 추천
  평일 저녁 6시 새 추천

# 인스타 검색 노출용 키워드 (채널 소개 아래 한 줄, 작품명 뒤에 붙음. 해시태그 5개 제한과 별개)
search_keywords: [영화 추천, 드라마 추천, 넷플릭스 추천, 예능 추천, OTT 추천, 볼만한 영화]

# 해시태그 개수 제한 (인스타 최대 5개). 게시물 hashtags 를 먼저 붙이고, 남는 자리에 아래 기본 해시태그를 순서대로 채움
hashtag_limit: 5
# 기본 해시태그 (중요한 것부터)
default_hashtags:
  - 영화추천
  - 드라마추천
  - 넷플릭스추천
  - OTT추천
  - 스크린데일리

# 마지막 장 (팔로우 유도)
outro:
  title: "매일 한 편,\n오늘 뭐 볼지\n고민 끝"
  cta: "팔로우하고 매일 추천 받기"
  save: "저장해두고 주말에 꺼내 보기"
  question: "여러분의 인생작은? 댓글로 알려주세요"

# 카테고리 라벨 색상
labels:
  MOOD: "#FFB547"
  WEEKEND: "#FF4D4D"
  HIDDEN: "#8B6CFF"
  ISSUE: "#36C5F0"
  ACTOR: "#FF6FA8"
  TIP: "#2EC4A0"
  default: "#FF4D4D"

# 이야기 카드(type: story)에 brand: 를 적으면 그 카드만 아래 색으로 바뀜 (로고는 쓰지 않고 색만)
# accent = 큰 숫자·라벨(panel 은 글씨색), glow = 배경 빛 (2개면 두 색이 섞임), name = 오른쪽 위에 찍히는 이름
brands:
  # style: panel = 밝은 하늘색 배경 + 남보라 큰 글씨 + 흰 패널 (T 멤버십 앱 이벤트 페이지 느낌). bg → bg2 위에서 아래로, splash = 진한 바탕 + 빛 번짐, panel_title = 흰 패널 머리줄
  SKT:
    name: SK텔레콤
    style: panel
    accent: "#3818C9"
    panel_title: "SKT 혜택"
    # splash 를 지우면 밝은 하늘색 배경(bg → bg2)으로 돌아감
    splash: {base: "#3818C9", hot: "#FF3E4A", soft: "#B3A6F2"}
    bg: "#A8DCF6"
    bg2: "#E4F4FC"
  KT:
    name: KT
    style: panel
    accent: "#E60012"
    panel_title: "KT 혜택"
    splash: {base: "#17171A", hot: "#E60012", soft: "#5A5A66"}
  LGU:
    name: LG U+
    style: panel
    accent: "#C4006B"
    panel_title: "U+ 혜택"
    splash: {base: "#4A0F6B", hot: "#E6007E", soft: "#B07BE0"}

reel:
  seconds_per_slide: 3.0      # 장당 노출 시간(초)
  transition: 0.4             # 장면 전환 시간(초)
  bgm: ""                     # 예: assets/bgm/calm.mp3 (저작권 없는 음원만!)
  bgm_volume: 0.8

# ---------------------------------------------------------------- 다른 채널
# 게시물(post.yml)에 channel: deals 를 적으면 아래 값이 위 기본값(스크린데일리)을 덮어씀
# 업로드 계정: GitHub Secrets 에 IG_ACCESS_TOKEN_<ig_secret_suffix>, IG_USER_ID_<ig_secret_suffix>
#   (graph.facebook.com 방식이면 Variables 에 IG_API_HOST_<ig_secret_suffix>)
channels:
  deals:                        # 혜택알람 (@hyetaek.alarm): 모든 혜택·할인 정보 채널 (통신사·카드·브랜드 이벤트·쿠폰 등)
    brand: "혜택알람"            # 카드 위쪽·마지막 장에 찍히는 이름
    handle: "@hyetaek.alarm"    # 카드 아래 워터마크·마지막 장
    ig_secret_suffix: DEALS
    channel_intro: |
      혜택알람 @hyetaek.alarm
      놓치기 쉬운 무료·할인 혜택, 기간과 받는 법까지 한 장에
      매일 낮 12시 새 혜택
    search_keywords: [할인 정보, 무료 쿠폰, 통신사 혜택, 멤버십 혜택, 이벤트 정보]
    default_hashtags:
      - 혜택알람
      - 할인정보
      - 오늘의혜택
      - 쿠폰
      - 이벤트
    alarm:                      # 혜택알람 고유 색: 밝고 젊은 톤 (오렌지 + 레몬 + 크림)
      accent: "#FF6B2C"         # 비비드 오렌지: 머리띠·라벨·아이콘
      cover_highlight: "#FFE14D" # 레몬: 표지 혜택 스티커·STEP 원·FOLLOW
      paper: "#FFF7EC"          # 크림: 2장 배경
      ink: "#1F1F24"            # 글자
      hide_credit: true         # 표지에 사진 출처를 찍지 않음 (게시글에 직접 적기)
      hide_page: true           # 페이지 번호(01/03) 표시 안 함
      splash: {base: "#FF6B2C", hot: "#FFB13B", soft: "#FFD9A0"}   # 3장 배경
    png: true                   # out/ 에 PNG 도 함께 저장
    outro:
      style: follow_card        # 3장 고정 팔로우 카드 (모든 게시물 동일)
      title: "무료·할인 혜택,\n놓치기 전에 팔로우!"
      sub: "놓치기 쉬운 혜택,\n혜택알람 받아보세요"
      inline_follow: "팔로우하고 혜택알람 받아보세요"   # 2장 STEP 아래 아이콘 옆
      # 이전 마지막 장(알람 켜기 스위치)으로 돌리려면 style: toggle
      toggle_label: "혜택 알람"
      follow_sub: "혜택 날짜, 먼저 알려드려요"
      cta: "팔로우하고 혜택 알람 받기"
      save: "저장해두고 날짜마다 꺼내 보기"
      question: "제일 탐나는 혜택은? 댓글로 알려주세요"

  gongam:                       # 오누이 공감툰: 오빠·동생 캐릭터 + 실사 배경 한 장 (월·수·금 21시)
    brand: "온이봄이"
    handle: "@onibomi.toon"
    image_watermark: "온이봄이 @onibomi.toon"   # 하단 가운데 채널명 (프로그램이 넣음, GPT 그림에는 글자 없음)
    copy_style:                 # post.yml copy: 글귀 (프로그램이 넣음, 고정)
      font: Pretendard-Medium.otf
      glyph: 0.016              # 글자 높이 = 세로의 1.6%
      line: 1.75                # 줄 간격 (글자 높이 배수)
      top: 0.19                 # 첫 줄 위치 (3줄 이하)
      top_long: 0.16            # 4줄 이상일 때
      scrim: 0.30               # 글귀 뒤 옅은 번짐 진하기 (0~1)
      name_glyph: 0.012         # 채널명 글자 높이 1.2%
      name_y: 0.915             # 채널명 위치 (위에서 91.5%)
      name_scrim: 0.22
    image_size: [1440, 1800]    # 업로드 이미지 고정 크기 (인스타 4:5 최대 해상도)
    png: true                   # out/ 에 PNG 도 함께 저장 (직접 올릴 때 고화질용)
    ig_secret_suffix: GONGAM    # GitHub Secrets: IG_ACCESS_TOKEN_GONGAM, IG_USER_ID_GONGAM
    schedule:                   # 연재 요일·시간 (lint 경고, next-slot 이 이 값으로 빈자리 계산)
      days: [0, 2, 4]           # 월=0, 수=2, 금=4
      time: "21:00"
    channel_intro: |
      온이봄이 @onibomi.toon
      오빠 온이와 동생 봄이의 하루, 마음 한 칸 쉬어 가는 공감툰
      월·수·금 밤 9시 연재
    search_keywords: [공감툰, 위로 글귀, 공감 글, 힐링 그림, 오늘의 위로]
    default_hashtags:
      - 온이봄이
      - 공감툰
      - 위로
      - 공감글귀
      - 오늘의위로
