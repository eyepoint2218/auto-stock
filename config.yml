# 스크린데일리 자동 업로드 설정
brand: SCREEN DAILY
handle: "@screendaily.mag"
timezone: Asia/Seoul          # post.yml 의 publish_at 은 이 시간대 기준

# 해시태그 개수 제한 (인스타 최대 5개). 게시물 hashtags 를 먼저 붙이고, 남는 자리에 아래 기본 해시태그를 순서대로 채움
hashtag_limit: 5
# 기본 해시태그 (중요한 것부터)
default_hashtags:
  - 영화추천
  - 드라마추천
  - 넷플릭스추천
  - OTT추천
  - 스크린데일리

# 마지막 장 (팔로우 유도)
outro:
  title: "매일 한 편,\n오늘 뭐 볼지\n고민 끝"
  cta: "팔로우하고 매일 추천 받기"
  save: "저장해두고 주말에 꺼내 보기"
  question: "여러분의 인생작은? 댓글로 알려주세요"

# 카테고리 라벨 색상
labels:
  MOOD: "#FFB547"
  WEEKEND: "#FF4D4D"
  HIDDEN: "#8B6CFF"
  ISSUE: "#36C5F0"
  ACTOR: "#FF6FA8"
  TIP: "#2EC4A0"
  default: "#FF4D4D"

# 이야기 카드(type: story)에 brand: 를 적으면 그 카드만 아래 색으로 바뀜 (로고는 쓰지 않고 색만)
# accent = 큰 숫자·라벨, glow = 배경 빛 (2개면 두 색이 섞임), name = 오른쪽 위에 찍히는 이름
brands:
  SKT: {name: SK텔레콤, accent: "#EA002C", glow: ["#EA002C", "#F47725"]}
  KT: {name: KT, accent: "#FF2C3A", glow: ["#E60012", "#3A0A0C"]}
  LGU: {name: LG U+, accent: "#E6007E", glow: ["#E6007E", "#7A1FA2"]}

reel:
  seconds_per_slide: 3.0      # 장당 노출 시간(초)
  transition: 0.4             # 장면 전환 시간(초)
  bgm: ""                     # 예: assets/bgm/calm.mp3 (저작권 없는 음원만!)
  bgm_volume: 0.8
