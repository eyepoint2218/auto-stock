# 스크린데일리 자동 업로드 설정
brand: SCREEN DAILY
handle: "@screendaily.mag"
timezone: Asia/Seoul          # post.yml 의 publish_at 은 이 시간대 기준

# 해시태그 개수 제한 (인스타 최대 5개). 게시물 hashtags 를 먼저 붙이고, 남는 자리에 아래 기본 해시태그를 순서대로 채움
hashtag_limit: 5
# 기본 해시태그 (중요한 것부터)
default_hashtags:
  - 영화추천
  - 드라마추천
  - 넷플릭스추천
  - OTT추천
  - 스크린데일리

# 마지막 장 (팔로우 유도)
outro:
  title: "매일 한 편,\n오늘 뭐 볼지\n고민 끝"
  cta: "팔로우하고 매일 추천 받기"
  save: "저장해두고 주말에 꺼내 보기"
  question: "여러분의 인생작은? 댓글로 알려주세요"

# 카테고리 라벨 색상
labels:
  MOOD: "#FFB547"
  WEEKEND: "#FF4D4D"
  HIDDEN: "#8B6CFF"
  ISSUE: "#36C5F0"
  ACTOR: "#FF6FA8"
  TIP: "#2EC4A0"
  default: "#FF4D4D"

# 이야기 카드(type: story)에 brand: 를 적으면 그 카드만 아래 색으로 바뀜 (로고는 쓰지 않고 색만)
# accent = 큰 숫자·라벨(panel 은 글씨색), glow = 배경 빛 (2개면 두 색이 섞임), name = 오른쪽 위에 찍히는 이름
brands:
  # style: panel = 밝은 하늘색 배경 + 남보라 큰 글씨 + 흰 패널 (T 멤버십 앱 이벤트 페이지 느낌). bg → bg2 위에서 아래로, splash = 진한 바탕 + 빛 번짐, panel_title = 흰 패널 머리줄
  SKT:
    name: SK텔레콤
    style: panel
    accent: "#3818C9"
    panel_title: "SKT 혜택"
    # splash 를 지우면 밝은 하늘색 배경(bg → bg2)으로 돌아감
    splash: {base: "#3818C9", hot: "#FF3E4A", soft: "#B3A6F2"}
    bg: "#A8DCF6"
    bg2: "#E4F4FC"
  KT:
    name: KT
    style: panel
    accent: "#E60012"
    panel_title: "KT 혜택"
    splash: {base: "#17171A", hot: "#E60012", soft: "#5A5A66"}
  LGU:
    name: LG U+
    style: panel
    accent: "#C4006B"
    panel_title: "U+ 혜택"
    splash: {base: "#4A0F6B", hot: "#E6007E", soft: "#B07BE0"}

reel:
  seconds_per_slide: 3.0      # 장당 노출 시간(초)
  transition: 0.4             # 장면 전환 시간(초)
  bgm: ""                     # 예: assets/bgm/calm.mp3 (저작권 없는 음원만!)
  bgm_volume: 0.8

# ---------------------------------------------------------------- 다른 채널
# 게시물(post.yml)에 channel: deals 를 적으면 아래 값이 위 기본값(스크린데일리)을 덮어씀
# 업로드 계정: GitHub Secrets 에 IG_ACCESS_TOKEN_<ig_secret_suffix>, IG_USER_ID_<ig_secret_suffix>
#   (graph.facebook.com 방식이면 Variables 에 IG_API_HOST_<ig_secret_suffix>)
channels:
  deals:                        # 혜택알람 (@today.hyetaek): 모든 혜택·할인 정보 채널 (통신사·카드·브랜드 이벤트·쿠폰 등)
    brand: "혜택알람"            # 카드 위쪽·마지막 장에 찍히는 이름
    handle: "@today.hyetaek"    # 카드 아래 워터마크·마지막 장
    ig_secret_suffix: DEALS
    default_hashtags:
      - 혜택알람
      - 할인정보
      - 오늘의혜택
      - 쿠폰
      - 이벤트
    outro:
      title: "오늘 혜택\n뭐 받지?\n고민 끝"
      cta: "팔로우하고 혜택 알람 받기"
      save: "저장해두고 날짜마다 꺼내 보기"
      question: "제일 탐나는 혜택은? 댓글로 알려주세요"
