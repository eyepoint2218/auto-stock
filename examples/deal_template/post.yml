# 혜택알람 3장 템플릿 (01 사진 표지 → 02 혜택 받는 법 → 03 공용 팔로우 카드)
# 새로 만들기: python -m screendaily new 2026-11-20 18:00 --deal 브랜드명
# 1) 표지: img/ 에 넣고 cover_image, 또는 웹에서 — cover_url(이미지·기사 주소, 대표 사진 자동) / cover_wiki(위키 문서명)
# 2) title 두 줄: 첫 줄 브랜드, 둘째 줄 혜택 핵심(짧게, 예: 수험생 반값 / 아메리카노 1+1)
# 3) STEP 3줄 (공식 확인된 내용만). 2장 하단 아이콘 문구·3장 팔로우 카드는 자동
# 4) 기간·조건·출처는 caption 에
publish_at: "{when}"
format: carousel
channel: deals
draft: true
cover_style: photo
cover_image: img/cover.jpg
theme: dark
title: "{brand}\n혜택 핵심"
items:
  - type: steps
    title: 혜택 받는 법
    desc: |
      STEP 1 내용
      STEP 2 내용
      STEP 3 내용
caption: |
  {brand}, 혜택 한 줄 요약

  📅 기간
  ✔ 혜택 내용
  📍 대상 매장·채널

  🎫 받는 법
  참여 방법 한두 줄

  ⚠ 주의사항
  출처: 공식 출처 (확인 날짜)

  팔로우하고 혜택알람 받아보세요 🔔
hashtags: [{brand}, 혜택알람]
