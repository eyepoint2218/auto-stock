items:
  - type: story
    year: "1997"
    stage: 데뷔
    title: "이름도 없는 ‘손님2’"
    desc: 영화 〈아버지〉에서 이름 대신 ‘손님2’로 불린 단역. 그것이 배우 오정세의 첫 배역이었어요.
  - type: story
    stage: 무명 시절
    title: "오디션만 1,000번 넘게"
    desc: 2023년 〈유 퀴즈 온 더 블럭〉에서 무명 시절 1,000번이 넘는 오디션을 봤다고 직접 밝혔어요. 100편이 넘는 작품에 출연했지만, 대중이 기억하는 작품은 10편이 채 안 될 정도였죠.
    bubble: "포기 안 함"
  - type: story
    year: "2006"
    stage: 첫 주연
    title: 독립영화로 얻은 첫 주연
    desc: 데뷔 9년 만에 독립영화 〈팔월의 일요일들〉로 처음 주연을 맡았어요. 하지만 대중이 그의 이름을 알기까지는 10년이 넘는 시간이 더 필요했습니다.
  - type: story
    year: "2017"
    stage: 주목
    title: "‘저 배우 누구지?’"
    desc: 영화 〈조작된 도시〉의 국선변호사 ‘민천상’ 역으로 관객의 눈에 띄기 시작했어요. 얼굴은 익숙했지만 이름은 몰랐던 배우가, 비로소 이름으로 불리기 시작한 순간.
  - type: story
    year: "2019"
    stage: 전환점
    title: "‘노규태’가 바꾼 인생"
    desc: 드라마 〈동백꽃 필 무렵〉의 노규태 역으로 ‘노큐티’라는 별명까지 얻으며 큰 사랑을 받았어요. 그리고 다음 해, 백상예술대상 TV 부문 남자 조연상을 받습니다.
  - type: quote
    year: "2020"
    stage: 백상예술대상 수상 소감
    title: "저한테는 동백이가 그랬습니다."
    desc: 힘든 시기를 보내는 사람들에게 자책하지 말라며, 꾸준히 하다 보면 받지 못했던 위로와 보상이 찾아온다는 이야기를 전했어요.
  - type: story
    stage: 지금
    title: 버틴 시간은 헛되지 않았다
    desc: 2021년 백상 조연상 2년 연속 수상, 2025년 넷플릭스 〈폭싹 속았수다〉까지. 최근 인터뷰에서 무명 시절 ‘무가치함’을 느낀 적 없냐는 질문에, 그는 단호하게 고개를 저었다고 해요.
caption: |
  1997년, 이름도 없는 ‘손님2’로 시작한 배우가 있어요 🎬
  오디션만 1,000번 넘게 보며 버틴 시간 끝에, 지금은 ‘믿고 보는 배우’가 된 오정세의 이야기.

  여러분에게도 ‘동백이’ 같은 존재가 있나요? 댓글로 들려주세요 👇
  다음엔 어떤 배우의 이야기가 궁금한지도 남겨주세요!
