# 시네마틱 매거진 4장 템플릿 (스크린데일리)
# 실제 작품 사진 80% + 짧은 흰 글씨 20%. 사진은 화면 가득, 하단 검정 그라데이션, 좌측 하단 큰 흰 고딕 2~3줄.
# 노란 글씨·강조 띠·아이콘·버튼·과한 보정 없음. 배우 얼굴은 AI 생성·대체 금지, 글자로 가리지 않기.
# 새로 만들기: python -m screendaily new 2026-12-01 18:00 --cinema 작품명   (drafts/ 에 초안)
# 사진: 공식 포스터·스틸만 img/ 에 넣는다 (01.jpg ~ 04.jpg). 출처는 credits 에.
#   없으면 미리보기에 '공식 사진 자리' 가 나온다 (그대로 올리지 말 것).
# 얼굴이 글자에 가리면: 표지 cover_focus, 카드 focus 를 "가로,세로" (0~1) 로. 세로 값을 키우면 사진이 위로 올라감
publish_at: "{when}"
format: carousel
draft: true
label: ISSUE
cover_style: cinema
outro_style: cinema

# 01 배우 중심 후킹 (배우 실명 + 관계·만남, 2줄)
cover_image: img/01.jpg
cover_focus: "0.5,0.3"
title: "배우 A와 배우 B의\n만남"

items:
  # 02 이야기 후킹 (줄거리 대신 한 줄)
  - type: cinema
    title: "이야기 한 줄\n후킹"
    image: img/02.jpg
    focus: "0.5,0.3"
  # 03 작품 공개 정보 (작품명·날짜 크게, 플랫폼 작게)
  - type: cinema
    title: "{work}"
    desc: "12월 5일 첫 방송"
    ott: "방송사 · OTT"
    image: img/03.jpg
    focus: "0.5,0.3"

# 04 팔로우 (사진을 차분하게 깔고 채널 주소만)
outro_image: img/04.jpg
outro_title: "다음 화제작도\n놓치지 마세요."
outro_cta: "팔로우하고 화제작 소식 먼저 받아보세요"

caption: |
