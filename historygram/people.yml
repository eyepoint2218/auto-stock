- {name: 사마의, years: "179~251", hook: '병든 노인인 척 10년을 기다린 끝에 정변을 일으켜, 삼국 누구도 아닌 그의 집안이 천하를 차지했다', done: true, ep: 24}
- {name: 여포, years: "?~199", hook: '천하제일 무장이 두 번이나 주인을 베고, 끝내 믿을 사람 하나 없이 무너졌다. 초선은 소설 속 인물', done: true, ep: 25}
