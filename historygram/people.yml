# 역사그램 인물 후보 (위에서부터 차례로). 만들면 done: true, ep 번호 기록.
# hook 은 출발점일 뿐: 제작 전에 반드시 사료로 다시 확인하고, 확인 안 되면 건너뛴다.
- {name: 김만덕, years: "1739~1812", hook: 제주 흉년에 재산을 털어 백성을 구하고 금강산 구경을 소원으로 말한 상인, done: true, ep: 1}
- {name: 김점동(박에스더), years: "1876~1910", hook: 한국 최초의 여성 서양 의사. 미국 유학 중 남편이 막노동으로 학비를 댔다, done: true, ep: 2}
- {name: 문무왕, years: "626~681", hook: 당을 몰아내 삼국통일을 마무리하고 죽어서 동해의 용이 되겠다고 한 왕 (드라마 방영 시기 특집), done: true, ep: 3}
- {name: 연개소문, years: "?~665", hook: 왕을 죽이고 권력을 잡았지만 당나라의 침략을 막아낸 고구려의 대막리지 (드라마 방영 시기 특집), done: true, ep: 4}
- {name: 고타소, years: "?~642", hook: 김춘추의 딸. 대야성 함락 때 세상을 떠났고 그 슬픔이 나당동맹으로 이어졌다 (드라마 방영 시기 특집), done: true, ep: 5}
- {name: 김춘추, years: "603~661", hook: 칼 대신 외교로 고구려·일본·당을 오가며 통일의 길을 연 태종무열왕 (드라마 방영 시기 특집), done: true, ep: 6}
# --- 드라마 〈문무〉 방영 기간 우선 (2026-11~): 남은 등장인물 ---
- {name: 김유신, years: "595~673", hook: 망한 금관가야 왕족의 후손이 신라 최고의 장군이 되어 삼국통일을 이끌었다 (드라마 문무 인물), done: true, ep: 7}
- {name: 계백, years: "?~660", hook: 황산벌에서 5천 결사대로 신라 5만 대군에 맞선 백제의 마지막 장군 (드라마 문무 인물), done: true, ep: 8}
- {name: 의자왕, years: "?~660", hook: '"해동증자"라 불린 효자 왕이 어떻게 나라를 잃었나, 삼천궁녀는 사실일까 (드라마 문무 인물)', done: true, ep: 9}
- {name: 성충, years: "?~656", hook: 바른말을 하다 옥에 갇혀 굶어 죽으면서도 백제를 지킬 방법을 남긴 충신 (드라마 문무 인물), done: true, ep: 10}
- {name: 김품석, years: "?~642", hook: '부하의 아내를 빼앗은 대가로 성을 잃고 삼국의 운명을 바꾼 김춘추의 사위 (드라마 문무 인물)', done: true, ep: 11}
- {name: 선덕여왕, years: "?~647", hook: '한국사 최초의 여왕, 첨성대와 황룡사 9층 목탑의 시대 (드라마 문무 인물)', done: true, ep: 12}
- {name: 윤충, years: "?~?", hook: 대야성을 무너뜨려 신라를 위기에 빠뜨린 백제 장군 (드라마 문무 인물), done: true, ep: 13}
- {name: 김진주, years: "?~662", hook: '백제 정벌군을 이끈 병부령이 2년 뒤 병을 핑계로 출전을 거부해 일족과 함께 처형됐다 (드라마 문무 인물)', done: true, ep: 14}
- {name: 문명왕후(문희), years: "?~?", hook: '언니의 꿈을 비단 치마로 사서 김춘추의 왕비가 되고 문무왕을 낳은 김유신의 누이 (드라마 문무 인물)', done: true, ep: 15}
# --- 이후 기존 순서 ---
- {name: 이회영, years: "1867~1932", hook: 6형제가 전 재산을 처분해 만주로 건너가 신흥무관학교를 세웠다}
- {name: 우장춘, years: "1898~1959", hook: '"씨 없는 수박을 만든 사람"은 사실이 아니다. 진짜 업적은 종의 합성 이론과 한국 농업 종자'}
- {name: 권기옥, years: "1901~1988", hook: 한국 최초의 여성 비행사. 독립운동을 위해 조종사가 되었다}
- {name: 정약전, years: "1758~1816", hook: 흑산도 유배지에서 어부와 함께 바다 생물을 기록해 『자산어보』를 남겼다}
- {name: 서희, years: "942~998", hook: 거란 80만 대군 앞에서 칼 대신 말로 강동 6주를 얻어냈다}
- {name: 유일한, years: "1895~1971", hook: 회사를 자식에게 물려주지 않고 전 재산을 사회에 환원한 기업인}
- {name: 전형필(간송), years: "1906~1962", hook: 일제강점기 재산을 들여 『훈민정음 해례본』 등 문화재를 지켜냈다}
- {name: 남자현, years: "1872~1933", hook: 손가락을 잘라 혈서를 쓴 여성 독립운동가}
- {name: 석주명, years: "1908~1950", hook: 나비 수십만 마리를 직접 재며 한국 나비를 정리한 학자}
- {name: 최재형, years: "1860~1920", hook: 노비의 아들로 태어나 연해주 부호가 되어 독립운동을 후원했다}
- {name: 이예, years: "1373~1445", hook: 일본에 수십 차례 건너가 왜구에게 끌려간 조선인들을 데려온 외교관}
- {name: 홍대용, years: "1731~1783", hook: 조선에서 지구가 돈다고 주장한 과학자}
- {name: 김육, years: "1580~1658", hook: 평생을 걸고 대동법 확대를 밀어붙인 재상}
- {name: 허난설헌, years: "1563~1589", hook: 조선에서 요절했지만 시집이 중국과 일본에서 먼저 이름을 떨친 시인}
- {name: 박연(벨테브레이), years: "1595~?", hook: 조선에 표류해 귀화하고 무기 개발을 도운 네덜란드인}
- {name: 최용신, years: "1909~1935", hook: 소설 『상록수』 주인공의 실제 모델이 된 농촌 계몽 운동가}
- {name: 이종욱, years: "1945~2006", hook: 한국인 최초의 국제기구 수장(WHO 사무총장)이 된 '아시아의 슈바이처'}
- {name: 방정환, years: "1899~1931", hook: '"어린이"라는 말을 널리 쓰고 어린이날을 만든 사람'}
- {name: 김정호, years: "?~?", hook: 백두산을 여러 번 올랐다는 이야기는 근거가 없다. 진짜 비밀은 목판으로 찍는 지도}
- {name: 문익점, years: "1329~1398", hook: 붓대에 목화씨를 숨겨 왔다는 이야기는 후대에 덧붙여졌다}
- {name: 이태영, years: "1914~1998", hook: 한국 최초의 여성 변호사. 가족법 개정 운동을 이끌었다}
- {name: 강항, years: "1567~1618", hook: 일본에 포로로 끌려가 일본 성리학에 큰 영향을 남긴 선비}
- {name: 이순지, years: "?~1465", hook: 세종의 명으로 조선의 하늘을 계산해 독자 역법 『칠정산』 편찬에 참여한 천문학자}
