images:
  era: 고구려 말기(642~668년)와 멸망 뒤 요동(677~681년)
  hero: 고구려의 마지막 왕. 30~40대(즉위)부터 60~70대까지 나이가 드는 모습. 고구려 고분벽화풍 왕의 복식(새 깃털 꽂은 금관, 통 넓은 소매), 빛바랜 연청색 비단 겉옷과 금장식. 멸망 뒤에는 관 없이 상투에 낡은 연청색 겉옷. 앞 회차 고구려 인물(연개소문 붉은색·고건무 녹색·광개토대왕 자주색·장수왕 남색)과 구별
  scenes:
    2: 642년 고구려 평양 궁궐의 큰 전각. 높은 왕좌에 앉은 왕의 뒷모습(새 깃털 금관, 연청색 겉옷)이 작아 보이고, 그 앞 계단 아래 붉은 갑옷과 붉은 망토를 두른 거구의 장수가 당당하게 서서 신하들을 내려다본다(장수 얼굴은 그림자로 가림). 왕보다 장수가 더 크게 보이는 구도. 무겁고 긴장된 분위기.
    3: 642년 평양 궁궐. 붉은 망토의 장수가 내미는 금관(새 깃털 장식)을 두 손으로 받는 왕의 손과 뒷모습(연청색 겉옷). 뒤로 무릎 꿇은 신하들, 바닥에 흩어진 깨진 그릇과 넘어진 의자로 정변의 흔적만 암시. 피는 그리지 않는다. 어둡고 불안한 분위기.
    3.5: 668년 가을 평양성. 성벽 위로 연기가 피어오르고, 성문 앞으로 끝없이 몰려든 당나라 군대와 깃발(글자 없이 무늬만). 성벽 위에서 그 모습을 내려다보는 늙은 왕의 뒷모습(금관, 연청색 겉옷, 흰머리). 피와 시신은 그리지 않는다. 회색 하늘, 무너지는 분위기.
    4: 680년 무렵 요동 벌판의 작은 성 안 어두운 방. 등불 아래 탁자에 펼친 지도(산과 강만, 글자 없음)를 사이에 두고, 털모자와 가죽옷 차림의 말갈 장수(얼굴은 그림자)와 은밀히 이야기를 나누는 노인의 뒷모습(관 없이 상투, 낡은 연청색 겉옷, 흰머리). 창밖에는 당나라 병사가 지키는 성벽. 은밀하고 긴장된 분위기. 화면 위쪽은 어두운 천장과 기둥으로 단순하게.
    5: 70대 고구려 마지막 왕의 정면 상반신. 관 없이 흰 상투, 낡은 연청색 비단 겉옷, 깊은 주름과 흰 수염, 나라를 잃은 슬픔과 끝까지 꺾이지 않은 의지가 함께 담긴 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 쓸쓸한 요동 벌판과 저녁 노을.

caption: |
  나라를 잃은 왕이 적국의 벼슬을 받고 돌아와, 몰래 나라를 되살리려 했어요. 고구려의 마지막 왕, 보장왕 이야기예요.

  보장왕은 영류왕의 조카예요. 642년 연개소문이 정변을 일으켜 영류왕과 대신들을 죽인 뒤 그를 왕위에 올렸죠. 나라의 실권은 연개소문이 쥐고 있었어요. 이듬해에는 연개소문의 뜻에 따라 당나라에 도교를 청해 받아들이기도 했어요.

  645년 당 태종의 대군을 안시성에서 막아 내는 등, 고구려는 20여 년 동안 당의 침략을 버텼어요. 하지만 666년 연개소문이 세상을 떠나자 아들들 사이에 다툼이 일어났고, 668년 나당연합군에 평양성이 함락되었어요. 보장왕은 항복해 당나라로 끌려갔습니다.

  고구려 유민들의 저항이 그치지 않자, 당은 677년 보장왕을 요동으로 돌려보내 유민을 다스리게 했어요. 그런데 보장왕은 오히려 말갈과 몰래 손잡고 고구려를 되살리려 했죠. 이 일이 드러나 681년 먼 남쪽 공주(지금의 중국 쓰촨성)로 유배되었고, 이듬해 그곳에서 세상을 떠났어요.

  힘없는 왕으로 기억되지만 마지막까지 나라를 놓지 않은 왕, 여러분은 보장왕을 어떻게 보시나요?

  * 1장 내용은 『삼국사기』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 677년에 받은 벼슬은 자료에 따라 조선왕 또는 조선군왕으로 다르게 적힙니다.

