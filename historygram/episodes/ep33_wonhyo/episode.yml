images:
  era: 신라 7세기(삼국 통일 전후, 650~686년)
  hero: 신라의 승려. 40대(첫 두 그림)부터 60대까지. 삭발한 머리, 마른 체격, 낡은 황갈색 삼베 승복과 짚신, 등에 작은 바랑. 거리 장면에서는 큰 표주박(박)을 든 모습. 앞 회차 승려 도림(회색 승복)과 구별
  scenes:
    2: 661년 비 오는 밤이 지난 새벽, 바닷가 근처 언덕의 무너진 옛 무덤 토굴 안. 입구로 희미한 새벽빛이 들어오고, 바닥 구석에 오래되어 하얗게 바랜 해골 하나와 빗물이 고인 깨진 그릇(무섭지 않게, 작게). 그것을 내려다보며 멈춰 선 승려의 뒷모습(황갈색 승복). 고요하고 무언가를 깨닫는 분위기.
    3: 서해 바닷가 갈림길. 바다 쪽 항구로 걸어가는 젊은 승려(동료, 회색 승복, 뒷모습)와, 반대 방향 신라 내륙 쪽으로 홀로 걸어가는 승려의 뒷모습(황갈색 승복, 바랑). 맑게 갠 아침 하늘, 담담하고 홀가분한 분위기.
    3.5: 신라 절의 작은 방 안. 등불 아래 낮은 책상에서 붓을 들고 두루마리에 글을 쓰는 승려의 손과 뒷모습(황갈색 승복). 주변에 쌓인 경전 두루마리와 책(글자는 알아볼 수 없게). 창밖은 깊은 밤, 고요하고 집중된 분위기.
    4: 7세기 신라 경주의 마을 거리. 큰 표주박을 두 손으로 들고 덩실덩실 춤추며 노래하는 승려의 뒷모습(황갈색 승복, 삭발). 그를 둘러싸고 웃으며 따라 하는 농부, 아이들, 장사꾼 등 평범한 백성들. 초가와 기와집이 섞인 거리, 밝고 따뜻한 분위기. 넓고 맑은 하늘이 화면 위쪽을 넓게 채운다.
    5: 60대 신라 승려의 정면 상반신. 삭발한 머리, 마르고 주름진 얼굴, 낡은 황갈색 삼베 승복, 한 손에 표주박, 소탈하고 맑은 미소와 깊은 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 경주 남산의 소나무 숲과 저녁 하늘.

caption: |
  밤새 달게 마신 물이 알고 보니 해골에 고인 물이었다는 이야기, 들어 보셨나요? 이 이야기의 주인공은 신라의 승려 원효예요.

  원효는 의상과 함께 두 번이나 당나라 유학을 떠났어요. 650년에는 고구려 땅에서 붙잡혀 돌아왔고, 661년 다시 서해 바닷가에 이르렀을 때 비를 피해 하룻밤 머문 곳이 알고 보니 옛 무덤이었죠. 그는 이 일로 모든 것이 마음먹기에 달렸다는 깨달음을 얻고, 유학을 그만두고 신라로 돌아왔어요.

  원효는 모든 것의 바탕이 한마음이라는 일심 사상을 바탕으로, 서로 다투던 여러 불교 이론을 하나로 아우르는 화쟁 사상을 펼쳤어요. 『대승기신론소』, 『금강삼매경론』, 『십문화쟁론』 등 많은 책을 남겼고, 그의 글은 중국에서도 읽혔어요.

  그때까지 불교는 주로 왕실과 귀족의 것이었어요. 원효는 큰 박을 들고 거리와 마을을 다니며 무애가를 부르고 춤을 추었고, 어려운 경전을 몰라도 나무아미타불만 정성껏 외면 극락에 갈 수 있다고 가르쳤어요. 덕분에 가난한 백성들도 부처의 이름을 알게 되었다고 해요.

  유학 대신 백성 곁을 택한 승려, 여러분은 원효의 깨달음을 어떻게 보시나요?

  * 1장의 해골물 이야기는 후대 중국 책 『종경록』에 전하는 이야기이고, 『송고승전』에는 무덤 속에서 하룻밤을 보낸 일로 적혀 있습니다. 2~5장 장면은 재구성한 연출이며, 7장의 얼굴은 상상화입니다.

hashtags: [역사그램, 원효, 신라, 한국사, 한능검]

# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [원효, 원효대사, 해골물, 일심 사상, 화쟁 사상, 십문화쟁론, 대승기신론소, 금강삼매경론, 아미타 신앙, 무애가, 불교 대중화, 한국사능력검정시험]

sources:
  - 한국민족문화대백과 원효 항목
  - 서울신문, 서동철 「원효, 中 유학길에 당항성 토굴서 깨달음 얻어…의상은 홀로 당나라로」(2018)
  - 한국경제 생글생글, 대원고 최경석 쌤의 술술 읽히는 한국사(2015)
  - 서울신문, 김형효 「원효의 화쟁사상」(2006)
  - 한국교육신문, 「우리 사상사의 새벽을 연 실천가 원효」
  - Wikipedia, "Wonhyo"

staging:
  - 617~686 생몰, 650년 의상과 유학 시도 중 고구려에서 붙잡혀 실패, 661년 재시도 중 당항성 부근 토굴(옛 무덤)에서 깨달음을 얻고 귀국, 의상은 홀로 당으로 감, 일심·화쟁 사상, 『대승기신론소』·『금강삼매경론』·『십문화쟁론』 저술, 무애가와 불교 대중화는 자료로 확인
  - 해골물은 『송고승전』에 없고 『종경록』 등 후대 기록 → 1장 전해지는 이야기 표기, 게시글 각주에 밝힘
  - 아미타 신앙(나무아미타불 염불)으로 백성에게 불교를 알렸다는 것은 『삼국유사』 원효불기 조와 교과서 통설
  - 그의 글이 중국에서도 읽혔다는 것은 『금강삼매경론』이 논으로 불린 일화 등에 근거한 통설로 넓게 씀
  - 요석공주·설총 이야기는 업적 흐름에서 벗어나 쓰지 않음
  - 2장 해골은 작고 무섭지 않게, 3장 의상(동료)은 뒷모습으로만
  - 3장 갈림길, 3.5장 저술, 4장 거리 장면은 연출
  - 7장 얼굴은 상상화
