# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [김춘추, 태종무열왕, 무열왕, 나당동맹, 토끼와 거북, 선도해, 연개소문, 당 태종, 고타소, 김유신, 문무왕, 드라마 문무]

sources:
  - 경북매일, 김춘추·김유신 관련 연재 기사(2023)
  - 한국경제 생글생글, 김춘추 외교 기사(2021-07-16)
  - 위키문헌, 글로벌 세계 대백과사전 「신라의 삼국통일」
  - 서울대 규장각 한국학연구원 논문(김춘추 입당 관련)
  - 『삼국사기』 김유신 열전·태종무열왕 본기, 『일본서기』 대화 3년(원문 직접 대조는 못 함)

staging:
  - 1장 토끼와 거북(선도해) 이야기는 『삼국사기』 김유신 열전에 전하는 내용으로 알려짐, 이번 검색에서는 직접 확인 못 함 → "전해요"로 표현
  - 2장 객사 장면, 3장 사신선, 3.5장 장안 대전, 4장 누각 장면은 연출
  - 647년 왜 방문은 『일본서기』 기록으로 알려짐(이번 검색에서 직접 확인 못 함)
  - 648년 입당, 아들(문왕)을 남긴 일, 나당동맹은 기사·논문으로 확인. 밀약 내용 자체의 신빙성은 학계 논쟁 있음
  - 진골 최초 왕은 확인, 즉위 654년은 통설
  - 7장 얼굴은 상상화
