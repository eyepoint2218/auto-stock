images:
  era: 신라 선덕여왕~무열왕 시대(7세기 중반)
  hero: 40~50대 신라 귀족 남성(훗날 왕), 단정한 수염, 앞 회차와 같은 자줏빛 신라 귀족 관복과 관모. 외교 사신답게 차분하고 위엄 있는 몸짓
  scenes:
    2: 642년 겨울 고구려 평양의 어두운 객사(감옥처럼 갇힌 방). 창살 너머로 들어오는 희미한 달빛, 바닥에 앉은 신라 사신의 뒷모습(자줏빛 관복). 창살 밖에서 고구려 관리 한 사람이 몸을 숙여 무언가를 조용히 속삭인다. 긴장되고 고요한 분위기.
    3: 647년 무렵 바다를 건너는 신라 사신선. 뱃전에 서서 수평선 너머를 바라보는 사신의 뒷모습(자줏빛 관복, 관모, 바람에 날리는 소매). 거친 파도와 흐린 하늘, 멀리 보이는 섬들. 깃발은 글자 없이 무늬만.
    3.5: 648년 당나라 장안 궁궐의 대전 안. 높은 단 위 용상에 앉은 당 태종(얼굴은 작게), 그 아래에서 두 손을 모아 예를 갖춘 신라 사신의 뒷모습과 그 곁의 젊은 아들의 뒷모습. 양옆에 늘어선 당나라 관리들, 붉은 기둥과 화려한 천장.
    4: 660년 무렵 신라 서라벌. 높은 누각 위에서 들판 너머를 바라보는 왕의 뒷모습(자줏빛 관복 위에 왕의 장식이 더해진 차림, 관모). 들판에는 출정하는 신라군의 긴 행렬과 깃발. 맑고 넓은 아침 하늘이 화면 위쪽을 넓게 채운다.
    5: 50대 신라 왕의 정면 상반신. 자줏빛 왕의 관복, 관모, 단정한 수염, 지혜롭고 온화하지만 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 경주 들판과 낮은 언덕 위 고분(무열왕릉), 부드러운 오후 햇빛.

caption: |
  적국에 갇혀 목숨이 위태롭던 그를 살린 건 칼이 아니라 이야기 하나였어요. 칼 대신 말로 삼국통일의 길을 연 신라의 김춘추, 태종무열왕 이야기예요.

  642년 딸 고타소를 대야성에서 잃은 김춘추는 백제를 꺾을 힘을 찾아 직접 고구려로 갔어요. 하지만 연개소문의 고구려는 옛 땅을 돌려달라며 그를 붙잡아 두었죠. 이때 고구려 신하 선도해가 들려준 '토끼와 거북' 이야기에서 꾀를 얻어, 땅을 돌려주겠다는 약속으로 겨우 풀려났다고 전해요.

  그는 멈추지 않았어요. 647년에는 왜(일본)에 건너갔고, 648년에는 아들과 함께 당나라로 가 당 태종을 만났습니다. 아들을 당에 남겨 두겠다며 진심을 보였고, 마침내 나당동맹을 맺었어요.

  654년 그는 성골이 아닌 진골로는 처음으로 신라의 왕위에 올랐어요. 그리고 660년 김유신과 함께 백제를 무너뜨리며 삼국통일의 문을 열었습니다. 그 통일은 아들 문무왕이 마무리했어요.

  칼보다 말이 강했던 왕, 여러분은 김춘추의 외교를 어떻게 보시나요?

  * 1장의 '토끼와 거북' 이야기는 『삼국사기』 김유신 열전에 전하는 이야기이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다.

