images:
  era: 중국 후한 말(2세기 말)
  hero: 후한 말의 무장. 30대 남성, 크고 단단한 체격, 날카로운 눈매. 후한식 찰갑 위 붉은 전포, 머리 뒤로 묶은 머리와 꿩 깃털 장식이 달린 관(과장하지 않게), 긴 극(창), 붉은빛이 도는 큰 말. 3세기 후한 복식(명·청·일본풍 금지). 앞 회차 관우(녹색)·유비(붉은 망토·찰갑)와 구별되게 붉은 전포에 검은 찰갑
  scenes:
    2: 198년 겨울 하비성 성루. 눈발 속에서 홀로 서서 성 밖을 둘러싼 수많은 적군의 횃불을 내려다보는 무장의 뒷모습(검은 찰갑, 붉은 전포, 긴 극). 성루 아래 병사들은 등을 돌린 채 수군거린다. 고독하고 비장한 분위기.
    3: 2세기 말 북방 초원. 붉은 말을 타고 질주하며 활을 쏘는 무장의 뒷모습(검은 찰갑, 붉은 전포가 휘날림), 멀리 날아가는 화살. 넓은 하늘과 흙먼지. 역동적이고 압도적인 분위기.
    3.5: 192년 장안 궁궐 문 앞. 긴 극을 거꾸로 짚고 선 무장의 뒷모습, 그 발치에 떨어진 화려한 관복의 옷자락과 관(사람은 그리지 않는다). 무장 뒤로 돌아서서 걸어가는 그림자 두 개가 땅에 길게 늘어져 있다. 피는 그리지 않는다. 서늘하고 상징적인 분위기.
    4: 199년 초 하비성. 물에 잠긴 성 아래, 성문 앞 계단에서 밧줄에 묶인 채 무릎 꿇은 무장의 뒷모습(갑옷이 벗겨진 붉은 속옷). 그 앞 높은 단 위에 앉은 두 사람(남색 관복의 재상, 붉은 망토의 장수)의 작은 실루엣. 피는 그리지 않는다. 흐린 겨울 하늘이 화면 위쪽을 넓게 채운다.
    5: 30대 후한 말 무장의 정면 상반신. 검은 찰갑 위 붉은 전포, 꿩 깃털 장식 관(과장하지 않게), 짙은 눈썹, 자신만만하지만 쓸쓸한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화·게임 캐릭터식 과장 금지). 뒤로 물에 잠긴 하비성과 흐린 하늘.

caption: |
  천하에서 가장 강했던 무장이, 끝내 믿을 사람 하나 없이 무너졌어요. 삼국지의 여포 이야기예요.

  여포는 말 타고 활 쏘는 솜씨가 뛰어나고 힘이 남달라 '비장(날아다니는 장수)'이라 불렸다고 정사 『삼국지』에 적혀 있어요. 하지만 그는 처음 섬긴 주인 정원을 동탁의 꾐에 넘어가 죽였고, 192년에는 왕윤과 손잡고 그 동탁마저 죽였습니다.

  그 뒤로도 여포는 이곳저곳을 떠돌며 편을 바꿨어요. 자신을 받아 준 유비의 서주를 빼앗았고, 원술과 손잡았다 등을 돌리기를 반복했죠. 198년 조조와 유비가 손잡고 하비성을 에워싸자, 결국 부하들이 그를 배신하고 성문을 열었어요. 여포는 사로잡혀 조조에게 처형되었습니다.

  동탁과 여포 사이를 갈라놓은 미녀 초선은 소설 『삼국지연의』가 만든 인물이에요. 정사에는 여포가 동탁의 시녀와 몰래 가까워져 불안해했다는 짧은 기록만 있어요.

  가장 강했지만 끝내 믿음을 얻지 못한 무장, 여러분은 여포를 어떻게 보시나요?

  * 초선은 『삼국지연의』의 창작 인물이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 여포가 처형된 때는 198년 말~199년 초로 전하며, 생년은 전하지 않습니다.

