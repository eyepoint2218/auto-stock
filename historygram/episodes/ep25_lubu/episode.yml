  - 원문사극(극을 활로 맞힌 일), '사람 중에 여포 말 중에 적토' 출전, 유비·조조의 마지막 대화는 이번 검색에서 출처 확인 못 해서 쓰지 않음
  - 2장 하비성 성루, 3장 기마 궁술, 3.5장 궁궐 문(사람·피 없음), 4장 포박 장면은 연출
  - 7장 얼굴은 상상화
