images:
  era: 백제 말기(7세기 중반)
  hero: 백제의 왕. 2번째·3번째 그림은 40대, 나머지는 50~60대. 백제 왕의 복식(검은 비단 관에 금꽃 장식, 붉은 계열의 넓은 소매 도포, 허리띠). 전장에서는 갑옷 위 붉은 왕의 망토
  scenes:
    2: 660년 무렵 부여 백마강 가의 깎아지른 바위 절벽(낙화암) 위 정자. 안개 낀 새벽 강물과 흐린 하늘. 사람은 그리지 않고, 바위 위에 놓인 꽃잎 몇 장만. 쓸쓸하고 고요한 분위기. 화면 위쪽 강 건너 산.
    3: 641년 무렵 백제 사비성 궁궐 안 사당. 촛불 앞에서 위패를 향해 깊이 절하는 왕의 뒷모습(백제 왕의 관과 도포). 뒤에 조용히 서 있는 신하들. 따뜻하고 경건한 분위기.
    3.5: 642년 백제군 진영. 산성이 보이는 언덕 위에서 말을 타고 군대를 지휘하는 왕의 뒷모습(갑옷 위 붉은 망토, 금장식 투구). 앞쪽으로 진격하는 백제 병사들과 깃발(글자 없이 무늬만), 멀리 연기가 오르는 신라 산성.
    4: 660년 여름 사비성 함락 무렵. 불길과 연기가 오르는 궁궐 성벽 위에서, 백마강 너머 몰려오는 수많은 배와 군대를 바라보는 늙은 왕의 뒷모습(관과 도포, 축 처진 어깨). 깃발은 글자 없이 무늬만. 피나 시신은 그리지 않는다. 화면 위쪽은 연기 낀 붉은 하늘.
    5: 60대 백제 왕의 정면 상반신. 검은 비단 관에 금꽃 장식, 붉은 도포, 회색 섞인 수염, 회한과 위엄이 함께 담긴 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 백마강과 부소산, 흐린 저녁 하늘.

caption: |
  백제가 무너지던 날 삼천 궁녀가 낙화암에서 뛰어내렸다는 이야기, 사실일까요? 사실은 조선 시대 시에서 처음 나온 표현이에요. 그 이야기 속 왕, 의자왕의 진짜 모습을 만나 볼까요?

  의자왕은 무왕의 맏아들로, 부모를 효성으로 섬기고 형제와 우애가 깊어 '해동증자'라 불렸어요. 증자는 효자로 이름난 공자의 제자예요.

  641년 왕위에 오른 그는 이듬해 직접 군사를 이끌고 신라의 성 40여 곳을 빼앗았고, 장군 윤충을 보내 대야성까지 무너뜨렸어요. 신라는 큰 위기에 빠졌죠.

  하지만 그 위기가 김춘추를 움직여 나당동맹이 맺어졌어요. 660년 당나라와 신라의 연합군이 쳐들어오자 계백의 결사대가 황산벌에서 막아섰지만, 사비성은 끝내 함락되었어요. 의자왕은 항복했고 당나라로 끌려가 그해 세상을 떠났다고 전해요.

  '삼천'은 많다는 뜻의 문학적 표현이었어요. 당시 사비성 인구를 생각해도 삼천 궁녀는 과장이라는 게 학계의 견해예요. 망한 나라의 왕은 늘 나쁘게 기억되기 쉽지만, 의자왕은 한때 신라를 몰아붙인 강한 왕이기도 했어요.

  여러분은 의자왕을 어떤 왕으로 기억하고 계셨나요?

  * 2~5장 장면은 기록을 바탕으로 재구성한 연출이며, 7장의 얼굴은 상상화입니다. '삼천 궁녀'는 조선 초 김흔의 시 「낙화암」에서 처음 보이는 표현입니다.

