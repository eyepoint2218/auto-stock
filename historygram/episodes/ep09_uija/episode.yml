# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [의자왕, 삼천궁녀, 낙화암, 해동증자, 백제 멸망, 사비성, 대야성, 윤충, 계백, 나당연합군, 부여, 드라마 문무]

sources:
  - itwiki 의자왕 항목
  - 위키문헌, 『삼국사기』 권28 백제본기 의자왕 번역
  - 매일신문, 삼천궁녀·낙화암 관련 기사(2014-09-04, 2015-06-02)
  - 서울신문, [백제를 다시본다] 패망의 설화(1994-09-16)
  - 경북매일, 황산벌 관련 기사(2023-07-18)

staging:
  - 1장 '삼천 궁녀는 사실이 아님'은 조선 초 김흔의 시에서 처음 보이고 1960년대 사전 항목으로 굳어졌다는 연구에 근거. 궁녀들이 몸을 던졌다는 일 자체는 『삼국유사』 타사암 기록이 있어 "삼천"이라는 숫자가 과장이라는 쪽으로 씀
  - 해동증자, 641년 즉위, 642년 40여 성 함락과 대야성 공격은 『삼국사기』 백제본기 기록으로 확인
  - 660년 항복과 당 압송은 확인, 당에서 사망 시점은 이번 검색에서 직접 확인 못 함 → "전해요"
  - 2장 낙화암(사람 없음), 3장 사당, 3.5장 출정, 4장 함락 장면은 연출
  - 망국의 원인(말년의 사치·간언 무시 등)은 평가가 갈려 카드에 쓰지 않음
  - 7장 얼굴은 상상화
