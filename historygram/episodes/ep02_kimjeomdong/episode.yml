staging:
  - 1장은 당시 상황 서술(내외 관습으로 여성이 남자 의사 진료를 받기 어려웠음)
  - 2장 수술 장면 구도는 연출(입술갈림증 수술을 보고 의사를 결심한 일은 여러 자료에 기록)
  - 3장 미국 유학은 기록, 농가 현관 장면은 연출(남편은 농장에서 일하며 뒷바라지)
  - 4장 평양 겨울 진료 장면은 연출(귀국 후 보구여관·평양에서 여성 환자를 진료한 것은 기록)
  - 10개월간 3천여 명 진료설, 평양 맹아학교·간호학교 설립 관여는 교차 확인 전이라 쓰지 않음
  - 업적 중심으로 재구성(남편 이야기는 카드에서 뺌)
  - 출생 연도 1876·1877·1879년 설 → 1876년(위키백과 기준)
  - 7장(인물 공개) 얼굴은 상상화(실제 사진은 남아 있음)
  - 4장(귀국) 제물포 항구 장면은 연출(1900년 귀국은 기록, 도착 항구는 확인 안 함)
