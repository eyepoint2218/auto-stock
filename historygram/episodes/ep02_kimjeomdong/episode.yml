images:
  era: 조선 말·대한제국(1890~1900년대)
  hero: 1876년생 조선 여성. 2번째 그림은 10대 소녀, 3~5번째 그림은 20대 여성
  scenes:
    2: 1890년 서울 정동의 한옥 여성 병원 진료실. 1890년대 서양식 드레스를 입은 20대 서양인 여의사가 입술갈림증(언청이) 아이의 입술을 수술하고, 아이 어머니가 곁에서 두 손을 모으고 지켜본다. 수술 장면은 피 없이 담담하게. 화면 앞쪽에 등불을 들고 선 10대 조선 소녀(주인공)의 뒷모습, 길게 땋은 댕기 머리, 저고리와 치마. 창호지 창으로 들어오는 빛.
    3: 1890년대 후반 미국 뉴욕 근교의 늦가을 농장. 넓은 밭에서 작업복 차림으로 땀 흘리며 일하는 20대 조선 남성(짧은 머리). 화면 앞쪽 나무 농가 현관에 두꺼운 의학책을 품에 안고 그를 바라보는 주인공 여인의 뒷모습(1890년대 서양식 긴 드레스, 단정하게 틀어 올린 머리). 기울어지는 오후 햇빛.
    4: 1900년대 초 평양의 겨울. 눈 덮인 초가 마을 길을 검은 왕진 가방을 들고 혼자 걸어가는 주인공 여인의 뒷모습(한복 위에 두꺼운 겉옷, 머리에 방한모). 길 끝 사립문 앞에서 아이를 안은 어머니와 노인이 기다린다. 차갑고 맑은 겨울 하늘, 발자국이 이어진 눈길.
    5: 1900년 무렵의 20대 중반 조선 여성 의사의 정면 상반신. 높은 깃의 짙은 색 서양식 드레스, 단정하게 틀어 올린 머리, 목에 건 청진기. 뒤로 한옥 진료소 마당과 기다리는 환자들이 흐릿하게 보인다. 차분하고 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화된 미인형 금지).

caption: |
  조선의 여성들은 아파도 남자 의사에게 몸을 보이기 어려웠다. 그 벽을 처음 넘은 조선 여성이 있다.

  1890년, 이화학당에 다니던 소녀 김점동은 서양 여의사 로제타 셔우드 홀의 통역을 맡았다. 수술을 돕는 일은 내키지 않았지만, 입술갈림증 아이를 고쳐 주는 수술을 본 뒤 의사가 되겠다고 마음먹었다.

  1894년 남편 박유산과 함께 미국으로 건너간 그는 1896년 볼티모어 여자의과대학에 입학했고, 1900년 한국 여성 최초로 의학박사 학위를 받았다.

  같은 해 조선으로 돌아온 그는 서울의 여성 병원 보구여관에서, 이어 평양에서 로제타 홀과 함께 여성과 아이들을 진료했다. 남자 의사에게 갈 수 없던 여성들에게 그는 처음으로 찾아갈 수 있는 조선인 의사였다. 쉬지 않고 환자를 돌보던 그는 결핵에 걸려 1910년 세상을 떠났다. 결혼 뒤 남편의 성과 세례명을 따른 박에스더라는 이름으로도 알려져 있다.

  조선 여성 최초의 의사, 여러분은 오늘 처음 알게 되셨나요?

  * 2·3장 장면은 기록을 바탕으로 재구성한 연출이며, 6장의 얼굴은 실제 사진이 아닌 상상화입니다. 출생 연도는 자료에 따라 1876·1877년 등으로 다르게 전합니다.

