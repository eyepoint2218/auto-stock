staging:
  - 1장은 대사가 아닌 사실 서술(남편은 졸업 전에 사망)
  - 2장 수술 장면 구도는 연출(입술갈림증 수술을 보고 의사를 결심한 일은 여러 자료에 기록)
  - 3장 남편이 농장에서 일한 것은 기록, 아내가 현관에서 지켜보는 구도는 연출
  - 4장 평양 겨울 진료 장면은 연출(귀국 후 서울·평양에서 진료한 것은 기록)
  - 남편 사망 시점은 자료마다 다름(1899년, 졸업 3주 전, 6개월 전) → 게시글은 "졸업을 앞두고"로만 씀
  - 출생 연도 1876·1877·1879년 설 → 1876년(위키백과 기준)
  - 6장 얼굴은 상상화(실제 사진은 남아 있음)
