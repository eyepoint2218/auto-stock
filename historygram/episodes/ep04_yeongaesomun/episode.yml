images:
  era: 고구려 말기(7세기 중반)
  hero: 고구려의 장군이자 최고 권력자. 40~50대 남성, 짙은 수염. 고구려 고분벽화풍 복식(새 깃털을 꽂은 관, 통 넓은 소매의 겉옷과 바지, 허리띠), 전장에서는 고구려식 비늘 갑옷과 철 투구, 붉은 망토
  scenes:
    2: 640년 무렵 평양 장안성 성벽 위 망루. 서쪽 지평선 너머 먼지 구름이 피어오르는 들판을 바라보는 고구려 장군의 뒷모습(새 깃털 꽂은 관, 붉은 망토). 성벽 아래로 이어진 대동강과 기와지붕들. 흐리고 무거운 하늘.
    3: 642년 고구려 궁궐 대전. 어두운 실내에 촛불, 바닥에 엎드린 신하들 사이로 계단 위 빈 왕좌를 향해 선 장군의 뒷모습(갑옷 위 붉은 겉옷, 허리에 칼). 피나 시신은 그리지 않고 긴장된 정적만.
    3.5: 645년 요동의 산성. 성벽 위에서 활을 겨눈 고구려 병사들 사이로 지휘하는 장군의 뒷모습(비늘 갑옷, 철 투구, 붉은 망토). 성 아래 들판을 가득 메우고 몰려오는 당나라 대군과 공성 사다리, 깃발은 글자 없이 무늬만.
    4: 662년 한겨울 사수 강가. 눈 덮인 강변 들판에서 승리한 고구려 기병(말까지 갑옷을 입힌 개마무사)들 사이로 말 위에 앉은 장군의 뒷모습. 들판에 흩어진 당나라 깃발(글자 없이 무늬만)과 꺼져 가는 연기. 차갑고 맑은 겨울 하늘이 화면 위쪽을 넓게 채운다.
    5: 50대 고구려 장군의 정면 상반신. 새 깃털을 꽂은 관, 비늘 갑옷 위 붉은 겉옷, 허리에 찬 여러 자루의 칼, 짙은 수염과 날카로운 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 평양성 성벽과 대동강, 흐린 하늘 사이로 비치는 햇빛.

caption: |
  당나라 대군을 몇 번이고 돌려보낸 고구려의 권력자, 연개소문. 그는 영웅이었을까요, 독재자였을까요?

  수나라의 침략을 막아낸 고구려 앞에, 이번엔 당나라가 나타났어요. 고구려 안에서는 당과 화친하자는 쪽과 맞서자는 쪽이 갈렸죠.

  642년, 대당 강경파였던 연개소문은 반대파 대신들과 영류왕을 죽이고 보장왕을 세운 뒤 스스로 최고 권력을 쥐었어요. 그리고 당나라와 맞서는 길을 택했습니다.

  645년 당 태종이 직접 대군을 이끌고 쳐들어왔지만, 안시성에서 막히며 결국 물러났어요. 662년에는 사수 강가에서 당나라 장수 방효태의 군대를 전멸시켰습니다. 그가 살아 있는 동안 당나라는 끝내 고구려를 무너뜨리지 못했어요.

  하지만 그가 세상을 떠난 뒤 아들들 사이에 권력 다툼이 일어났고, 668년 고구려는 나당연합군에 무너지고 말았어요.

  여러분은 연개소문을 영웅으로 보시나요, 독재자로 보시나요? 댓글로 생각을 들려주세요.

  * 2~5장 장면은 기록을 바탕으로 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 사망 연도는 자료에 따라 665·666년 등으로 다르게 전합니다. 안시성 성주의 이름은 정사에 남아 있지 않습니다.

hashtags: [역사그램, 연개소문, 고구려, 안시성, 한국사]

