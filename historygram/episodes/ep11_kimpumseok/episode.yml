images:
  era: 신라 선덕여왕 시대(642년)
  hero: 신라의 귀족 장수(대야성 도독). 30대 남성, 짧은 수염, 신라 귀족 관복(청록빛 넓은 소매 도포, 관모), 성을 지킬 때는 신라식 비늘 갑옷과 철 투구, 회색 망토. 앞 회차 김춘추(자줏빛)·김유신(짙은 청색)과 구별되는 색
  scenes:
    2: 642년 대야성 안 관아 앞마당. 계단 위에 거만하게 선 도독의 뒷모습(청록빛 관복, 관모), 계단 아래 고개를 숙인 채 주먹을 꽉 쥔 하급 관리의 옆모습(얼굴은 그림자로 가림). 해 질 녘의 긴 그림자, 불편하고 긴장된 분위기.
    3: 642년 여름 대야성(지금의 경남 합천). 산 위에 쌓은 돌성과 그 아래 굽이치는 황강, 성벽 위에 서서 서쪽 백제 땅을 바라보는 도독의 뒷모습(비늘 갑옷, 회색 망토). 맑지만 어딘가 불안한 하늘.
    3.5: 642년 8월 밤 대야성 안. 거대한 곡식 창고에서 불길이 치솟고, 성벽 아래 어둠 속에서 몰래 빠져나가는 그림자 하나. 성 밖 들판에는 횃불을 든 백제군이 몰려온다. 깃발은 글자 없이 무늬만. 피는 그리지 않는다.
    4: 642년 새벽, 연기가 가라앉은 대야성 위로 떠오르는 해. 무너진 성문과 꺾인 신라 깃발(글자 없이 무늬만), 성 아래를 흐르는 강. 사람은 그리지 않는다. 붉은 새벽하늘이 화면 위쪽을 넓게 채운다.
    5: 30대 신라 귀족 장수의 정면 상반신. 비늘 갑옷 위 청록빛 관복 깃, 관모, 짧은 수염, 후회와 두려움이 스친 복잡한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 노을 진 대야성과 황강.

caption: |
  부하의 아내를 빼앗은 한 남자의 잘못이 성을 무너뜨리고, 삼국의 운명까지 바꿨어요. 김춘추의 사위이자 대야성 도독, 김품석 이야기예요.

  김품석은 김춘추의 딸 고타소의 남편으로, 신라 서쪽을 지키는 요충지 대야성(지금의 경남 합천)을 맡고 있었어요. 그런데 그는 부하 검일의 아내를 빼앗았고, 검일은 그 일을 깊이 원망했죠.

  642년 8월, 백제 장군 윤충이 대야성을 쳐들어오자 검일은 백제와 몰래 손잡고 성 안 창고에 불을 질렀어요. 군량이 타 버리고 성 안은 흔들렸습니다. 김품석은 항복하려 했고, 부하 죽죽은 끝까지 싸우자고 했지만 받아들여지지 않았어요. 항복하러 나간 병사들은 복병에게 목숨을 잃었고, 김품석은 아내와 함께 스스로 목숨을 끊었다고 전해요. 죽죽은 마지막까지 싸우다 숨졌습니다.

  딸과 사위를 잃은 김춘추는 백제를 꺾겠다고 다짐했고, 고구려와 당나라를 오가며 결국 나당동맹을 맺었어요. 한 사람의 잘못에서 시작된 비극이 삼국통일로 이어지는 큰 물줄기를 만든 셈이에요.

  여러분은 이 이야기에서 무엇이 가장 안타까우신가요?

  * 1장 내용은 『삼국사기』에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 대야성 함락 당시 김품석의 최후는 자료에 따라 조금씩 다르게 전합니다.

