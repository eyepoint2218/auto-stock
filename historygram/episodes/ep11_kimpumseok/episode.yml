staging:
  - 검일의 아내를 빼앗은 일, 검일의 내통과 창고 방화, 죽죽의 항전 건의, 항복 병사 몰살, 품석 부부의 자결은 한국민족문화대백과 죽죽 항목 등으로 확인
  - 품석의 최후는 신라본기(죽었다)와 죽죽전(처자를 죽이고 자결) 서술이 달라 "전해요"로 쓰고 각주에 밝힘
  - 검일의 신분(사지·재지세력 / 부하 장수)은 자료마다 달라 "부하"로만 씀
  - 4장 "삼국통일의 불씨"는 해석(딸의 죽음 → 김춘추의 외교 → 나당동맹, EP.05 고타소 편과 같은 흐름)
  - 2장 관아 마당, 3장 성벽, 3.5장 창고 방화, 4장 무너진 성문 장면은 연출(사람·피 최소화)
  - 생년 미상
  - 7장 얼굴은 상상화
