exam_keywords: [평양 천도(427년), 남진 정책, 한성 함락(475년), 충주 고구려비, 도림·개로왕]

images:
  era: 고구려 5세기(413~491년)
  hero: 고구려의 왕. 30대(첫 두 그림)부터 70~80대까지 나이가 드는 모습. 앞 회차 아버지 광개토대왕과 닮았지만 구별되게, 고구려 고분벽화풍 복식(새 깃털 꽂은 금관, 통 넓은 소매), 짙은 남색 비단 겉옷과 금장식, 전장에서는 비늘 갑옷과 짙은 남색 망토. 나이가 들수록 흰 수염
  scenes:
    2: 470년대 백제 한성 궁궐의 한 방. 바둑판을 사이에 두고 마주 앉은 두 사람. 한쪽은 화려한 옷을 입은 백제 왕(얼굴은 작게, 그림자), 다른 쪽은 회색 승복을 입은 승려의 뒷모습. 바둑돌을 놓는 승려의 손. 촛불, 은밀하고 긴장된 분위기. 주인공(고구려 왕)은 이 그림에 나오지 않는다.
    3: 427년 대동강가의 평양. 새로 쌓은 성벽과 궁궐 공사 현장, 짐을 실은 수레와 백성들의 행렬. 강가 언덕에 서서 새 도읍을 내려다보는 왕의 뒷모습(새 깃털 금관, 짙은 남색 겉옷). 맑은 봄 하늘, 새 출발의 분위기.
    3.5: 백제 한성 안. 거대한 성벽과 화려한 궁궐을 쌓는 공사 현장에서 지쳐 쓰러질 듯한 백성들, 텅 빈 곳간. 멀리 언덕 위에서 그 모습을 몰래 지켜보는 회색 승복의 승려 뒷모습. 흐린 하늘, 무겁고 불길한 분위기. 주인공은 나오지 않는다.
    4: 475년 가을 한강. 강 건너 불길과 연기가 오르는 백제 한성(풍납토성), 강가를 가득 메운 고구려 군대와 깃발(글자 없이 무늬만). 언덕 위에서 말을 타고 그 모습을 바라보는 늙은 왕의 뒷모습(비늘 갑옷, 짙은 남색 망토, 흰 머리). 피는 그리지 않는다. 넓은 가을 하늘이 화면 위쪽을 채운다.
    5: 80대 고구려 왕의 정면 상반신. 새 깃털 꽂은 금관, 짙은 남색 비단 겉옷과 금장식, 길고 흰 수염, 깊은 주름, 노련하고 침착한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 평양성과 대동강, 저녁 노을.

caption: |
  한 승려의 바둑판 위에서 백제의 운명이 갈렸어요. 그 승려를 보낸 사람은 고구려의 장수왕이었죠.

  장수왕은 광개토대왕의 맏아들로, 413년 왕위에 올라 79년 가까이 고구려를 다스렸어요. 이름 그대로 오래 살아 '장수왕'이라 불려요. 427년 그는 도읍을 국내성에서 평양으로 옮기고, 남쪽으로 나라를 넓히는 남진 정책을 펼쳤어요.

  『삼국사기』에는 이런 이야기가 전해요. 장수왕은 바둑을 잘 두는 승려 도림을 백제로 보냈어요. 바둑을 좋아하던 백제 개로왕은 도림을 아꼈고, 도림의 권유에 따라 성을 쌓고 궁궐을 꾸미는 큰 공사를 벌이다 나라 살림이 바닥났죠.

  475년 장수왕은 직접 3만 군사를 이끌고 백제의 도읍 한성을 함락하고 개로왕을 죽였어요. 백제는 도읍을 웅진(지금의 공주)으로 옮겨야 했고, 고구려는 한강 유역을 차지했어요. 충주에 남아 있는 충주 고구려비는 이 무렵 고구려가 남쪽 깊숙이 내려왔음을 보여 줘요.

  칼보다 먼저 바둑돌을 보낸 왕, 여러분은 장수왕의 전략을 어떻게 보시나요?

  * 도림 이야기는 『삼국사기』에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 재위 기간과 세상을 떠난 해는 자료에 따라 490년 또는 491년으로 다르게 적힙니다.

