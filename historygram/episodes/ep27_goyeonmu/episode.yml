staging:
  - 670년 3월 설오유와 각각 정병 1만으로 압록강을 건너 옥골까지 진격, 4월 말갈·당군과 전투, 나당전쟁의 시작으로 평가, 680년 보덕국 태대형 대장군으로 안승의 표문 전달은 한국민족문화대백과로 확인
  - 전투 장소(옥골·개돈양·오골성)와 병력(각 1만/합 2만)이 자료마다 달라 장소는 각주에 밝히고 병력은 백과사전 기준(각각 1만)
  - 전투 결과는 승리 후 당의 반격에 물러남, 전략적 후퇴 설이 갈려 게시글에 승패를 단정하지 않음
  - 668년 직후 부흥군을 모은 구체적 경위는 기록이 적어 중심에 선 장수로 넓게 씀
  - 2장 압록강 강가, 3장 무너진 평양성, 3.5장 막사 동맹, 4장 요동 진격 장면은 연출
  - 드라마 〈문무〉에서는 영류왕의 신하로 등장(운영자 확인). 영류왕 시대(618~642) 행적은 기록에 없어 게시글에 드라마 설정과 기록을 구분해 한 줄로 밝힘
  - 생몰연도 미상
  - 7장 얼굴은 상상화
