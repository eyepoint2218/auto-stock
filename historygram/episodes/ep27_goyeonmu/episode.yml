images:
  era: 고구려 멸망 직후(7세기 후반, 668~680년)
  hero: 고구려 부흥군 장수. 30~40대 남성, 짙은 수염, 고구려식 비늘 갑옷과 철 투구, 낡고 해진 짙은 갈색 망토(나라를 잃은 장수), 투구에 새 깃털 장식. 앞 회차 연개소문(붉은 망토)·고건무(녹색)와 구별
  scenes:
    2: 670년 봄 압록강 강가. 강 이쪽에 선 고구려 부흥군 장수의 뒷모습(낡은 갈색 망토, 비늘 갑옷)과, 그 곁에 나란히 선 신라 장수의 뒷모습(신라식 갑옷, 붉은 술 달린 투구). 두 사람 뒤로 각각의 병사들이 섞여 서 있다. 깃발은 글자 없이 무늬만. 새벽 안개 낀 강.
    3: 668년 가을 무너진 평양성. 연기가 피어오르는 성벽 아래, 흩어진 고구려 병사들이 하나둘 모여드는 들판. 무너진 성벽 위에 서서 그들을 내려다보는 장수의 뒷모습(갈색 망토, 비늘 갑옷). 회색 하늘, 비장한 분위기. 피나 시신은 그리지 않는다.
    3.5: 669년 무렵 산속 진영의 막사 안. 등불 아래 지도를 펼친 탁자를 사이에 두고, 고구려 부흥군 장수(갈색 망토, 뒷모습)와 신라 장수(신라 갑옷, 맞은편이지만 얼굴은 그림자로 가림)가 손을 맞잡는다. 긴장되고 결연한 분위기.
    4: 670년 봄 요동 벌판. 압록강을 건너 진격하는 고구려 부흥군과 신라군의 연합 기병 행렬, 맨 앞에서 칼을 들고 달리는 장수의 뒷모습(갈색 망토가 휘날림). 멀리 당나라·말갈 군의 진영과 깃발(글자 없이 무늬만). 맑고 넓은 하늘이 화면 위쪽을 넓게 채운다. 피는 그리지 않는다.
    5: 40대 고구려 부흥군 장수의 정면 상반신. 새 깃털 장식 철 투구, 비늘 갑옷 위 낡은 갈색 망토, 짙은 수염, 슬픔과 결의가 함께 담긴 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 압록강과 요동 벌판, 노을 진 하늘.

caption: |
  고구려가 무너진 지 2년 뒤, 한 고구려 장수가 압록강을 다시 건넜어요. 곁에는 어제의 적 신라군이 있었죠. 고구려 부흥군의 장수 고연무 이야기예요.

  668년 나당연합군에 평양성이 함락되며 고구려는 무너졌어요. 하지만 고구려 사람들은 포기하지 않았고, 곳곳에서 나라를 되살리려는 부흥운동이 일어났어요. 고연무도 그 중심에 선 장수였어요.

  그런데 이번엔 신라와 당나라 사이가 틀어지고 있었어요. 당이 신라까지 넘보자, 신라는 고구려 부흥군과 손을 잡았죠. 670년 3월 고연무는 신라 장수 설오유와 함께 각각 정예병 1만을 이끌고 압록강을 건넜고, 4월에는 당나라와 말갈 군대와 맞서 싸웠어요. 이 싸움은 신라가 당을 몰아낸 나당전쟁의 첫걸음으로 평가받아요.

  그 뒤 고연무는 신라가 고구려 왕족 안승을 왕으로 세운 보덕국에서 태대형 대장군이 되었고, 680년 안승의 글을 문무왕에게 전했다는 기록이 남아 있어요.

  드라마 〈문무〉에서는 영류왕의 신하로 나오지만, 기록에 남은 고연무의 활약은 고구려가 무너진 뒤 부흥군 장수로서의 모습이에요.

  나라는 잃었지만 싸움은 멈추지 않은 장수, 여러분은 고연무의 선택을 어떻게 보시나요?

  * 1장 내용은 『삼국사기』 문무왕 10년 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 전투 장소는 자료에 따라 옥골·개돈양 등으로 다르게 전하고, 생몰연도는 전하지 않습니다.

