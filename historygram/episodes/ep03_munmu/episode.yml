staging:
  - 2장 누각 장면, 4장 성벽 장면은 연출
  - 3장 660년 백제 공격에 태자가 전선을 이끌고 나선 일은 『삼국사기』 기록에 근거, 뱃머리 구도는 연출
  - 3.5장 왕이 직접 칼을 든 모습은 연출(나당전쟁 시작은 670년)
  - 매소성(675)·기벌포(676) 전투를 왕이 직접 지휘했다는 표현은 쓰지 않음
  - 유언(용이 되어 나라를 지킴)은 전해지는 이야기로 표현, 대왕암 수중릉 여부는 학계 견해가 갈림
  - 출생 626년은 통설(원전 대조 필요)
  - 7장 얼굴은 상상화
