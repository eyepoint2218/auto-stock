images:
  era: 신라 삼국통일기(7세기 후반)
  hero: 신라의 왕자이자 왕 김법민. 2번째 그림은 30대 태자, 나머지는 40~50대 왕. 7세기 신라 복식(당나라식 관복 영향, 머리에 관모), 전장에서는 신라식 비늘 갑옷과 투구
  scenes:
    2: 670년 무렵 신라 왕궁 월성의 높은 누각. 붉은 노을 아래 멀리 겹겹이 이어진 산과 들, 그 너머로 희미한 바다. 누각 난간 앞에 홀로 서서 그 땅을 내려다보는 왕의 뒷모습(붉은 관복, 관모). 아래 마당에는 신하들이 작게 늘어서 있다. 무거운 정적.
    3: 660년 서해를 건너는 신라의 전함 선단. 맨 앞 배의 뱃머리에 서서 바다를 바라보는 30대 태자의 뒷모습(신라식 비늘 갑옷, 투구는 옆구리에 낌, 붉은 망토). 뒤로 수많은 돛과 노 젓는 병사들, 거친 파도와 흐린 하늘. 깃발에는 글자 없이 무늬만.
    3.5: 670년대 나당전쟁. 산성 위 신라군 진영에서 칼을 뽑아 든 왕의 뒷모습(비늘 갑옷, 투구). 그 앞에 창과 방패를 든 신라 병사들이 줄지어 서 있고, 멀리 골짜기 건너편에 당나라 군대의 진영과 깃발(글자 없이 무늬만)이 보인다. 긴장된 새벽 안개.
    4: 676년 동틀 무렵. 월성 성벽 위에 서서 들판을 바라보는 왕의 뒷모습(관복, 관모). 성 아래로 승리하고 돌아오는 신라군의 긴 행렬과 깃발, 길가에서 맞이하는 백성들. 밝아오는 하늘이 화면 위쪽을 넓게 채운다.
    5: 50대 신라 왕의 정면 상반신. 7세기 신라 왕의 복식(붉은 관복, 관모), 단단하고 깊은 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 경주 감포 앞바다의 바위섬(대왕암)과 부서지는 파도, 동해의 아침 햇빛.

caption: |
  죽어서 바다에 묻히겠다고 한 왕이 있어요. 용이 되어 이 나라를 지키겠다면서요. 삼국통일을 마무리한 신라의 문무왕 이야기예요.

  660년 백제, 668년 고구려가 무너졌지만 싸움은 끝나지 않았어요. 함께 싸웠던 당나라가 이번엔 신라까지 손에 넣으려 했거든요.

  태종무열왕 김춘추의 맏아들 김법민은 태자 시절부터 백제와의 전쟁에 나섰고, 661년 왕위에 올랐어요. 그리고 670년, 손잡았던 당나라를 향해 칼을 돌렸습니다.

  675년 매소성, 676년 기벌포에서 당군을 크게 무찌르며 당나라 세력을 몰아냈고, 대동강 이남의 땅을 지켜내 삼국통일을 마무리했어요.

  681년 세상을 떠나며 그는 동해의 용이 되어 나라를 지키겠다는 뜻을 남겼다고 전해요. 경주 감포 앞바다의 대왕암이 바로 그가 잠든 곳으로 알려져 있답니다.

  여러분은 문무왕의 마지막 소원, 어떻게 느껴지시나요?

  * 2~5장 장면은 기록을 바탕으로 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 대왕암이 실제 수중릉인지는 학계에서 여러 견해가 있습니다.

