images:
  era: 고려 13세기 중반(1257~1258년), 몽골 침입기 강화도
  hero: 고려 최씨 무신정권의 젊은 집정. 20대로 연출한 남성, 마른 얼굴에 짧은 수염, 날카롭지만 불안한 인상. 짙은 먹색(검은빛) 비단 포에 은빛 띠와 은장식, 검은 사모. 앞 회차 고려 고종(자줏빛 포)과 구별
  scenes:
    2: 1250년대 강화도의 크고 화려한 저택 마당. 밤, 등불이 줄지어 켜진 넓은 기와집과 높은 담장, 마당을 지키는 수많은 무장 사병들(갑옷, 창). 높은 마루 위에 홀로 서서 마당을 내려다보는 젊은 남성의 뒷모습(먹색 비단 포, 은빛 띠). 화려하지만 차갑고 불길한 분위기.
    3: 1257년 저택의 넓은 방. 흰 상복을 입은 사람들이 늘어선 가운데, 나이 든 무관(얼굴은 그림자)이 두 손으로 내미는 큰 도장과 칼을 받는 젊은 남성의 손과 뒷모습(먹색 포 위 흰 상복 띠). 촛불, 무겁고 긴장된 분위기.
    3.5: 저택의 연회장. 젊은 주인(먹색 포, 뒷모습)이 한 측근(얼굴은 그림자)과만 웃으며 술잔을 나누고, 방 한쪽 어둠 속에 서 있는 무장 부하들이 차가운 눈빛으로 그들을 지켜본다(부하들 얼굴은 반쯤 그림자). 갈라진 분위기.
    4: 1258년 3월 새벽 강화도 저택. 횃불을 든 무장 병사들이 담장을 넘어 마당으로 몰려들고, 맨 앞에서 칼을 든 장수의 뒷모습(갑옷, 얼굴 보이지 않게). 저택 안쪽 마루 위 열린 문 안에 서 있는 주인의 작은 실루엣(먹색 포, 얼굴은 어둠에 가려 보이지 않게). 피는 그리지 않는다. 새벽 푸른 하늘이 화면 위쪽을 넓게 채운다.
    5: 20대 고려 무신 집정의 정면 상반신. 검은 사모, 짙은 먹색 비단 포에 은빛 띠, 짧은 수염, 날카롭지만 불안이 서린 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 강화도의 저택 지붕과 어두운 새벽하늘, 횃불 불빛.

caption: |
  60여 년을 이어 온 고려 최고의 권력 가문이 4대째에 무너졌어요. 그 마지막 주인은 최씨 무신정권의 네 번째 집정, 최의였어요.

  1196년 최충헌이 권력을 잡은 뒤, 최우와 최항을 거치며 최씨 가문은 왕보다 큰 힘을 쥐었어요. 몽골이 쳐들어오자 강화도로 도읍을 옮긴 것도 최우였죠. 1257년 아버지 최항이 세상을 떠나자, 아들 최의가 가문의 권력을 물려받았어요.

  하지만 최의의 권력은 단단하지 않았어요. 그는 측근 최양백만 가까이했고, 아버지 때부터 가문을 받쳐 온 김준 같은 부하들은 점점 밀려났어요. 몽골과의 전쟁이 길어지며 나라 안의 불만도 커지고 있었죠.

  1258년 3월, 김준은 유경, 박송비 등과 손잡고 군사를 일으켜 최의를 죽였어요. 이 일을 무오정변이라고 해요. 이로써 4대 60여 년에 걸친 최씨 정권이 끝났고, 권력은 겉으로는 왕에게 돌아갔어요. 하지만 실제 권력은 다시 김준 등 무신들에게 넘어갔어요.

  12월 5일 시작하는 드라마 〈신의 구슬〉은 바로 이 1258년 고려를 배경으로 해요.

  가장 강했던 가문의 가장 짧았던 주인, 여러분은 최씨 정권이 왜 무너졌다고 보시나요?

  * 1장 내용은 『고려사』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 최의가 태어난 해는 전하지 않고, 그림 속 나이는 연출입니다.

