images:
  era: 백제 의자왕 시대(642년)
  hero: 백제의 장군. 40대 남성, 짙은 수염, 백제식 비늘 갑옷과 투구, 짙은 남색 망토(앞 회차 계백의 붉은 망토와 구별), 허리에 장검
  scenes:
    2: 642년 여름 백제 사비성 궁궐 앞마당. 계단 위의 왕(얼굴은 작게, 멀리)에게서 출정 명령을 받고 한쪽 무릎을 꿇은 장군의 뒷모습(비늘 갑옷, 남색 망토). 마당에 줄지어 선 백제 병사들과 깃발(글자 없이 무늬만). 맑은 여름 하늘.
    3: 642년 8월 산길을 따라 길게 이어진 백제군 행렬. 행렬 맨 앞에서 말을 타고 고개를 넘어가는 장군의 뒷모습(남색 망토, 투구). 멀리 산 위에 돌로 쌓은 신라 산성이 보인다. 흐린 하늘과 바람에 날리는 깃발(글자 없이 무늬만).
    3.5: 642년 8월 밤 대야성 앞. 성 안에서 불길이 치솟고, 성문 앞에서 칼을 들어 공격을 지휘하는 장군의 뒷모습(남색 망토, 비늘 갑옷). 성벽으로 몰려가는 백제 병사들과 사다리. 깃발은 글자 없이 무늬만. 피나 시신은 그리지 않는다.
    4: 642년 대야성 함락 뒤 새벽. 성벽 위에 꽂힌 백제 깃발(글자 없이 무늬만) 옆에 서서 동쪽 신라 땅을 바라보는 장군의 뒷모습. 연기가 가라앉은 성과 멀리 이어지는 산맥. 붉게 밝아오는 새벽하늘이 화면 위쪽을 넓게 채운다.
    5: 40대 백제 장군의 정면 상반신. 비늘 갑옷 위 남색 망토, 짙은 수염, 날카롭고 냉정한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 대야성이 있는 산과 황강, 흐린 저녁 하늘.

caption: |
  그가 무너뜨린 성 하나가 신라를 당나라와 손잡게 만들었어요. 결국 그 동맹이 백제를 무너뜨렸죠. 백제의 장군 윤충 이야기예요.

  642년 7월, 의자왕은 직접 군사를 이끌고 신라 서쪽의 성 40여 곳을 빼앗았어요. 그리고 다음 달, 장군 윤충에게 군사 1만을 맡겨 신라 서쪽의 요충지 대야성(지금의 경남 합천)을 치게 했습니다.

  성 안에서 내통이 일어나며 대야성은 무너졌고, 성을 지키던 김품석과 그의 아내 고타소가 세상을 떠났어요. 윤충은 사로잡은 남녀 1천여 명을 백제 서쪽 고을로 옮겼고, 의자왕은 그 공으로 말 20필과 곡식 1천 석을 내렸다고 해요.

  백제에게는 큰 승리였지만, 딸을 잃은 김춘추는 백제를 꺾기 위해 고구려와 당나라를 오갔고 결국 나당동맹을 맺었어요. 18년 뒤인 660년, 그 동맹이 백제를 무너뜨렸습니다. 윤충이 그 뒤 어떻게 되었는지는 기록이 남아 있지 않아요.

  가장 큰 승리가 가장 큰 위기를 불렀다면, 여러분은 이 승리를 어떻게 보시나요?

  * 2~5장 장면은 기록을 바탕으로 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 윤충의 생몰연도와 이후 행적은 전하지 않습니다.

