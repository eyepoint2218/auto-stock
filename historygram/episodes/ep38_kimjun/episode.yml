images:
  era: 고려 13세기 중반(1240~1268년), 몽골 침입기 강화도
  hero: 고려의 무신. 20대(첫 그림)부터 50대까지 나이가 드는 모습. 다부진 체격, 짙은 눈썹과 수염, 굳은 표정. 젊을 때는 낡은 갈색 무명옷의 하인 차림, 정변 때는 고려식 비늘 갑옷과 짙은 쑥색(올리브빛) 망토, 집권 뒤에는 짙은 쑥색 비단 포와 검은 사모. 앞 회차 최의(먹색 포)·고려 고종(자줏빛 포)과 구별
  scenes:
    2: 1258년 3월 새벽 강화도. 무너진 큰 저택의 대문 앞, 꺼져 가는 횃불과 쓰러진 깃발(글자 없이 무늬만), 고개 숙인 사병들. 대문 앞에 칼을 거꾸로 짚고 홀로 서서 저택을 바라보는 무장의 뒷모습(비늘 갑옷, 쑥색 망토). 피는 그리지 않는다. 동이 트는 푸른 새벽, 한 시대가 끝난 고요한 분위기.
    3: 1240년대 강화도 최씨 가문 저택의 마당. 낡은 갈색 무명옷을 입은 젊은 하인이 활을 들고 과녁을 향해 시위를 당기는 뒷모습. 마루 위에는 비단옷 차림의 집 주인과 손님들(얼굴은 그림자)이 그를 지켜본다. 맑은 낮, 신분의 차이가 느껴지는 분위기.
    3.5: 1258년 3월 밤 강화도. 횃불을 든 무장 병사들이 담장 앞에 모여 있고, 맨 앞에서 칼을 뽑아 들어 신호를 보내는 무장의 뒷모습(비늘 갑옷, 쑥색 망토). 멀리 불이 켜진 큰 저택. 피는 그리지 않는다. 긴박한 분위기.
    4: 1260년대 강화도 궁궐. 높은 왕좌에 앉은 왕(자홍색 포, 얼굴은 그림자로 가림)보다 오히려 크게 보이는 구도로, 왕좌 아래 계단에 서서 신하들을 내려다보는 중년 무신의 뒷모습(쑥색 비단 포, 검은 사모). 창밖으로 바다와 섬. 화면 위쪽은 높은 궁궐 천장과 기둥으로 단순하게.
    5: 50대 고려 무신 집정의 정면 상반신. 검은 사모, 짙은 쑥색 비단 포에 가죽 띠, 짙은 눈썹과 희끗한 수염, 다부진 얼굴, 밑바닥에서 올라온 사람의 단단하고 경계하는 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 강화도 궁궐 지붕과 바다, 저녁 노을.

caption: |
  노비의 아들이 주인 가문을 무너뜨리고 고려의 실권을 쥐었어요. 무신 집정 김준(김인준) 이야기예요.

  김준의 아버지 김윤성은 최씨 집안의 노비였어요. 김준은 최우 때부터 최씨 가문을 섬기며 측근이 되었고, 최항 때까지 가문의 중요한 일을 맡았어요.

  하지만 1257년 최의가 권력을 물려받은 뒤, 최의는 최양백만 가까이하고 김준 같은 오랜 부하들을 멀리했어요. 1258년 3월, 김준은 유경, 박송비 등과 함께 군사를 일으켜 최의를 죽였어요. 이 무오정변으로 60여 년의 최씨 정권이 끝났고, 권력은 겉으로 왕에게 돌아갔어요.

  그러나 실제 권력은 김준에게 있었어요. 그는 시중에 오르고 해양후에 봉해졌으며, 1264년에는 교정별감이 되어 나라의 일을 직접 감독했어요. 몽골과 화해하려는 원종과 달리 그는 몽골에 맞서는 쪽에 섰고, 둘의 갈등은 점점 커졌어요. 결국 1268년 12월, 원종의 뜻을 받은 임연 등이 김준을 죽였어요. 주인을 무너뜨린 그 역시 부하의 손에 무너진 거예요.

  12월 5일 시작하는 드라마 〈신의 구슬〉은 김준이 최의를 무너뜨린 1258년을 배경으로 해요.

  노비의 아들에서 나라의 실권자가 된 사람, 여러분은 김준을 어떻게 보시나요?

  * 1장 내용은 『고려사』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 김준은 김인준이라고도 하며, 태어난 해는 전하지 않습니다.

