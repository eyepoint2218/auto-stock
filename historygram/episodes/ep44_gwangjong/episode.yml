images:
  era: 고려 초기 10세기 중반(949~975년), 개경
  hero: 고려 제4대 왕. 20대 후반(즉위)부터 40대까지. 날카로운 눈매와 굳게 다문 입, 단정한 수염, 결단력 있는 인상. 짙은 붉은색(진홍) 비단 포와 옥대, 검은 관. 앞 회차 고려 인물(왕건 누런 금빛·고종 자줏빛·원종 자홍색)과 구별되는 진홍색
  scenes:
    2: 950년 무렵 개경 궁궐의 큰 전각. 화려한 비단옷을 입고 무장한 사병들을 거느린 호족들(얼굴은 반쯤 그림자)이 거만하게 서서 왕좌 쪽을 바라보고, 그 앞 높은 왕좌에 홀로 앉은 젊은 왕은 작게, 뒷모습으로만 보인다(진홍 포). 무겁고 위협적인 분위기.
    3: 956년 고려의 한 마을 관아 앞마당. 밧줄이 풀린 노비들이 서로 부둥켜안고 기뻐하고, 한쪽에서 관리가 문서(글자는 알아볼 수 없게)를 펼쳐 읽는다. 마당 끝에서 그 모습을 지켜보는 왕의 뒷모습(진홍 포, 검은 관). 맑은 하늘, 기쁨과 희망의 분위기.
    3.5: 958년 고려 최초의 과거 시험장. 넓은 마당에 줄지어 앉은 수많은 선비들이 붓으로 답안지를 쓰고 있다(글자는 알아볼 수 없게). 높은 단 위에서 시험장을 내려다보는 왕의 뒷모습(진홍 포)과 그 곁에 선 중국식 관복 차림의 신하(쌍기, 얼굴은 그림자). 엄숙하고 진지한 분위기.
    4: 960년 개경 궁궐 앞 넓은 마당. 자주색, 붉은색, 짙은 붉은색, 초록색 관복을 입은 관리들이 색깔별로 줄지어 서 있다. 높은 계단 위 궁궐 앞에 서서 그들을 내려다보는 왕의 뒷모습(진홍 비단 포, 검은 관). 넓고 맑은 하늘과 궁궐 지붕이 화면 위쪽을 넓게 채운다.
    5: 40대 고려 왕의 정면 상반신. 검은 관, 진홍색 비단 포와 옥대, 단정한 수염, 날카롭고 결단력 있는 눈빛과 굳게 다문 입, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 개경 궁궐 지붕과 송악산, 저녁 노을.

caption: |
  고려가 세워진 뒤에도 왕보다 힘센 호족들이 나라를 쥐고 있었어요. 이 호족들의 힘을 꺾고 왕권을 세운 왕이 고려 제4대 왕 광종이에요.

  광종은 태조 왕건의 아들이에요. 아버지가 세상을 떠난 뒤 왕위를 둘러싼 다툼이 이어졌고, 형들은 호족에게 휘둘렸어요. 949년 왕위에 오른 광종은 몇 년 동안 조용히 힘을 기른 뒤 개혁을 시작했어요.

  956년 그는 노비안검법을 만들었어요. 원래 양인이었지만 전쟁이나 빚 때문에 노비가 된 사람들을 가려내 다시 양인으로 돌려보내는 법이에요. 호족들이 거느린 노비가 줄자, 그들의 재산과 군사력도 함께 줄었죠.

  958년에는 중국 후주에서 온 쌍기의 건의로 과거제를 처음 열었어요. 집안이 아니라 시험으로 관리를 뽑기 시작한 거예요. 960년에는 관리의 등급에 따라 옷 색깔을 정한 백관의 공복을 만들었고, 광덕과 준풍이라는 연호를 쓰고 스스로 황제라 부르며 왕의 권위를 높였어요. 반발하는 공신과 호족들은 엄하게 다스렸어요.

  강한 개혁으로 왕의 나라를 만든 왕, 여러분은 광종의 개혁을 어떻게 보시나요?

  * 1장 내용은 『고려사』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 노비안검법을 실시한 해와 광덕 연호를 쓰기 시작한 해는 자료에 따라 1년 정도 다르게 전합니다.

