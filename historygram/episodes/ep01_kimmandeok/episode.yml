images:
  era: 조선 후기(18세기 말)
  hero: 50대 후반 조선 여성, 제주 출신 상인
  scenes:
    2: 1796년 창덕궁 편전 내부. 화면 안쪽 위에 어좌에 앉은 정조(붉은 곤룡포, 익선관). 정조의 얼굴은 작고 담담하게. 어좌 뒤에 일월오봉도 병풍. 양옆에 단령 관복과 사모 차림의 신하들이 줄지어 서 있다. 화면 가운데 앞쪽에 바닥에 무릎 꿇고 고개 숙인 주인공 여인의 뒷모습. 머리에 검은 천 가리마, 소박한 저고리와 치마. 창호지 창으로 들어오는 은은한 빛, 나무 바닥과 붉은 기둥.
    3: 1795년 흉년이 든 제주. 돌담과 줄로 엮은 초가지붕이 있는 관아 마당. 메마른 들과 회색 하늘. 야윈 제주 백성들(어른, 노인, 아이를 안은 어머니)이 줄을 서서 쌀을 받는다. 화면 앞쪽에 볏짚 쌀가마니들이 쌓여 있다. 주인공 여인은 화면 앞쪽 가장자리에서 등을 보이고 서서, 쌀을 담은 바가지를 건네는 손과 소매만 보인다. 백성들의 표정은 과장 없이 지치고 담담하게.
    4: 1796년 가을 한양. 창덕궁 정문 돈화문으로 이어진 넓은 돌길. 화면 아래쪽 가운데로 혼자 궁궐을 향해 걸어가는 주인공 여인의 뒷모습. 검은 천 가리마와 단정한 저고리, 치마. 문 앞 양옆에 서 있는 군졸 몇 명. 단풍 든 나무와 맑고 서늘한 가을 오후 햇빛, 길게 늘어진 그림자. 웅장한 궁궐 지붕과 단청.
    5: 1797년 봄 금강산을 배경으로 선 주인공 여인의 정면 상반신. 단정하게 쪽진 머리, 수수하지만 품위 있는 옅은 색 저고리와 짙은 치마. 햇볕에 그을린 피부, 강인하고 온화한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화된 미인형 금지). 뒤로 안개 낀 금강산의 흰 화강암 봉우리들과 봄 신록.

caption: |
  임금이 소원을 묻자, 제주의 한 여인은 벼슬도 재물도 아닌 금강산을 말했다.

  1790년대 중반, 제주에는 몇 해째 흉년이 이어졌다. 굶어 죽는 사람이 늘어나던 1795년, 객주를 운영하던 상인 김만덕은 재산을 털어 육지에서 곡식을 사들였고, 그 대부분을 관아에 내놓아 굶주린 사람들을 살리게 했다.

  이 일을 보고받은 정조는 제주목사를 통해 그녀의 소원을 물었다. 그녀가 바란 것은 한양에 가서 궁궐을 우러러보고 금강산 일만이천봉을 구경하는 것이었다. 당시 제주 여성은 섬 밖으로 나갈 수 없었다. 정조는 그 소원을 들어주었고, 김만덕은 1796년 한양에 올라 의녀반수의 직함으로 궁궐에 들어갔으며 이듬해 봄 금강산을 유람했다.

  평생 모은 재산으로 그녀가 산 것은 수많은 사람의 하루하루였다. 여러분이라면 그런 순간에 무엇을 소원으로 말했을까요?

  * 1장의 대사와 2장의 궁궐 장면은 『정조실록』과 채제공의 「만덕전」 기록을 바탕으로 재구성한 연출입니다. 6장의 얼굴은 상상화이며, 실제 생전 초상은 전하지 않습니다.

hashtags: [역사그램, 김만덕, 정조, 제주역사, 조선사]

sources:
  - 『정조실록』 정조 20년(1796) 11월 25일
  - 채제공, 『번암집』 「만덕전」

staging:
  - 1장 대사는 「만덕전」의 소원 기록을 바탕으로 재구성
  - 2장 궁궐 장면은 연출(소원은 제주목사를 통해 물었음)
  - 3장 직접 나눠주는 모습은 연출(곡식은 관아에 바침)
  - 6장(인물 공개) 얼굴은 상상화
