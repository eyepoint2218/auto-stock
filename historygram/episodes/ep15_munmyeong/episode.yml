# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [문명왕후, 문희, 보희, 꿈을 산 이야기, 문희매몽, 김유신 누이, 김춘추, 태종무열왕, 문무왕 어머니, 축국, 신라 왕비, 드라마 문무]

sources:
  - 한국민족문화대백과 문명왕후·보희·문희매몽 설화 항목
  - 경북매일, 김유신·김춘추 관련 연재 기사(2023)
  - 브런치, 문희 꿈 이야기 글
  - 『삼국유사』 기이편 태종춘추공, 『삼국사기』 신라본기·김유신 열전(원문 직접 대조는 못 함)

staging:
  - 보희의 꿈(서형산에 올라 오줌을 누니 서라벌에 가득 참)과 문희가 비단 치마로 꿈을 산 일, 축국 중 김유신이 김춘추의 옷끈을 떨어뜨리고 보희가 사양해 문희가 인연을 맺은 일은 한국민족문화대백과 등으로 확인한 설화 → 1장 "『삼국유사』 전승" 표기, 게시글 "해요/전해요"
  - 3장 문구는 오줌 표현을 직접 쓰지 않고 "서라벌을 가득 채운 꿈"으로 순화, 게시글에는 원래 내용 그대로
  - 김유신이 누이를 불태우려 했다는 장작불 일화(선덕여왕 등장)는 이번 검색에서 확인 못 해서 쓰지 않음
  - 문명왕후는 시호, 『삼국유사』 훈제부인. 생몰연도 미상 → ?~?
  - 2장 안채, 3장 꿈속 풍경, 3.5장 바느질, 4장 궁궐 장면은 연출
  - 7장 얼굴은 상상화
