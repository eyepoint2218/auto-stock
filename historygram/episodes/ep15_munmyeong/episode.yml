images:
  era: 신라 진평왕~태종무열왕 시대(7세기 전반)
  hero: 김유신 집안의 둘째 딸(문희). 2~4번째 그림은 10대 후반~20대 초 소녀·젊은 여인, 마지막 그림은 30~40대 왕비. 7세기 신라 귀족 여성 복식(엉덩이를 덮는 긴 저고리, 긴 치마, 어깨에 두른 얇은 숄, 올린 머리), 젊을 때는 연분홍·연두 계열, 왕비가 된 뒤에는 짙은 자주와 금장식(남편 김춘추의 자줏빛과 어울리게)
  scenes:
    2: 620년대 신라 서라벌 귀족 집안의 안채 방. 이른 아침 창호지 문으로 들어오는 빛 속에서, 언니(옅은 하늘색 옷)가 꿈 이야기를 하고 있고, 그 앞에 곱게 갠 비단 치마를 두 손으로 내미는 동생의 뒷모습(연분홍 저고리, 올린 머리). 언니의 얼굴은 보여도 되지만 동생의 얼굴은 보이지 않게. 따뜻하고 비밀스러운 분위기.
    3: 꿈속 장면. 새벽안개가 깔린 서라벌 서쪽 산(서형산) 꼭대기, 그 아래로 끝없이 펼쳐진 서라벌의 기와지붕과 들판이 맑은 물결처럼 빛나며 가득 차오르는 환상적인 풍경. 산꼭대기에 서서 그 풍경을 내려다보는 소녀의 작은 뒷모습. 몽환적이고 신비로운 색감. 사람의 몸짓은 단정하게.
    3.5: 정월 귀족 저택 마당 한쪽의 방. 등불 아래 앉아 바느질로 젊은 귀족 남성(자줏빛 겉옷)의 옷끈을 꿰매 주는 소녀의 뒷모습과 손. 남성은 등을 보이며 앉아 있고, 문밖 마당에서 공을 든 다른 젊은 남성(짙은 청색 옷)이 슬쩍 지켜본다. 설레고 조심스러운 분위기.
    4: 650년대 신라 궁궐 안채. 창가에 서서 어린 사내아이의 손을 잡고 궁궐 마당을 내려다보는 왕비의 뒷모습(짙은 자주 비단 옷, 금장식, 숄). 마당에는 신하들과 깃발(글자 없이 무늬만). 맑고 넓은 하늘이 화면 위쪽을 채운다. 아이의 얼굴도 보이지 않게.
    5: 30~40대 신라 왕비의 정면 상반신. 단정하게 올린 머리에 금장식, 짙은 자주 비단 옷과 숄, 지혜롭고 담대하며 온화한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화된 미인형 금지). 뒤로 서라벌 궁궐 지붕과 서쪽 산, 노을 진 하늘.

caption: |
  언니의 꿈을 비단 치마 한 벌에 산 소녀가 있어요. 그 꿈값은 왕비 자리였죠. 김유신의 누이이자 문무왕의 어머니, 문명왕후 문희 이야기예요.

  어느 날 김유신의 큰누이 보희는 서쪽 산꼭대기에 올라 오줌을 누었더니 서라벌이 온통 그 물로 가득 차는 꿈을 꾸었어요. 이야기를 들은 동생 문희는 비단 치마를 주고 그 꿈을 샀다고 해요.

  얼마 뒤 정월, 김유신은 김춘추와 집 앞에서 공차기(축국)를 하다가 일부러 그의 옷끈을 밟아 떨어뜨렸어요. 그리고 누이에게 꿰매 달라며 집 안으로 데려왔죠. 언니 보희는 사양했고, 문희가 바느질을 하며 김춘추와 인연을 맺었다고 전해요.

  문희는 김춘추의 아내가 되었고, 김춘추가 태종무열왕으로 즉위하자 왕비가 되었어요. 그리고 그 아들 김법민은 훗날 삼국통일을 마무리한 문무왕이 되었습니다. 꿈 하나에서 시작된 이야기가 신라 왕실의 운명을 바꾼 셈이에요.

  여러분이라면 그 꿈, 비단 치마와 바꾸셨을까요?

  * 1~4장의 꿈과 옷끈 이야기는 『삼국유사』·『삼국사기』에 전하는 설화이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 문명왕후는 사후 시호이고, 『삼국유사』에는 훈제부인으로도 나옵니다. 생몰연도는 전하지 않습니다.

