images:
  era: 중국 삼국 시대 위나라(3세기 전반)
  hero: 위나라의 대신이자 장군. 50~70대 남성, 길고 마른 체격, 흰 섞인 수염, 날카롭고 차분한 눈매. 위나라 관복(검은 진현관, 짙은 회색·검은색 넓은 소매 도포), 전장에서는 후한식 찰갑과 짙은 회색 망토. 앞 회차 조조(짙은 남색)·제갈량(흰 도포·녹색)과 구별. 3세기 복식(명·청·일본풍 금지)
  scenes:
    2: 상징적인 장면. 커다란 바둑판 위에 위·촉·오를 상징하는 세 가지 색 바둑돌(검정·녹색·붉은색)이 흩어져 있고, 그 판 앞에 앉아 마지막 한 수를 두려는 손(짙은 회색 소매)과 그 사람의 뒷모습. 촛불 하나, 어두운 방. 긴장된 분위기.
    3: 234년 위수 강가의 위나라 진영. 굳게 지키는 목책과 성채, 강 건너 멀리 촉나라 진영의 녹색 깃발. 망루 위에서 뒷짐을 지고 강 건너를 바라보는 장군의 뒷모습(찰갑, 짙은 회색 망토). 깃발은 글자 없이 무늬만. 고요하고 끈질긴 분위기.
    3.5: 249년 정월 낙양. 어둑한 저택 방 안에서 병석의 이불을 걷어내고 일어서는 노인의 뒷모습(흰 속옷 위로 짙은 회색 도포를 걸침), 문밖에는 갑옷 입은 병사들이 횃불을 들고 대기한다. 창밖으로 낙양 성문이 보인다. 긴박하고 서늘한 분위기.
    4: 280년 무렵 건업(오나라 수도) 앞 장강. 수많은 진나라 군선과 깃발(글자 없이 무늬만)이 강을 가득 메우고, 성 위에 꽂히는 새 깃발. 사람은 작게만. 맑고 넓은 하늘이 화면 위쪽을 넓게 채운다. 한 시대가 끝나는 웅장한 분위기.
    5: 70대 위나라 대신의 정면 상반신. 검은 진현관, 짙은 회색·검은색 관복, 길고 흰 섞인 수염, 깊은 주름, 속을 알 수 없는 차분하고 날카로운 눈빛, 꾸미지 않은 자연스러운 얼굴(악역 과장 금지). 뒤로 낙양 궁궐 지붕과 흐린 저녁 하늘.

caption: |
  삼국지의 최종 승자는 위나라도, 촉나라도, 오나라도 아니었어요. 마지막에 웃은 건 위나라의 신하였던 사마의의 집안이었죠.

  사마의는 조조 때부터 위나라를 섬긴 대신이었어요. 234년 제갈량이 북쪽으로 쳐들어오자, 섣불리 싸우지 않고 위수 강가에서 끈질기게 버텼어요. 제갈량이 오장원 진중에서 세상을 떠나자 촉군은 물러났죠. 238년에는 요동의 공손연을 무너뜨렸는데, 이때 고구려도 군사를 보내 위나라를 도왔다고 해요.

  위나라 황실의 조상과 권력을 다투게 된 사마의는 247년 무렵부터 늙고 병든 척하며 물러나 있었어요. 그리고 249년 정월, 조상이 어린 황제를 모시고 고평릉 참배를 떠나 낙양을 비운 틈에 정변을 일으켜 단숨에 권력을 손에 넣었습니다.

  사마의는 251년 세상을 떠났지만, 권력은 아들들에게 이어졌어요. 266년 손자 사마염이 위나라 황제에게서 자리를 넘겨받아 진나라를 세웠고, 280년 오나라까지 무너뜨리며 삼국 시대는 막을 내렸습니다.

  끝까지 기다린 사람이 이긴 이야기, 여러분은 사마의의 선택을 어떻게 보시나요?

  * 2~5장 장면은 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 병든 척한 시기는 자료에 따라 247년 무렵으로 조금씩 다르게 전합니다.

