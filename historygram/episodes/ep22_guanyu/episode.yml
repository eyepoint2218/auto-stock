images:
  era: 중국 후한 말~삼국 시대(3세기 초)와 조선 서울(17세기 초·현대)
  hero: 후한 말의 장수. 40~50대 남성, 붉은빛이 도는 얼굴(그림에서는 뒷모습이라 보이지 않음), 가슴까지 내려오는 길고 검은 수염, 녹색 두건과 녹색 전포, 후한식 찰갑, 손에 긴 칼(언월도 대신 후한 시대 장창·장도 느낌). 3세기 후한 복식(명·청·일본풍 금지)
  scenes:
    2: 서울 동대문 근처의 동관왕묘(동묘). 붉은 기둥과 단청이 있는 조선식 사당 건물과 돌담, 마당의 오래된 나무. 사당 문이 살짝 열려 있고 안쪽은 어둡다. 사람은 그리지 않는다. 맑은 가을 하늘, 고요한 분위기.
    3: 3세기 초 넓은 들판. 녹색 두건과 녹색 전포를 두르고 긴 칼을 든 장수의 뒷모습이 말 위에 앉아 있고, 양옆에 의형제 두 사람(한 사람은 관복 차림, 한 사람은 검은 갑옷)의 뒷모습이 나란히 말을 탔다. 멀리 지평선과 깃발(글자 없이 무늬만). 웅장하고 든든한 분위기.
    3.5: 219년 겨울 형주 맥성. 눈발이 날리는 작은 성벽 위에 홀로 서서 성 밖을 둘러싼 수많은 적군의 횃불을 내려다보는 장수의 뒷모습(녹색 전포, 찰갑, 긴 칼). 깃발은 글자 없이 무늬만. 피는 그리지 않는다. 쓸쓸하고 비장한 분위기.
    4: 사당 안 제단. 향 연기가 피어오르는 제단 위에 녹색 옷을 입은 장수의 신상(얼굴은 그림자로 가려 보이지 않게)이 모셔져 있고, 그 앞에서 절하는 여러 시대의 사람들(조선 선비와 백성들)의 뒷모습. 따뜻한 촛불빛. 사당 지붕과 어스름한 하늘이 화면 위쪽을 채운다.
    5: 50대 후한 말 장수의 정면 상반신. 녹색 두건, 녹색 전포 위 찰갑, 가슴까지 내려오는 길고 검은 수염, 붉은빛이 도는 얼굴, 당당하고 깊은 눈빛, 꾸미지 않은 자연스러운 얼굴(경극 분장·과장 금지). 뒤로 형주의 강과 성, 노을 진 하늘.

caption: |
  서울 동대문 근처 동묘에는 조선 사람이 아닌 중국 장수가 모셔져 있어요. 삼국지의 관우예요. 조선은 왜 남의 나라 장수를 모셨을까요?

  관우는 후한 말 유비, 장비와 함께 천하를 누빈 장수였어요. 정사 『삼국지』에도 조조 밑에 잠시 있을 때 백마에서 원소의 장수 안량을 베어 공을 세우고도, 끝내 유비에게 돌아갔다고 적혀 있어요.

  219년 형주를 지키던 관우는 북쪽의 조조군과 싸우는 사이, 동맹이던 손권이 장수 여몽을 보내 형주를 빼앗으면서 고립되었어요. 결국 손권의 군대에 사로잡혀 220년 초 아들 관평과 함께 목숨을 잃었습니다.

  그런데 이야기는 거기서 끝나지 않았어요. 충성과 의리의 상징이 된 관우는 세월이 흐르며 신으로 모셔졌고, 중국에서는 '관제'라 불리는 무신이자 재물의 신이 되었어요. 임진왜란 때 조선에 온 명나라 군대는 관우를 모시는 사당을 세우자고 했고, 1601년 서울 동대문 밖에 동관왕묘, 지금의 동묘가 세워졌습니다. 보물로 지정된 동묘는 지금도 그 자리에 남아 있어요.

  싸움에서 진 장수가 신이 되기까지, 여러분은 동묘에 가 보신 적 있나요?

  * 2~5장 장면은 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 관우의 붉은 얼굴과 청룡언월도는 소설과 후대 그림에서 굳어진 모습입니다. 관우의 생년은 전하지 않습니다.

