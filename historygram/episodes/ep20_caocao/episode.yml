images:
  era: 중국 후한 말~삼국 시대(3세기 초)
  hero: 후한 말의 재상이자 장군. 40~60대 남성, 날카로운 눈매, 짧은 수염, 후한 시대 중국 관복(검은 관모(진현관), 짙은 검은색·남색 넓은 소매 도포), 전장에서는 후한식 찰갑과 검은 망토. 3세기 후한 복식(명·청·일본풍 금지)
  scenes:
    2: 경극 무대처럼 어두운 배경. 하얀 분칠을 한 경극 악역 가면이 바닥에 놓여 금이 가 있고, 그 너머 빛 속으로 걸어가는 관복 차림 남성의 뒷모습(검은 관모, 짙은 남색 도포). 상징적이고 극적인 분위기.
    3: 196년 무렵 황폐해진 중원 들판. 병사들과 백성들이 함께 괭이로 밭을 갈고 씨를 뿌리며, 막 돋아난 새싹이 줄지어 있다. 밭두렁에 서서 그 모습을 바라보는 관복 차림 남성의 뒷모습(검은 관모, 짙은 남색 도포). 맑은 봄 하늘, 희망찬 분위기.
    3.5: 200년 관도 전투. 밤하늘 아래 적군의 거대한 군량 창고가 불타오르고, 언덕 위에서 말을 타고 그 불길을 내려다보는 장수의 뒷모습(후한식 찰갑, 검은 망토). 횃불을 든 기병들. 깃발은 글자 없이 무늬만. 피는 그리지 않는다.
    4: 220년 업성(업) 근처의 언덕. 커다란 봉분도 비석도 없는 소박한 무덤 자리 앞, 늙은 남성의 뒷모습(검은 관모, 소박한 도포)이 지팡이를 짚고 서서 들판을 바라본다. 맑고 넓은 하늘이 화면 위쪽을 넓게 채운다. 고요하고 담담한 분위기.
    5: 60대 후한 말 재상의 정면 상반신. 검은 진현관, 짙은 남색과 검은색 관복, 짧게 다듬은 수염, 날카롭고 지적인 눈빛, 꾸미지 않은 자연스러운 얼굴(경극 분장·악역 과장 금지). 뒤로 업성의 성벽과 동작대, 저녁 하늘.

caption: |
  소설 『삼국지연의』 최고의 악당 조조. 그런데 정사 『삼국지』 속 조조는 꽤 다른 사람이었어요.

  조조가 활약한 후한 말은 전쟁과 흉년으로 사람이 사람을 먹는다는 말까지 나오던 시대였어요. 196년 무렵 조조는 주인 없는 땅에 병사와 떠도는 백성을 모아 농사를 짓게 하는 '둔전'을 열었어요. 곡식이 모이자 군대를 먹이고 백성을 살릴 수 있었고, 이 힘이 그를 일으켰습니다.

  200년 관도에서는 훨씬 큰 원소의 군대를 꺾고 중국 북쪽을 하나로 모았어요. 208년 적벽에서 크게 졌지만, 그가 다진 땅은 훗날 위나라가 되었죠. 출신보다 재능을 보고 사람을 썼고, 시를 잘 지은 문인이기도 했어요.

  220년 세상을 떠나며 그는 큰 봉분도 비석도 만들지 말고, 금은보화 없이 평소 입던 옷으로 소박하게 묻어 달라고 했어요. 2008년 발굴된 것으로 알려진 그의 무덤에서도 화려한 껴묻거리는 나오지 않았다고 해요.

  소설 속 악당과 기록 속 개혁가, 여러분은 어떤 조조가 더 끌리시나요?

  * 『삼국지연의』는 정사를 바탕으로 한 소설이라 조조를 악역으로 과장한 부분이 있습니다. 2~5장 장면은 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 조조의 무덤으로 알려진 고분에 대해서는 학계에 다른 견해도 있습니다.

