# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [조조, 삼국지, 정사 삼국지, 삼국지연의, 간웅, 둔전제, 관도대전, 적벽대전, 위나라, 조조 무덤, 원소, 삼국지 인물]

sources:
  - World History Encyclopedia, "Cao Cao"
  - Wikipedia, "Cao Cao"
  - China Services Info, 조조 고릉(허난 안양) 관련 기사(2025-03)
  - 진수, 정사 『삼국지』 위서 무제기(원문 직접 대조는 못 함)

staging:
  - 155~220 생몰, 둔전(196년 무렵), 200년 관도 승리, 208년 적벽 패배, 소박한 장례 유언, 진수의 평가, 연의가 악역 이미지를 과장했다는 점은 자료로 확인
  - 관도 전투 연도는 200년 통설(일부 199~201년)
  - 재능 위주 인재 등용(구현령)과 시인으로서의 면모는 이번 검색에서 직접 확인 못 함, 널리 알려진 통설로 한 줄만 씀
  - 2008년 무덤 발굴(안양 서고혈촌 고분)은 학계 이견이 있어 알려진이라고 표현하고 각주에 밝힘
  - 사람이 사람을 먹는다는 표현은 후한 말 기근 묘사로 정사·여러 사료에 보이는 표현(직접 대조는 못 함)
  - 2장 경극 가면(연의·경극의 백검 이미지 상징), 3장 둔전, 3.5장 관도 오소 방화, 4장 소박한 무덤 장면은 연출
  - 7장 얼굴은 상상화
