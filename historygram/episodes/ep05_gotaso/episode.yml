images:
  era: 신라 선덕여왕~진덕여왕 시대(7세기 중반)
  hero: 두 인물이 나온다. 아버지 김춘추(40대 신라 귀족 남성, 짙은 수염, 신라 귀족 관복과 관모)와 딸(주인공, 20대 초반 신라 귀족 여인, 7세기 신라 여성 복식(엉덩이를 덮는 긴 저고리, 긴 치마, 어깨에 두른 얇은 숄, 올린 머리)). 두 사람 모두 앞 그림들에서는 얼굴을 보이지 않고, 마지막 그림에서만 딸의 정면 얼굴을 공개한다
  scenes:
    2: 642년 가을 신라 서라벌 귀족 저택의 대청. 무릎 꿇은 전령이 바닥에 엎드려 있고, 붉은 기둥에 한 손을 짚고 기대 선 채 굳어 있는 김춘추의 뒷모습. 바깥 마당에는 낙엽이 지고 해가 기운다. 무겁고 고요한 분위기.
    3: 642년 8월 대야성(지금의 경남 합천). 불길과 연기가 오르는 산성 위, 성벽 너머 몰려오는 백제군을 바라보는 딸(주인공)의 뒷모습(신라 귀족 여인 복식, 바람에 날리는 숄). 성 안 창고에서 불길이 치솟고 병사들이 뛰어다닌다. 피나 시신은 그리지 않는다. 깃발은 글자 없이 무늬만.
    3.5: 642년 겨울. 눈 덮인 고갯길을 넘어 고구려로 향하는 신라 사신 행렬. 말 위에 앉은 김춘추의 뒷모습(두꺼운 겉옷, 관모), 뒤따르는 수행원들과 짐을 실은 말. 멀리 흐린 하늘 아래 이어진 산맥.
    4: 648년 당나라 장안의 궁궐. 높은 계단과 거대한 전각 앞마당에 늘어선 당나라 관리들 사이로, 계단 아래에서 예를 갖춰 선 신라 사신 김춘추의 뒷모습(신라 관복). 웅장한 지붕 위로 맑은 하늘이 화면 위쪽을 넓게 채운다. 깃발과 현판에는 글자 없이.
    5: 20대 초반 신라 귀족 여인(딸)의 정면 상반신. 7세기 신라 여성 복식(긴 저고리, 어깨에 두른 얇은 숄, 단정히 올린 머리에 소박한 장신구). 슬픔을 머금었지만 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화된 미인형 금지). 뒤로 가을 들판 너머 산성과 노을.

caption: |
  딸의 죽음을 들은 김춘추는 하루 종일 기둥에 기대 선 채, 눈앞에 사람이 지나가도 알아보지 못했다고 해요. 그 딸의 이름은 고타소였어요.

  642년 8월, 백제 장군 윤충이 신라 서쪽의 요충지 대야성을 공격했어요. 성을 지키던 김품석은 김춘추의 사위였고, 고타소는 그의 아내였죠. 성 안에서 내통이 일어나며 대야성은 무너졌고, 고타소도 남편과 함께 세상을 떠났습니다.

  슬픔에 잠긴 김춘추는 백제를 꺾겠다고 다짐했어요. 그해 고구려로 가서 연개소문에게 군사를 청했지만 거절당하고 갇혔다가 겨우 돌아왔죠. 648년에는 당나라로 건너가 마침내 나당동맹을 맺었습니다.

  648년 김유신은 사로잡은 백제 장수 8명을 내주고 고타소 부부의 유골을 되찾아 왔어요. 그리고 660년 백제가 무너지던 날, 고타소의 남동생 김법민(훗날 문무왕)은 의자왕의 아들 부여융 앞에서 누이의 억울한 죽음을 꾸짖었다고 전해요.

  한 사람의 죽음이 삼국의 운명을 바꾼 이야기, 여러분은 어떻게 보셨나요?

  * 1장 내용은 『삼국사기』에 전하는 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 고타소가 세상을 떠난 경위는 자료에 따라 다르게 전합니다.

