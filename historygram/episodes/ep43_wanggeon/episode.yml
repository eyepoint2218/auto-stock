images:
  era: 신라 말~고려 초(890~943년), 후삼국 시대
  hero: 송악 호족 출신 장수이자 고려의 첫 왕. 20대(수군 장수)부터 60대까지 나이가 드는 모습. 넓은 어깨, 넉넉하고 너그러운 인상, 짙은 수염. 젊을 때는 비늘 갑옷과 짙은 감색(남보라빛) 망토, 왕이 된 뒤에는 짙은 황색(누런 금빛) 곤룡포 느낌의 비단 포와 검은 관. 앞 회차 고려 인물(고종 자줏빛·원종 자홍색·김준 쑥색)과 구별
  scenes:
    2: 900년 무렵 한반도를 내려다본 듯한 넓은 풍경. 서로 다른 세 깃발(붉은색, 검은색, 흰색, 글자 없이 무늬만)을 든 세 무리의 군대가 산과 강을 사이에 두고 맞서 있다. 주인공은 나오지 않는다. 흐리고 무거운 하늘, 나라가 갈라진 혼란스러운 분위기.
    3: 903년 무렵 남해 바다. 수십 척의 군선이 돛을 펴고 나아가고, 앞쪽 바닷가에 나주의 성과 포구가 보인다. 맨 앞 군선 뱃머리에 서서 칼을 들어 진격을 명령하는 젊은 장수의 뒷모습(비늘 갑옷, 짙은 감색 망토). 바람에 부푼 돛, 맑지만 파도가 이는 바다.
    3.5: 918년 철원 궁궐 앞마당. 새벽, 수많은 장수와 신하, 병사들이 무릎을 꿇고 고개를 숙인 가운데, 그들 앞 계단 위에 서 있는 장수의 뒷모습(짙은 감색 망토). 멀리 동이 트는 하늘, 새 시대가 열리는 장엄한 분위기.
    4: 936년 넓은 들판(일리천). 수많은 고려 군대와 깃발(글자 없이 무늬만) 앞에서 백마를 타고 들판을 내려다보는 왕의 뒷모습(누런 금빛 비단 포 위 갑옷, 검은 관). 멀리 무기를 내려놓고 항복하는 적군. 피는 그리지 않는다. 넓고 맑은 가을 하늘이 화면 위쪽을 넓게 채운다.
    5: 60대 고려 태조의 정면 상반신. 검은 관, 누런 금빛 비단 포와 옥대, 짙은 수염에 흰 기운, 넉넉하고 너그럽지만 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 송악산과 개경 궁궐 지붕, 저녁 노을.

caption: |
  신라 말, 한반도는 다시 셋으로 갈라졌어요. 견훤의 후백제, 궁예의 후고구려, 그리고 힘을 잃은 신라였죠. 이 갈라진 나라를 다시 하나로 묶은 사람이 고려를 세운 왕건이에요.

  왕건은 877년 송악(지금의 개성)에서 바다 무역으로 힘을 키운 호족 집안에 태어났어요. 아버지와 함께 궁예의 신하가 된 그는 수군을 이끌고 바다를 건너 후백제의 뒤쪽인 나주를 차지하며 이름을 떨쳤어요.

  궁예가 점점 사나워지며 민심을 잃자, 918년 장수들은 왕건을 왕으로 추대했어요. 왕건은 궁예를 몰아내고 나라 이름을 고려라 했고, 이듬해 도읍을 송악으로 옮겼어요. 고구려를 잇겠다는 뜻이 담긴 이름이에요.

  왕건은 싸움만큼 포용을 중요하게 여겼어요. 935년 신라 경순왕이 스스로 나라를 넘겨 오자 정성껏 맞이했고, 같은 해 아들에게 쫓겨난 견훤까지 받아들였어요. 그리고 936년 일리천에서 후백제군을 크게 무찔러 후삼국을 통일했어요. 그는 각 지역 호족의 딸들과 혼인하고, 사심관과 기인 제도로 지방 세력을 끌어안았으며, 후대 왕들에게 훈요 10조를 남겼어요.

  칼보다 포용으로 나라를 하나로 만든 왕, 여러분은 왕건의 방식을 어떻게 보시나요?

  * 1장 내용은 『고려사』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 나주를 차지한 해와 마지막 전투의 장소는 자료에 따라 조금씩 다르게 전합니다.

