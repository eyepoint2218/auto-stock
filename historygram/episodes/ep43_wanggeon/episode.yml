staging:
  - 877년 송악 호족 왕륭의 아들, 896년 궁예에 귀부, 수군으로 나주 점령, 918년 궁예 축출·고려 건국, 919년 송악 천도, 935년 경순왕 귀부·견훤 귀순, 936년 후백제 멸망으로 통일, 혼인·사심관 등 호족 포섭책, 북진 정책은 자료로 확인
  - 일리천 전투, 기인 제도, 훈요 10조는 이번 검색에서 직접 확인 못 했지만 교과서 통설로 씀
  - 나주 점령 연도(903년 무렵)와 마지막 전투 장소(일리천·황산) 표기 차이는 각주로
  - 후고구려 국호(마진·태봉 변경)는 흐름상 후고구려로 통칭
  - 2장 세 나라 군대(주인공 없음), 3장 나주 수군, 3.5장 추대, 4장 일리천 장면은 연출
  - 7장 얼굴은 상상화
