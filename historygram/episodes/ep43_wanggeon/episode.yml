# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [왕건, 고려 태조, 고려 건국, 후삼국 통일, 궁예, 견훤, 경순왕, 일리천 전투, 혼인 정책, 사심관, 기인 제도, 훈요 10조]

sources:
  - 한국민족문화대백과 후삼국시대 관련 항목
  - 위키문헌, 글로벌 세계 대백과사전 「고려의 통일」
  - 한국경제 생글생글, 대원고 최경석 쌤의 술술 읽히는 한국사(2015), 고려 건국 관련 연재(2021)
  - 경향신문, 왕건 북진 정책 관련 기사(2008)
