images:
  era: 백제 말기(7세기 중반)
  hero: 백제의 고위 신하(좌평). 50~60대 남성, 흰 수염, 백제 귀족 관복(자줏빛 넓은 소매 도포, 검은 관, 은꽃 장식). 옥에 갇힌 뒤에는 흐트러진 흰옷
  scenes:
    2: 656년 백제 사비성의 어두운 옥. 짚이 깔린 바닥에 앉아 희미한 촛불 아래 붓으로 글을 쓰는 노신하의 뒷모습(흐트러진 흰옷, 흰 머리). 창살 사이로 들어오는 차가운 달빛. 피는 그리지 않는다.
    3: 656년 사비성 궁궐 연회장. 화려한 등불과 음악, 술상 앞에 앉은 왕(얼굴은 작게, 멀리). 연회장 한가운데 홀로 서서 왕을 향해 두 손을 모은 노신하의 뒷모습(자줏빛 관복, 검은 관). 주변 신하들이 놀란 듯 숨을 죽인다.
    3.5: 궁궐 회랑. 병사들에게 양팔을 붙잡혀 끌려 나가면서도 고개를 꼿꼿이 든 노신하의 뒷모습(관이 벗겨져 흰 머리가 드러남, 자줏빛 관복). 뒤로 멀어지는 연회장의 불빛. 폭력이나 피는 그리지 않는다.
    4: 660년 여름 금강 하구(기벌포). 넓은 강 하구를 가득 메우고 거슬러 올라오는 수많은 당나라 배와 돛(깃발은 글자 없이 무늬만), 강가 언덕에 텅 비어 있는 백제 초소. 사람은 작게만. 흐리고 무거운 하늘이 화면 위쪽을 넓게 채운다.
    5: 60대 백제 노신하의 정면 상반신. 자줏빛 관복과 검은 관, 흰 머리와 흰 수염, 강직하고 맑은 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 부여 부소산과 백마강, 저녁 햇빛.

caption: |
  옥에서 숨을 거두기 직전, 한 신하는 마지막 힘을 다해 왕에게 글을 남겼어요. 적이 오면 이곳과 이곳을 막으라고요. 백제의 충신 성충 이야기예요.

  의자왕은 즉위 초 신라를 거세게 몰아붙였지만, 거듭된 승리에 점점 마음을 놓았어요. 656년, 좌평 성충은 나라가 위태롭다며 목소리를 높여 바른말을 했습니다. 화가 난 왕은 그를 옥에 가뒀고, 성충은 그곳에서 세상을 떠났어요.

  그가 마지막으로 남긴 글은 이랬다고 해요. "적이 쳐들어오면 육로로는 탄현을 넘지 못하게 하고, 수군은 기벌포에 들이지 마십시오. 험한 곳에 의지해 싸우면 반드시 이길 것입니다."

  4년 뒤인 660년, 신라군은 탄현을 넘었고 당나라 수군은 기벌포로 들어왔어요. 성충의 말은 들어지지 않았고, 백제는 무너졌습니다. 의자왕은 끌려가며 "성충의 말을 듣지 않은 것이 후회스럽다"고 탄식했다고 전해요.

  오늘날 부여의 삼충사에는 성충이 흥수, 계백과 함께 모셔져 있어요. 여러분은 목숨을 걸고 바른말을 할 수 있을까요?

  * 1장과 유언은 『삼국사기』 백제본기 의자왕조에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다.

hashtags: [역사그램, 성충, 의자왕, 백제, 문무]

# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [성충, 백제 충신, 의자왕, 탄현, 기벌포, 흥수, 계백, 삼충사, 부여, 백제 멸망, 좌평, 드라마 문무]

sources:
  - 한국민족문화대백과 성충 항목
  - 위키문헌, 『삼국사기』 권28 백제본기 의자왕 번역
  - 경북매일, 황산벌 관련 기사(2023-07-18)

staging:
  - 656년 간언과 투옥, 옥중 사망(유사), 탄현·기벌포 유언은 『삼국사기』 백제본기와 한국민족문화대백과로 확인
  - 굶어 죽었다는 표현 대신 옥에서 세상을 떠났다로 씀(유사는 옥중에서 병들거나 굶주려 죽음)
  - 의자왕이 성충의 말을 듣지 않은 것을 후회했다는 일은 『삼국사기』에 전하는 것으로 알려짐(이번 검색에서 원문 직접 확인 못 함) → 전해요로 표현
  - 의자왕의 주색은 기록의 표현이지만 평가가 갈려 게시글에서는 마음을 놓았다로 순화
  - 2장 옥중 글쓰기, 3장 연회장 간언, 3.5장 끌려 나가는 장면, 4장 기벌포 장면은 연출
  - 생년 미상
  - 7장 얼굴은 상상화
  - 검색 결과의 연재소설 「불멸의 백제」는 허구라 쓰지 않음
