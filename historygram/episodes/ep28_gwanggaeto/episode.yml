images:
  era: 고구려 4세기 말~5세기 초
  hero: 고구려의 왕. 10대 후반(첫 그림)부터 30대까지. 고구려 고분벽화풍 복식(새 깃털을 꽂은 금관 또는 절풍, 통 넓은 소매의 겉옷과 바지), 전장에서는 고구려식 비늘 갑옷과 철 투구, 진한 자주색 망토, 말까지 갑옷을 입힌 개마무사와 함께. 앞 회차 고구려 인물(연개소문 붉은색·고건무 녹색·고연무 갈색)과 구별
  scenes:
    2: 391년 고구려 국내성 궁궐. 높은 계단 위로 걸어 올라가는 젊은 왕의 뒷모습(자주색 망토, 새 깃털 금관), 계단 양옆에 늘어선 신하와 장수들이 고개를 숙인다. 뒤로 압록강가의 산과 성벽. 맑은 아침, 새 시대가 열리는 분위기.
    3: 고구려 궁궐 안. 넓은 탁자 위에 펼쳐진 큰 지도 앞에서 붓을 들고 무언가를 적는 젊은 왕의 손과 뒷모습(자주색 겉옷). 지도에는 산과 강만 그려져 있고 글자는 없다. 등불과 장수들의 그림자. 결연하고 야심찬 분위기.
    3.5: 400년 신라 땅 들판. 말까지 갑옷을 입힌 고구려 개마무사 대군이 흙먼지를 일으키며 달려가고, 맨 앞에서 군대를 이끄는 장수의 뒷모습(비늘 갑옷, 자주색 망토, 철 투구). 멀리 바다 쪽으로 물러나는 적군과 배들. 깃발은 글자 없이 무늬만. 피는 그리지 않는다.
    4: 요동 벌판의 큰 성(요동성)을 바라보는 언덕. 수많은 고구려 기병과 깃발(글자 없이 무늬만) 사이에서 말을 타고 성을 내려다보는 왕의 뒷모습(자주색 망토, 비늘 갑옷). 끝없이 펼쳐진 들판과 넓고 맑은 하늘이 화면 위쪽을 채운다.
    5: 30대 고구려 왕의 정면 상반신. 새 깃털을 꽂은 금관, 비늘 갑옷 위 자주색 망토, 단정한 수염, 자신감 있고 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 우뚝 선 거대한 돌비석(광개토대왕릉비, 글자는 알아볼 수 없게 흐릿하게)과 만주 벌판, 저녁 하늘.

caption: |
  열여덟 살에 왕이 된 소년이, 고구려를 동북아시아의 강자로 만들었어요. 땅을 넓게 개척한 왕, 광개토대왕 이야기예요.

  고구려 제19대 왕 광개토대왕은 391년 열여덟의 나이로 왕위에 올랐어요. 그는 '영락'이라는 연호를 썼는데, 스스로 연호를 정했다는 건 중국과 대등한 나라라는 자신감을 보여 줘요. 그래서 영락대왕이라고도 불려요.

  396년에는 직접 군대를 이끌고 한강을 건너 백제의 58개 성과 700개 마을을 무너뜨렸고, 백제 아신왕의 항복을 받아 냈어요. 400년에는 왜의 침입에 시달리던 신라가 도움을 청하자 보병과 기병 5만을 보내 왜군을 물리쳤죠. 서쪽으로는 후연과 싸워 요동 일대를 차지했고, 북쪽의 동부여까지 굴복시켰어요.

  412년 그가 세상을 떠나자 아들 장수왕은 414년 지금의 중국 지린성 지안에 아버지의 업적을 새긴 거대한 비석을 세웠어요. 높이 6m가 넘는 광개토대왕릉비예요. 우리가 그의 업적을 자세히 아는 것도 이 비석 덕분이에요.

  열여덟에 왕이 되어 나라의 지도를 바꾼 사람, 여러분은 광개토대왕의 어떤 업적이 가장 대단하다고 생각하시나요?

  * 2~5장 장면은 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 재위 연대는 광개토대왕릉비 기준(391~412)이고, 『삼국사기』는 392~413년으로 1년 다르게 적고 있습니다.

