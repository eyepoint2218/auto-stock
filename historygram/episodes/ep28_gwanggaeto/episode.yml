staging:
  - 374~412 생몰, 391년 18세 즉위(능비 기준), 영락 연호, 396년 백제 58성 700촌 공파와 아신왕 항복, 400년 보병·기병 5만으로 신라 구원·왜 격퇴, 후연과 싸워 요동 차지, 410년 동부여 정벌, 414년 장수왕의 광개토대왕릉비(지안, 약 6.4m)는 자료로 확인
  - 재위 연대 능비(391~412)와 삼국사기(392~413) 차이를 각주에 밝힘
  - 연호가 중국과 대등함을 보인다는 해석은 교과서 통설
  - 신묘년 기사 해석 논쟁은 이번 회차 주제와 멀어 쓰지 않음
