images:
  era: 고려 11세기 초(1010~1019년), 고려·거란 전쟁
  hero: 고려의 문신이자 상원수. 60대(1010년)부터 70대까지. 작고 마른 체구, 흰 머리와 흰 수염. 조정에서는 짙은 남청색 관복과 검은 복두, 전장에서는 고려식 철 비늘 갑옷 위 짙은 남청색 전포와 둥근 철 투구
  scenes:
    2: (릴스 장면 01 재사용) 무너져 흩어지며 달아나는 거란 기병들과 넘어진 깃발, 연기 낀 겨울 벌판.
    3: 1010년 고려 개경 궁궐 회의장. 겁에 질린 신하들이 고개를 숙이고 항복을 말하는 가운데, 홀로 앞으로 나서서 두 손을 모으고 반대 의견을 올리는 60대 문신의 뒷모습(작고 마른 체구, 짙은 남청색 관복, 검은 복두). 높은 왕좌의 젊은 왕은 얼굴이 그림자로 가려져 있다. 촛불, 긴장된 분위기.
    3.5: 1018년 겨울 흥화진 앞 큰 냇물. 쇠가죽을 굵은 줄로 꿰어 쌓은 둑이 터지며 물살이 쏟아져 내려가고, 냇물을 건너던 거란 기병들이 물살에 휩쓸려 흩어진다. 언덕 위에서 이를 지켜보는 70대 노장의 뒷모습(흰 머리, 철 비늘 갑옷 위 짙은 남청색 전포, 둥근 철 투구). 피는 그리지 않는다.
    4: (릴스 장면 03 재사용) 귀주 벌판이 내려다보이는 언덕 위에서 전장을 바라보는 노장의 뒷모습.
    5: (릴스 장면 04 재사용) 70대 고려 상원수의 정면 상반신.

caption: |
  거란 10만 대군 가운데 살아서 돌아간 병사는 수천 명뿐이었어요. 그 대군을 무너뜨린 사람은 고려의 강감찬이에요.

  강감찬은 948년 지금의 서울 관악구 일대에서 태어났어요. 그가 태어날 때 큰 별이 떨어졌다는 이야기가 전해, 그곳을 낙성대라 불러요. 그는 칼이 아니라 붓을 든 문신이었어요. 1010년 거란이 두 번째로 쳐들어오자 많은 신하가 항복을 말했지만, 강감찬은 홀로 반대하며 현종에게 남쪽으로 몸을 피했다가 다시 싸우자고 했어요.

  1018년 거란의 소배압이 10만 대군을 이끌고 세 번째로 쳐들어왔어요. 일흔이 넘은 강감찬은 상원수가 되어 고려군 20만여 명을 이끌었죠. 흥화진에서는 쇠가죽을 꿰어 냇물을 막았다가 적이 건널 때 터뜨려 공격했다는 기록이 전해요.

  거란군이 개경 가까이까지 왔다가 물러나자, 강감찬은 1019년 귀주에서 그들을 크게 무찔렀어요. 이 싸움이 바로 귀주대첩이에요. 이후 고려와 거란 사이에는 오랜 평화가 이어졌고, 그는 개경을 둘러싸는 나성을 쌓자고 건의하기도 했어요.

  일흔의 나이에 나라를 지킨 문신, 여러분은 강감찬의 어떤 모습이 가장 인상 깊나요?

  * 1장 내용은 『고려사』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 귀주대첩의 달(2월·3월)과 고려군 병력은 자료에 따라 조금씩 다르게 전합니다.

