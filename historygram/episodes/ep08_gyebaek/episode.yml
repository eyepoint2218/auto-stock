images:
  era: 백제 말기(7세기 중반, 660년)
  hero: 백제의 장군. 40대 남성, 짙은 수염, 백제식 비늘 갑옷과 투구, 짙은 붉은색 망토(앞 회차 신라 김유신의 청색과 구별). 평상시에는 백제 귀족 복식(넓은 소매 겉옷, 검은 관)
  scenes:
    2: 660년 여름밤 백제 사비성 안 장군의 집. 달빛 아래 텅 빈 마당, 대문 앞에 홀로 서서 하늘을 올려다보는 장군의 뒷모습(비늘 갑옷, 붉은 망토, 투구는 손에 듦). 집 안은 불이 꺼져 어둡다. 사람이나 피는 그리지 않고 깊은 정적과 슬픔만.
    3: 660년 여름 황산벌. 언덕 위에 줄지어 선 백제 결사대 병사들 앞에 서서 들판을 바라보는 장군의 뒷모습(비늘 갑옷, 투구, 붉은 망토). 들판 건너편을 끝없이 메운 신라 대군과 깃발(글자 없이 무늬만). 수적으로 압도적인 차이가 한눈에 보이도록. 흐린 하늘.
    3.5: 황산벌 전투 한복판. 흙먼지 속에서 칼을 높이 들고 병사들을 이끌어 돌격하는 장군의 뒷모습(붉은 망토, 비늘 갑옷). 앞쪽으로 물러나는 신라군 깃발, 뒤따르는 백제 병사들. 피는 그리지 않는다.
    4: 황산벌의 해 질 녘. 싸움이 끝난 들판에 꽂힌 채 바람에 날리는 찢어진 백제 깃발(글자 없이 무늬만)과, 그 옆 땅에 꽂힌 장군의 칼과 투구. 사람은 그리지 않는다. 붉게 타는 노을 하늘이 화면 위쪽을 넓게 채운다.
    5: 40대 백제 장군의 정면 상반신. 비늘 갑옷 위 짙은 붉은 망토, 짙은 수염, 슬픔과 결의가 함께 담긴 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 황산벌의 넓은 들판과 낮은 산, 저녁 햇빛.

caption: |
  싸움터로 떠나기 전, 그는 제 손으로 가족의 목숨을 거뒀다고 해요. 살아서 적의 노비가 되느니 차라리 죽는 게 낫다면서요. 백제의 마지막 장군, 계백 이야기예요.

  660년 당나라 소정방의 대군이 바다로, 김유신이 이끄는 신라 5만 대군이 육지로 백제를 향해 왔어요. 의자왕은 계백에게 5천 명의 결사대를 맡겼습니다.

  황산벌에서 결사대는 몇 배나 많은 신라군과 맞서 네 번을 싸워 모두 이겼다고 전해요. 신라군의 기세가 꺾이자 어린 화랑 반굴과 관창이 홀로 적진에 뛰어들었어요. 계백은 사로잡은 관창을 한 번 살려 보냈지만, 다시 달려들자 끝내 목을 베어 돌려보냈죠. 관창의 죽음에 신라군은 다시 일어섰고, 결사대는 무너졌어요. 계백도 그곳에서 쓰러졌습니다.

  그 뒤 사비성은 함락되었고, 백제는 678년의 역사를 마감했어요. 가족을 먼저 보낸 일은 조선 시대에도 잔인하다는 비판과 충절이라는 평가가 엇갈렸지만, 계백은 오늘날까지 나라를 끝까지 지킨 장군으로 기억되고 있어요.

  여러분은 계백의 선택을 어떻게 보시나요? 댓글로 생각을 들려주세요.

  * 1장 내용은 『삼국사기』 계백 열전에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 네 번 싸워 이겼다는 서술은 계백 열전의 기록이고, 신라본기에는 신라군이 네 번 싸워 불리했다고 적혀 있습니다.

