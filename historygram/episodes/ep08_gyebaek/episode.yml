staging:
  - 1장 처자 살해는 『삼국사기』 계백 열전 기록, 조선 시대 권근 비판·서거정 등 평가가 엇갈림 → 게시글에 함께 적음
  - 2장 빈 집 마당(사람·피 없음), 3장 대치, 3.5장 돌격, 4장 노을 속 깃발 장면은 연출
  - 네 번 싸워 이겼다는 서술은 계백 열전, 신라본기는 신라군이 네 번 불리했다고 적음(같은 사실을 양쪽에서 기록) → 각주에 밝힘
  - 신라 5만은 신라본기 "정병 5만" 기록에 근거
  - 백제 678년 역사는 기원전 18년 건국 통설 기준
  - 생년 미상
  - 7장 얼굴은 상상화
