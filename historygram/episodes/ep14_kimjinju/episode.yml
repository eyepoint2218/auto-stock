images:
  era: 신라 태종무열왕~문무왕 시대(7세기 중반)
  hero: 신라의 고위 장수(병부령). 40~50대 남성, 짧은 수염, 신라식 비늘 갑옷과 투구, 짙은 회녹색 망토(앞 회차 김유신 청색·김품석 청록과 구별). 평상시에는 신라 귀족 관복(자줏빛이 아닌 짙은 녹색)과 관모
  scenes:
    2: 660년 여름 신라 서라벌 궁궐 앞마당. 출정을 앞두고 늘어선 신라군 앞에서, 계단 위 왕(얼굴은 작게, 멀리)에게 예를 갖추는 장수의 뒷모습(비늘 갑옷, 회녹색 망토). 수많은 깃발(글자 없이 무늬만)과 맑은 하늘. 위풍당당한 분위기.
    3: 660년 백제 원정길. 산길을 따라 끝없이 이어진 신라군 행렬, 언덕 위에서 말을 타고 행렬을 지휘하는 장수의 뒷모습(회녹색 망토, 투구). 멀리 백제 땅의 들판과 강. 화창한 여름날.
    3.5: 662년 여름 신라 귀족 저택의 어두운 방. 이불 곁에 앉아 문밖을 등진 채 고개를 돌린 장수의 뒷모습(갑옷을 벗은 짙은 녹색 평상복). 문밖 마당에는 출전 명령을 전하러 온 전령이 무릎 꿇고 기다린다. 무겁고 어색한 정적.
    4: 662년 신라 궁궐. 높은 단 위 어좌에 앉은 문무왕의 실루엣(얼굴은 보이지 않게), 단 아래 병사들에게 끌려 나가는 장수의 뒷모습(관모가 벗겨짐, 녹색 관복). 양옆에 늘어선 신하들이 고개를 숙이고 있다. 피나 폭력은 그리지 않는다. 화면 위쪽은 궁궐 지붕과 흐린 하늘.
    5: 40~50대 신라 장수의 정면 상반신. 비늘 갑옷 위 회녹색 망토, 관모 또는 투구, 짧은 수염, 오만함과 회한이 함께 스친 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 서라벌 궁궐 지붕과 흐린 저녁 하늘.

caption: |
  백제를 무너뜨린 원정군을 이끌었던 장군이, 불과 2년 뒤 일족과 함께 처형됐어요. 승리의 주역에게 무슨 일이 있었을까요? 신라의 병부령 김진주 이야기예요.

  김진주는 김유신을 도와 백제 정벌에 공을 세운 장수였어요. 659년 신라의 군사를 총괄하는 병부령이 되어 백제 원정군을 지휘했죠. 그리고 660년, 백제는 무너졌습니다.

  하지만 싸움은 끝나지 않았어요. 백제 유민들이 곳곳에서 부흥 운동을 일으켰고, 662년 8월 내사지성에서 반란이 일어나자 신라는 19명의 장군을 보내 토벌에 나섰어요. 그런데 대당장군이던 김진주는 남천주총관 진흠과 함께 병을 핑계로 출전하지 않았습니다.

  막 왕위에 오른 문무왕은 이를 나랏일을 게을리한 죄로 보고, 두 사람은 물론 그 일족까지 벌했어요. 통일 전쟁이 한창이던 때, 왕은 아무리 공이 큰 장수라도 예외를 두지 않았던 거예요.

  지난날의 공과 오늘의 책임, 여러분은 문무왕의 결정을 어떻게 보시나요?

  * 1장 내용은 『삼국사기』에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 김진주의 생년과 자세한 생애는 전하지 않습니다.

