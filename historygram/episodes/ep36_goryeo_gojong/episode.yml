images:
  era: 고려 13세기(몽골 침입기, 1231~1259년), 강화도
  hero: 고려의 왕. 40대(첫 그림)부터 60대 후반까지 나이가 드는 모습. 고려 왕의 복식(검은 비단 관, 자황색 비단 포와 옥대), 마르고 지친 인상. 앞 회차 왕들(장수왕 남색·근초고왕 황토금색·진흥왕 상아빛·보장왕 연청색)과 구별되게 짙은 자황색(붉은빛 도는 황색)
  scenes:
    2: 1250년대 강화도 해안의 흙 성벽 위. 밤, 좁은 바다 건너 육지 쪽 들판에 줄지어 켜진 몽골군 진영의 불빛과 깃발(글자 없이 무늬만). 성벽 위에 홀로 서서 그 불빛을 바라보는 왕의 뒷모습(검은 관, 자황색 포). 성벽 아래 횃불을 든 고려 병사들. 고요하고 불안한 분위기.
    3: 1232년 여름 장맛비 속 바닷가 나루. 개경을 떠나 강화도로 건너는 배 행렬, 짐 보따리를 진 관리와 백성들, 진흙탕 길. 배 위에 서서 멀어지는 육지를 돌아보는 왕의 뒷모습(자황색 포, 비에 젖음). 회색 하늘, 쏟아지는 비, 무거운 분위기.
    3.5: 강화도의 큰 작업장. 수많은 장인들이 나란히 앉아 큰 나무 경판에 글자를 새기고, 완성된 경판이 선반에 빼곡히 쌓여 있다(경판 글자는 알아볼 수 없게 작은 무늬로만). 작업장 한가운데 서서 경판 하나를 두 손으로 들어 보는 왕의 뒷모습(자황색 포). 나무 향이 느껴지는 따뜻하고 경건한 분위기.
    4: 1259년 봄 강화도 나루. 바다로 떠나는 배에 오르는 젊은 태자 일행(태자는 뒷모습, 붉은빛 포), 부두에서 그들을 배웅하는 늙고 병든 왕의 뒷모습(지팡이, 자황색 포, 흰머리). 넓은 바다와 맑은 봄 하늘이 화면 위쪽을 넓게 채운다. 쓸쓸하지만 새 길이 열리는 분위기.
    5: 60대 후반 고려 왕의 정면 상반신. 검은 비단 관, 짙은 자황색 비단 포와 옥대, 희끗한 수염, 오랜 전쟁에 지친 듯하지만 끝까지 버틴 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 강화도의 흙 성벽과 바다, 저녁 노을.

caption: |
  몽골군이 쳐들어온 뒤 28년 동안, 고려의 왕은 섬에서 버텼어요. 고려 제23대 왕 고종 이야기예요.

  고종은 1213년 왕위에 올라 46년 동안 나라를 다스렸어요. 고려 왕 가운데 가장 오래 왕위에 있었지만, 이 시기 나라의 실권은 최씨 무신 정권이 쥐고 있었어요.

  1231년 몽골이 고려에 쳐들어왔어요. 이듬해 1232년, 최우의 주도로 고종과 조정은 도읍을 개경에서 강화도로 옮겼어요. 바다에 약한 몽골군을 막기 위해서였죠. 그 뒤로도 몽골은 여러 차례 쳐들어왔고, 육지의 백성들은 큰 고통을 겪었어요.

  고려는 부처의 힘으로 나라를 지키려는 바람을 담아 1236년부터 1251년까지 16년에 걸쳐 대장경을 새겼어요. 이것이 지금 합천 해인사에 남아 있는 팔만대장경이에요. 1258년 최씨 정권의 마지막 집정 최의가 무너지자, 고종은 이듬해 태자를 몽골에 보내 전쟁을 끝낼 길을 열었고, 그해 세상을 떠났어요.

  12월 5일 시작하는 드라마 〈신의 구슬〉은 바로 이 시기, 1258년 고려를 배경으로 해요.

  섬에서 28년을 버틴 왕, 여러분은 고종의 시대를 어떻게 보시나요?

  * 1장 내용은 『고려사』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 28년은 몽골의 첫 침입(1231년)부터 고종이 세상을 떠난 해(1259년)까지입니다.

