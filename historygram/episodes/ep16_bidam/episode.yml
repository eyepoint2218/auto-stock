images:
  era: 신라 선덕여왕 말기(647년)
  hero: 신라 최고 관직 상대등. 50대 남성, 짙은 수염, 신라 귀족 관복(검붉은 넓은 소매 도포, 관모), 반란 때는 관복 위에 검은 비늘 갑옷과 검은 망토. 앞 회차 김춘추(자줏빛)·김유신(청색)과 구별되는 검붉은·검은 색
  scenes:
    2: 647년 정월 밤 서라벌. 별이 가득한 겨울 밤하늘을 가로지르며 큰 별똥별이 궁궐(월성) 쪽으로 떨어진다. 언덕 위 성(명활성)에서 횃불을 든 반란군이 그 별을 올려다본다. 사람은 작게, 하늘과 별똥별이 주인공.
    3: 647년 정월 명활성 진영. 횃불 아래 모여든 귀족과 병사들 앞에 서서 칼을 높이 든 상대등의 뒷모습(검붉은 관복 위 검은 갑옷, 검은 망토). 멀리 어둠 속에 월성의 불빛. 깃발은 글자 없이 무늬만. 긴장되고 들뜬 분위기.
    3.5: 명활성 성벽 위. 하늘에 떨어지는 큰 별똥별을 가리키며 병사들에게 외치는 상대등의 뒷모습(검은 망토가 바람에 휘날림). 병사들이 함성을 지르며 창을 치켜든다. 붉은 횃불과 푸른 밤하늘의 대비.
    4: 647년 정월 밤 월성 궁궐 마당. 짙은 청색 망토를 두른 장군(김유신, 뒷모습)이 지켜보는 가운데, 병사들이 불붙은 허수아비를 매단 커다란 연을 밤하늘로 띄워 올린다. 연이 불꽃 꼬리를 그리며 별처럼 하늘로 솟구친다. 밤하늘이 화면 위쪽을 넓게 채운다. 주인공(상대등)은 이 그림에 나오지 않는다.
    5: 50대 신라 귀족의 정면 상반신. 검붉은 관복 위 검은 비늘 갑옷과 검은 망토, 관모, 짙은 수염, 야망과 불안이 함께 담긴 날카로운 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 횃불이 타는 명활성과 별이 뜬 겨울 밤하늘.

caption: |
  하늘에서 떨어진 별 하나가 반란의 운명을 갈랐어요. "여왕은 나라를 잘 다스리지 못한다"며 반란을 일으킨 신라의 상대등, 비담 이야기예요.

  비담은 645년 신하 가운데 가장 높은 자리인 상대등에 올랐어요. 그리고 647년 정월, 염종 등과 함께 "여왕은 나라를 잘 다스리지 못한다"는 구호를 내걸고 명활성에서 반란을 일으켰습니다. 반란군은 월성의 관군과 10여 일 동안 맞섰어요.

  그러던 어느 밤, 큰 별 하나가 월성 쪽으로 떨어졌어요. 비담은 "여왕이 패할 징조다!"라며 군사들의 기세를 올렸죠. 그러자 김유신은 허수아비에 불을 붙여 연에 매달아 하늘로 띄우고, "어젯밤 떨어진 별이 다시 하늘로 올라갔다"는 소문을 퍼뜨렸다고 해요. 흔들리던 관군의 마음은 다시 굳어졌고, 반란은 김유신의 군대에 무너졌습니다.

  비담과 그 일족, 반란에 가담한 30여 명은 목숨을 잃었어요. 반란이 진압되던 무렵 선덕여왕은 세상을 떠났고, 진덕여왕이 뒤를 이었습니다. 이 일을 거치며 김춘추와 김유신은 신라의 중심에 섰어요.

  별 하나로 갈린 승부, 여러분은 비담과 김유신 중 누구의 꾀가 더 대단했다고 보시나요?

  * 1장과 별똥별·연 이야기는 『삼국사기』 김유신 열전 등에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 비담의 생년은 전하지 않습니다.

