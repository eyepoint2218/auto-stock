images:
  era: 당나라 태종 시대(7세기 전반)와 고구려 요동
  hero: 당나라 황제. 40대 후반 남성, 짙은 수염, 당나라 황제 복식(노란 용포, 면류관 또는 검은 복두), 전장에서는 금빛 장식 갑옷과 붉은 망토. 앞 회차 고구려·신라 인물과 확실히 구별되는 당나라식 복식
  scenes:
    2: 645년 가을 요동. 비를 맞으며 진흙길을 따라 끝없이 물러나는 당나라 군대의 긴 행렬, 그 가운데 말 위에서 고개를 돌려 멀리 안개 속 산성을 돌아보는 황제의 뒷모습(금빛 갑옷, 붉은 망토). 깃발은 글자 없이 무늬만. 쓸쓸하고 무거운 분위기.
    3: 630년대 당나라 장안 궁궐의 넓은 조정. 문무백관이 양옆에 늘어선 가운데 높은 단 위 용상에 앉은 황제의 뒷모습(노란 용포, 면류관). 화려한 붉은 기둥과 금빛 장식, 밝은 햇살. 번영하는 제국의 분위기.
    3.5: 645년 봄 요하를 건너는 당나라 대군. 수많은 깃발(글자 없이 무늬만)과 기병, 강 위에 놓인 부교. 강가 언덕에서 말을 타고 대군을 지휘하는 황제의 뒷모습(금빛 갑옷, 붉은 망토). 웅장한 스케일.
    4: 645년 안시성. 산 위에 우뚝 선 고구려 산성과 성벽 위의 고구려 병사들, 성 아래 들판을 가득 메운 당나라 대군과 성벽 옆에 쌓아 올린 거대한 흙산. 성을 올려다보는 황제의 뒷모습(금빛 갑옷). 피는 그리지 않는다. 흐린 하늘이 화면 위쪽을 넓게 채운다.
    5: 40대 후반 당나라 황제의 정면 상반신. 노란 용포와 금빛 장식, 검은 복두 또는 면류관, 짙은 수염, 위엄과 회한이 함께 담긴 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 장안 궁궐의 지붕과 저녁 하늘.

caption: |
  "위징이 살아 있었다면 나를 말렸을 텐데…" 고구려에서 물러나며 이렇게 후회했다는 황제가 있어요. 중국 역사상 손꼽히는 명군, 당 태종 이세민 이야기예요.

  이세민은 아버지와 함께 당나라를 세운 뛰어난 장수였어요. 626년 현무문의 변으로 형과 아우를 꺾고 황제에 올랐고, 바른말 하는 신하 위징을 곁에 두고 나라를 잘 다스려 '정관의 치'라 불리는 시대를 열었습니다.

  그런 그도 고구려만큼은 넘지 못했어요. 645년 신하들의 반대를 무릅쓰고 직접 대군을 이끌고 고구려로 쳐들어와 요동성 등 여러 성을 빼앗았지만, 안시성에 가로막혔죠. 성 옆에 흙산까지 쌓으며 몇 달을 공격했지만 끝내 성은 무너지지 않았고, 군량이 떨어지고 겨울이 다가오자 결국 군대를 돌려야 했어요.

  돌아가는 길에 그는 2년 전 세상을 떠난 위징을 떠올리며 후회했다고 전해요. 그 뒤로도 고구려를 다시 치려 했지만, 649년 끝내 뜻을 이루지 못하고 세상을 떠났습니다. 그리고 그가 맺은 신라와의 동맹은 훗날 삼국의 운명을 바꾸게 돼요.

  천하를 얻고도 성 하나를 넘지 못한 황제, 여러분은 안시성 싸움을 어떻게 보시나요?

  * 1장의 후회 일화는 여러 자료에 전하는 이야기로 원전 문장은 확인하지 못했습니다. 2~5장 장면은 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 안시성 포위 기간은 자료에 따라 60여 일에서 석 달까지 다르게 전합니다.

