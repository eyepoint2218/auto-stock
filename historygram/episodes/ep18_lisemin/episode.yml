staging:
  - 645년 신하 반대 속 친정, 요동성 등 함락, 안시성에서 막혀 군량·겨울 때문에 퇴각, 649년 사망은 자료로 확인
  - 안시성 포위 기간은 60여 일~석 달로 자료마다 달라 숫자를 카드에 쓰지 않음, 각주에 밝힘
  - 위징이 살아 있었다면이라는 후회 일화는 여러 대중 자료에 실려 있으나 원전(구당서·자치통감) 문장 미확인 → 1장 전해지는 이야기 표기, 게시글 전해요로 표현
  - 626년 현무문의 변, 정관의 치는 널리 알려진 통설(이번 검색에서 직접 대조는 못 함)
  - 신라와의 동맹은 648년 김춘추와의 나당동맹(EP.06)
  - 2장 퇴각, 3장 조정, 3.5장 요하 도하, 4장 안시성 장면은 연출(피 없음)
  - 7장 얼굴은 상상화
