images:
  era: 고구려 7세기 초(612년 고구려·수 전쟁)
  hero: 고구려의 장수. 40~50대 남성, 짙은 수염, 날카롭고 침착한 인상. 고구려식 검은 비늘 갑옷과 철 투구(새 깃털 장식), 잿빛 은회색 망토. 거짓 항복 장면에서는 투구를 벗고 갑옷 위에 잿빛 겉옷. 앞 회차 고구려 인물(연개소문 붉은색·고건무 녹색·고연무 갈색·광개토대왕 자주색·장수왕 남색)과 구별
  scenes:
    2: 612년 여름 압록강. 강을 가득 메우며 건너오는 수나라 대군, 끝없이 이어진 병사와 말, 수많은 깃발(글자 없이 무늬만), 강 건너편 고구려의 산과 들. 높은 곳에서 내려다본 압도적인 규모. 흐린 하늘, 위협적인 분위기. 주인공은 나오지 않는다.
    3: 수나라 진영의 큰 막사 안. 화려한 갑옷의 수나라 장수들(얼굴은 그림자로 가림)이 앉아 있고, 그 앞에 투구를 벗고 홀로 서서 고개를 살짝 숙인 고구려 장수의 뒷모습(검은 비늘 갑옷, 잿빛 겉옷). 등불, 겉으로는 항복하지만 속으로는 적을 살피는 긴장된 분위기.
    3.5: 넓은 들판과 낮은 산. 먼지를 일으키며 달아나는 고구려 기병들과, 그 뒤를 쫓는 수나라 대군. 맨 앞에서 말을 몰며 뒤를 흘끗 돌아보는 고구려 장수의 뒷모습(얼굴은 보이지 않게, 잿빛 망토가 휘날림). 멀리 언덕 너머 평양성의 성벽. 피는 그리지 않는다.
    4: 612년 7월 살수(청천강). 강을 건너던 수나라 군대가 반쯤 건넜을 때, 강가 언덕에서 고구려 군대가 깃발(글자 없이 무늬만)을 들고 일제히 쏟아져 내려온다. 언덕 위에서 칼을 들어 공격을 명령하는 장수의 뒷모습(검은 비늘 갑옷, 잿빛 망토). 피와 시신은 그리지 않는다. 넓은 여름 하늘이 화면 위쪽을 넓게 채운다.
    5: 50대 고구려 장수의 정면 상반신. 새 깃털 장식 철 투구, 검은 비늘 갑옷 위 잿빛 망토, 짙은 수염, 지략이 느껴지는 날카롭고 침착한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 살수(강)와 산, 저녁 하늘.

caption: |
  30만 대군 가운데 살아 돌아간 병사는 2,700명뿐이었어요. 그 대군을 무너뜨린 사람은 고구려의 장수 을지문덕이었죠.

  612년 수나라 양제는 엄청난 군대를 이끌고 고구려를 쳐들어왔어요. 요동성이 버티며 길이 막히자, 우중문과 우문술이 이끄는 별동대 30만 5천 명이 곧장 평양으로 내려왔죠.

  을지문덕은 거짓으로 항복하고 홀로 적진에 들어가, 적군이 굶주리고 지쳐 있다는 것을 알아냈어요. 그리고 돌아와 싸울 때마다 일부러 져 주며 달아나, 적을 평양성 가까이까지 끌어들였어요. 이때 그는 우중문에게 시 한 수를 보냈어요. '그대의 신통한 계책은 하늘의 이치를 꿰뚫고, 기묘한 꾀는 땅의 이치를 다했노라. 싸워 이긴 공이 이미 높으니, 만족함을 알고 그만두기를 바라노라.'

  지친 수나라 군대가 물러나기 시작하자, 고구려군은 사방에서 공격했어요. 적이 살수(지금의 청천강)를 반쯤 건넜을 때 뒤에서 크게 들이쳤고, 『삼국사기』는 요동성까지 살아 돌아간 병사가 2,700명뿐이었다고 적고 있어요. 이 싸움이 바로 살수대첩이에요.

  싸우지 않고도 적을 지치게 만든 장수, 여러분은 을지문덕의 전략 중 무엇이 가장 놀라운가요?

  * 1장 내용은 『삼국사기』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 시는 우리말로 옮긴 것이며, 을지문덕의 출신과 생몰연도는 전하지 않습니다.

