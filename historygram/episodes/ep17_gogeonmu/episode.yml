images:
  era: 고구려 영양왕~영류왕 시대(7세기 전반)
  hero: 고구려의 왕자이자 왕(영류왕). 2번째 그림은 30대 장수, 나머지는 50~60대 왕. 고구려 고분벽화풍 복식(새 깃털 꽂은 관, 통 넓은 소매 겉옷), 전장에서는 고구려식 비늘 갑옷과 철 투구, 짙은 녹색 망토(연개소문의 붉은 망토와 대비). 왕이 된 뒤에는 금장식 관과 노란빛 비단 겉옷
  scenes:
    2: 640년 무렵 평양 궁궐의 정원. 연못가에 홀로 서서 하얀 비둘기를 날려 보내는 늙은 왕의 뒷모습(금장식 관, 노란빛 비단 겉옷). 멀리 궁궐 지붕 너머로 흐린 하늘에 먹구름이 몰려온다. 평온하지만 불안한 분위기.
    3: 612년 평양성 앞 대동강 하구. 강을 가득 메운 수나라 전함들과 상륙하는 군사들, 성 밖 숲에서 매복했다가 뛰쳐나가는 고구려 군대. 맨 앞에서 칼을 들고 돌격을 이끄는 장수의 뒷모습(비늘 갑옷, 철 투구, 짙은 녹색 망토). 깃발은 글자 없이 무늬만. 피는 그리지 않는다.
    3.5: 631년 무렵 요동 땅. 산과 들을 따라 끝없이 이어지며 쌓아 올리는 거대한 돌 성벽(천리장성), 돌을 나르는 백성과 병사들. 언덕 위에서 그 모습을 바라보는 왕의 뒷모습(금장식 관, 노란빛 겉옷 위 녹색 망토). 맑은 하늘.
    4: 642년 가을 평양 궁궐. 불길과 연기가 오르는 궁궐 마당, 붉은 망토를 두른 장수들이 칼을 들고 궁궐 계단을 올라간다(뒷모습, 얼굴은 보이지 않게). 계단 위 어좌 쪽에 홀로 남은 왕의 뒷모습 실루엣. 피나 시신은 그리지 않는다. 연기 낀 붉은 하늘이 화면 위쪽을 채운다.
    5: 60대 고구려 왕의 정면 상반신. 금장식과 새 깃털이 꽂힌 관, 노란빛 비단 겉옷 위 녹색 망토, 흰 섞인 수염, 온화하지만 지친 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 평양성과 대동강, 노을 진 하늘.

caption: |
  수나라 대군을 물리친 전쟁 영웅이, 왕이 되자 칼 대신 평화를 택했어요. 그리고 그 선택 때문에 목숨을 잃었죠. 고구려 영류왕, 고건무 이야기예요.

  612년, 수나라는 엄청난 대군으로 고구려를 쳐들어왔어요. 수나라 장수 내호아가 이끄는 수군이 대동강을 거슬러 평양성까지 밀려들었을 때, 성을 지키던 영양왕의 이복동생 고건무는 성 밖에 군사를 숨겨 두었다가 수나라 수군을 크게 무찔렀다고 해요. 같은 해 을지문덕의 살수대첩과 함께 고구려를 지켜 낸 싸움이었죠.

  618년 형 영양왕이 세상을 떠나자 고건무는 왕위에 올랐어요. 그는 새로 들어선 당나라와 화친하는 길을 택했습니다. 오랜 전쟁에 지친 나라를 쉬게 하려는 선택이었어요. 동시에 631년부터는 요동에 천리장성을 쌓아 혹시 모를 침략에 대비했어요.

  하지만 당나라와 맞서야 한다는 강경파의 불만은 커져 갔어요. 왕과 대신들은 강경파의 중심인 연개소문을 없애려 했지만 계획이 새어 나갔고, 642년 10월 연개소문은 정변을 일으켜 대신들과 영류왕을 죽였습니다.

  평화를 택한 왕과 전쟁을 택한 장군, 여러분은 누구의 길이 옳았다고 보시나요?

  * 2~5장 장면은 기록을 바탕으로 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 영류왕의 이름은 건무(建武)로, 드라마 등에서는 고건무로 불립니다. 생년은 전하지 않습니다.

