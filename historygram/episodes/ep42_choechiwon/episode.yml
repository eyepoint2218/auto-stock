images:
  era: 통일신라 말기 9세기 후반(868~900년대), 당나라와 신라
  hero: 신라의 학자이자 문장가. 10대 소년(첫 그림)부터 40대까지 나이가 드는 모습. 마르고 단정한 체격, 맑고 날카로운 눈매, 짧은 수염. 당나라에서는 연한 하늘색(옥색) 관복과 검은 복두, 신라에서는 같은 옥색 도포, 산에 들어간 뒤에는 흰 도포. 손에 붓이나 두루마리. 앞 회차 인물들과 구별되는 옥색
  scenes:
    2: 9세기 당나라 장수의 군막 안. 등불 아래 두루마리 편지를 펼쳐 읽던 갑옷 차림의 반란군 우두머리(얼굴은 그림자)가 깜짝 놀라 의자에서 미끄러지듯 몸을 뒤로 젖힌다. 바닥에 떨어지는 술잔. 주인공은 나오지 않는다. 극적이고 살짝 익살스러운 분위기. 피는 그리지 않는다.
    3: 868년 신라 바닷가 나루. 당나라로 떠나는 큰 배에 오르는 열두 살 소년의 뒷모습(옥색 도포, 작은 봇짐). 부두에서 배웅하는 아버지(얼굴은 그림자). 넓은 바다와 아침 햇살, 설렘과 긴장이 함께 있는 분위기.
    3.5: 881년 당나라 장수 고변의 군막. 등불 아래 낮은 책상 앞에 앉아 큰 두루마리에 힘차게 붓으로 글을 쓰는 젊은 문관의 손과 뒷모습(옥색 관복, 검은 복두). 뒤로 갑옷 입은 장수들과 지도(글자는 알아볼 수 없게). 긴박하지만 집중된 분위기.
    4: 894년 신라 경주 궁궐. 높은 왕좌에 앉은 여왕(화려한 신라 왕실 복식, 얼굴은 그림자로 가림) 앞에서 두 손으로 두루마리 상소를 올리는 문관의 뒷모습(옥색 도포). 양옆에 늘어선 진골 귀족들이 차갑게 지켜본다(얼굴은 반쯤 그림자). 화면 위쪽은 높은 궁궐 천장과 기둥으로 단순하게.
    5: 40대 신라 학자의 정면 상반신. 흰 도포, 단정한 상투와 짧은 수염, 맑지만 어딘가 쓸쓸한 눈빛, 한 손에 붓, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 가야산의 깊은 숲과 계곡, 안개, 저녁 하늘.

caption: |
  글 한 편을 읽은 반란군 우두머리가 깜짝 놀라 침상에서 떨어졌다는 이야기가 전해요. 그 글을 쓴 사람은 신라의 천재 문장가 최치원이에요.

  최치원은 857년 신라 경주에서 6두품 집안에 태어났어요. 진골이 아니면 높은 벼슬에 오르기 어려웠던 신라에서, 그는 열두 살에 당나라로 유학을 떠났어요. 그리고 874년 외국인을 위한 과거 시험인 빈공과에 붙어 당나라의 관리가 되었죠.

  당나라에 황소의 난이 일어나자 최치원은 장수 고변 밑에서 글을 맡았어요. 이때 쓴 토황소격문은 황소를 꾸짖는 글로, 당나라 전체에 그의 이름을 알렸어요. 당에서 쓴 글을 모은 『계원필경』은 지금도 남아 있는 우리나라에서 가장 오래된 개인 문집이에요.

  884년 당을 떠나 신라로 돌아온 최치원은 기울어 가는 나라를 바로 세우고 싶었어요. 894년 진성여왕에게 시무 10여 조를 올렸고, 여왕은 그를 6두품이 오를 수 있는 가장 높은 관등인 아찬으로 삼았어요. 하지만 진골 귀족들의 반대로 개혁은 이루어지지 못했어요. 그는 벼슬을 내려놓고 전국을 떠돌다 가야산 해인사에 들어가 지냈다고 전해요.

  재능은 넘쳤지만 신분의 벽을 넘지 못한 천재, 여러분은 최치원을 어떻게 보시나요?

  * 1장의 이야기는 후대에 전하는 일화이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 빈공과 급제 나이와 세상을 떠난 해는 자료에 따라 다르거나 전하지 않습니다.

