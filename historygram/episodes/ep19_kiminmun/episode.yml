staging:
  - 김춘추 둘째 아들·문무왕 친동생, 651년 23세 입당 숙위, 일곱 차례 왕래·22년 체류, 660년 소정방과 백제 정벌(부대총관), 668년 평양성 함락 참여, 674년 당 고종이 신라왕으로 세우려다 문무왕 사죄로 중단, 694년 당에서 사망은 자료로 확인
  - 첫 귀국 시점(653/656)은 기록이 달라 각주에 밝힘
  - 4장 문구 끝내 신라로 돌아가지 않았다는 674년 도중에 당으로 돌아간 일과 이후 당에서 생을 마친 것을 묶은 표현
  - 글·활쏘기·음악에 뛰어났다는 서술은 『삼국사기』 열전 내용으로 알려짐(원문 대조는 못 함) → 해요로 표현
  - 2장 책봉, 3장 사신선, 3.5장 상륙, 4장 바닷가 장면은 연출
  - 7장 얼굴은 상상화
