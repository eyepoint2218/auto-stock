images:
  era: 신라 태종무열왕~문무왕 시대와 당나라 장안(7세기 후반)
  hero: 신라 왕자이자 외교관. 30~60대 남성, 단정한 수염, 신라 귀족 관복에 당나라식 관복이 섞인 차림(짙은 남청색 관복, 당나라식 복두 또는 관모), 전장에서는 비늘 갑옷과 남청색 망토. 학자 같은 차분한 몸짓. 앞 회차 김춘추(자줏빛)·김유신(청색)과 구별
  scenes:
    2: 674년 당나라 장안 궁궐. 높은 단 위 용상에 앉은 당나라 황제(얼굴은 작게, 멀리)가 두 손으로 신라 왕관과 도장을 내리고, 그 아래 무릎 꿇은 신라 왕자의 뒷모습(남청색 관복). 양옆에 늘어선 당나라 관리들. 무겁고 긴장된 분위기.
    3: 650년대 서해를 건너는 사신선. 뱃전에 서서 멀리 수평선을 바라보는 젊은 신라 왕자의 뒷모습(남청색 관복, 관모, 바람에 날리는 소매). 거친 파도와 흐린 하늘, 멀리 희미한 육지. 깃발은 글자 없이 무늬만.
    3.5: 660년 백제 원정. 강 하구에 상륙하는 수많은 당나라 군선과 군대, 그 앞 언덕에서 당나라 장수(붉은 갑옷, 뒷모습)와 나란히 말을 탄 신라 왕자의 뒷모습(비늘 갑옷, 남청색 망토). 깃발은 글자 없이 무늬만. 피는 그리지 않는다.
    4: 674년 바닷가 언덕. 멀리 동쪽 바다 너머 신라 땅 쪽을 바라보며 홀로 선 중년 왕자의 뒷모습(남청색 관복). 그 뒤로 대기 중인 당나라 군선들. 해 질 녘 붉은 노을과 넓은 하늘이 화면 위쪽을 채운다. 쓸쓸하고 복잡한 분위기.
    5: 60대 신라 귀족 외교관의 정면 상반신. 남청색 관복과 복두, 흰 섞인 단정한 수염, 지적이고 쓸쓸한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 장안 궁궐 지붕과 서쪽으로 지는 해.

caption: |
  당나라 황제는 신라의 왕을 끌어내리고, 그 동생을 새 신라왕으로 세우려 했어요. 그 동생이 바로 문무왕의 친동생 김인문이에요.

  김인문은 김춘추의 둘째 아들로 태어났어요. 어려서부터 글과 활쏘기, 음악에 두루 뛰어났다고 해요. 651년 스물셋의 나이에 당나라로 건너가 황제를 곁에서 모시는 숙위가 되었고, 이후 일곱 차례나 당나라와 신라를 오가며 모두 22년을 당나라에서 지냈어요. 신라와 당을 잇는 가장 중요한 다리였던 셈이죠.

  660년에는 당나라 장수 소정방과 함께 군대를 이끌고 와 백제를 무너뜨렸고, 668년에는 고구려 평양성을 함락하는 싸움에도 나섰어요.

  그런데 삼국통일 뒤 신라가 당나라와 맞서자, 674년 당 고종은 문무왕의 관작을 빼앗고 당에 있던 김인문을 신라왕으로 세워 군대와 함께 돌려보내려 했어요. 형과 싸워야 할 처지가 된 거죠. 다행히 문무왕이 사신을 보내 사죄하면서 김인문은 도중에 돌아갔고, 694년 끝내 당나라에서 세상을 떠났습니다.

  두 나라 사이에 선 동생, 여러분이라면 어떤 선택을 하셨을까요?

  * 1장 내용은 『삼국사기』에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 처음 당나라에서 돌아온 시점은 『삼국사기』 열전(653년)과 본기(656년)가 다르게 전합니다.

