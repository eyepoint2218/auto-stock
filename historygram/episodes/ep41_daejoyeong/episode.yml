exam_keywords: [발해 건국(698년), 동모산, 천문령 전투, 진국(震國), 고구려 계승, 고왕]

images:
  era: 고구려 멸망 뒤 7세기 말~8세기 초(696~719년), 요서 영주와 만주 동모산
  hero: 고구려 유민 출신 장수이자 발해의 첫 왕. 30~40대(탈출)부터 50~60대까지. 짙은 수염, 다부진 체격, 고구려식 비늘 갑옷과 철 투구, 짙은 진홍빛 갈색(적갈색) 망토. 왕이 된 뒤에는 고구려풍 관과 적갈색 비단 겉옷. 앞 회차 고구려 인물(연개소문 붉은색·고연무 갈색·을지문덕 잿빛·보장왕 연청색)과 구별
  scenes:
    2: 698년 만주 동모산 기슭. 산 위에 새로 세운 흙과 나무의 산성, 그 아래 들판에 모여든 수많은 사람들(고구려 유민과 털옷 차림의 말갈 사람들)이 깃발(글자 없이 무늬만)을 들고 산성을 올려다본다. 주인공은 나오지 않는다. 맑은 하늘, 새 나라가 시작되는 벅찬 분위기.
    3: 696년 요서 영주 근처 거친 들판. 짐을 지고 수레를 끄는 고구려 유민들과 말갈 사람들의 긴 행렬이 동쪽 해 뜨는 쪽으로 걸어간다. 행렬 맨 앞에서 말을 타고 이끄는 장수의 뒷모습(비늘 갑옷, 적갈색 망토). 먼지 바람, 비장한 분위기.
    3.5: 깊은 산줄기 사이 좁은 고개(천문령). 산 위 숲에서 활과 창을 든 유민·말갈 군사들이 일제히 쏟아져 내려오고, 아래 계곡에 갇힌 당나라 군대(깃발 글자 없이). 고개 위 바위에 서서 칼을 들어 공격을 명령하는 장수의 뒷모습(적갈색 망토). 피는 그리지 않는다. 극적인 분위기.
    4: 698년 동모산 산성의 높은 망루 위. 고구려풍 관과 적갈색 비단 겉옷을 입은 왕의 뒷모습이 넓게 펼쳐진 만주 벌판과 강을 내려다본다. 아래 산성 안에는 새로 지은 집들과 사람들. 넓고 맑은 하늘이 화면 위쪽을 넓게 채운다.
    5: 50~60대 발해 첫 왕의 정면 상반신. 고구려풍 관, 적갈색 비단 겉옷, 짙은 수염에 흰 기운, 수많은 사람을 이끌어 온 단단하고 굳센 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 동모산 산성과 만주 벌판, 저녁 노을.

caption: |
  고구려가 무너진 지 30년, 당나라 땅으로 끌려갔던 고구려 유민들이 탈출을 시작했어요. 그들을 이끌고 새 나라를 세운 사람이 바로 대조영이에요.

  668년 고구려가 멸망하자 많은 고구려 사람들이 당나라의 영주(지금의 중국 랴오닝성 차오양)로 끌려갔어요. 대조영도 그중 하나였죠. 696년 영주에서 거란족 이진충이 반란을 일으키자, 대조영과 아버지 걸걸중상은 고구려 유민을 이끌고, 말갈의 걸사비우와 함께 동쪽으로 떠났어요.

  당나라는 군대를 보내 그들을 뒤쫓았어요. 그 과정에서 아버지와 걸사비우를 잃었지만, 대조영은 남은 무리를 하나로 모아 천문령에서 당군을 크게 무찔렀어요.

  698년 대조영은 동모산(지금의 중국 지린성 둔화 부근)에 나라를 세우고 국호를 진(震)이라 했어요. 713년 당나라가 그를 발해군왕으로 인정하면서 나라 이름은 발해로 자리 잡았어요. 발해는 고구려를 잇는 나라임을 내세우며, 훗날 '바다 동쪽의 융성한 나라'라는 뜻의 해동성국으로 불릴 만큼 크게 성장했어요.

  나라를 잃은 사람들에게 다시 나라를 만들어 준 사람, 여러분은 대조영을 어떻게 보시나요?

  * 1장 내용은 『구당서』·『신당서』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 건국 연도는 698년이 통설이며, 대조영의 출신(고구려인인지 말갈인인지)과 천문령 전투의 시점은 자료와 학자에 따라 다르게 봅니다.

