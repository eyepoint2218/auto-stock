images:
  era: 신라 진평왕~문무왕 시대(7세기)
  hero: 신라의 장군. 2번째 그림은 10대 소년 화랑, 3번째는 30대 장수, 나머지는 60대 노장군. 신라식 비늘 갑옷과 철 투구, 짙은 청색 망토(앞 회차 김춘추의 자줏빛과 구별), 평상시에는 신라 귀족 관복과 관모. 단단한 체격, 수염
  scenes:
    2: 610년 무렵 신라 서라벌 근교. 화랑 무리가 늘어선 넓은 마당, 그 끝에서 홀로 떨어져 서 있는 소년의 뒷모습(화랑 복식, 머리에 깃털 장식, 허리에 칼). 다른 귀족 자제들이 저만치 무리 지어 수군거린다. 흐린 하늘, 쓸쓸한 분위기.
    3: 610년 무렵 깊은 산속 석굴 앞. 새벽 안개 속에서 칼을 두 손으로 받쳐 들고 하늘을 우러러 서 있는 소년 화랑의 뒷모습. 뒤로 겹겹이 이어진 산봉우리와 떠오르는 햇빛. 경건하고 고요한 분위기.
    3.5: 629년 고구려 낭비성 앞 들판. 흙먼지 속에서 말을 몰아 적진으로 홀로 돌진하는 신라 장수의 뒷모습(비늘 갑옷, 철 투구, 짙은 청색 망토, 높이 든 칼). 앞쪽에 고구려 성벽과 깃발(글자 없이 무늬만), 뒤로 그를 따라 함성을 지르며 달려오는 신라 병사들. 피는 그리지 않는다.
    4: 660년 여름 황산벌이 내려다보이는 언덕. 수많은 신라군 깃발 사이에서 말 위에 앉아 들판 너머 백제군 진영을 바라보는 노장군의 뒷모습(비늘 갑옷, 짙은 청색 망토, 흰 머리가 투구 아래로 보인다). 들판을 가득 메운 신라 대군과 멀리 산자락의 백제 진영(깃발은 글자 없이 무늬만). 맑고 넓은 여름 하늘이 화면 위쪽을 넓게 채운다.
    5: 60대 신라 노장군의 정면 상반신. 비늘 갑옷 위 짙은 청색 망토, 흰머리와 흰 수염, 깊은 주름, 엄하지만 따뜻한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 경주 송화산 자락의 소나무 숲과 둥근 무덤(김유신묘), 저녁 햇빛.

caption: |
  멸망한 나라 왕족의 후손이 적국의 최고 장군이 될 수 있을까요? 금관가야 마지막 왕의 증손자, 김유신 이야기예요.

  532년 금관가야는 신라에 나라를 바쳤어요. 그 왕족은 신라 귀족이 되었지만, 오래된 신라 귀족들 사이에서 늘 낯선 사람이었죠. 595년, 그 집안에서 김유신이 태어났습니다.

  열다섯 살에 화랑이 된 그는 스스로를 갈고닦았고, 629년 고구려 낭비성 싸움에서 홀로 적진에 뛰어들어 신라군의 기세를 되살렸다고 전해요. 누이 문희를 김춘추와 혼인시켜 든든한 동지를 얻기도 했어요.

  김춘추가 외교로 길을 열면, 김유신은 칼로 그 길을 지켰어요. 660년 황산벌에서 계백의 결사대를 넘어 백제를 무너뜨렸고, 668년 고구려가 무너지자 문무왕은 그에게 신하로서는 가장 높은 자리인 태대각간을 내렸습니다. 그는 673년 세상을 떠났고, 훗날 흥무대왕으로 높여졌어요.

  가야의 후손에서 통일의 영웅으로, 여러분은 김유신의 어떤 모습이 가장 인상 깊으신가요?

  * 2~5장 장면은 기록을 바탕으로 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 1장의 '이방인'은 가야계 출신으로서의 처지를 풀어 쓴 표현입니다.

