staging:
  - 1장 "이방인"은 가야계(신김씨) 출신의 처지를 풀어 쓴 해석. 차별의 구체적 사례는 쓰지 않음
  - 2장 화랑 마당, 3장 석굴 수련, 3.5장 낭비성 돌격, 4장 황산벌 언덕 장면은 연출
  - 609년(15세) 화랑, 629년 낭비성 참전, 660년 백제 멸망, 668년 태대각간, 673년 사망, 흥무대왕 추봉은 자료로 확인
  - 낭비성에서 단신 돌격한 일은 『삼국사기』 김유신 열전에 전하는 내용으로 알려짐 → "전해요"
  - 668년 평양성 전투에 김유신이 직접 출전했는지는 확인 못 함(노령으로 서라벌에 남았다는 견해) → 4장 그림은 660년 황산벌로 하고 게시글에는 평양 출전을 쓰지 않음
  - 증조부 구형왕(구해왕)은 금관가야 마지막 왕
  - 7장 얼굴은 상상화
