staging:
  - 625~702 생몰, 당 종남산 지엄 문하에서 화엄 수학, 『화엄일승법계도』(210자 시를 도장 모양으로 배열), 676년 부석사 창건, 화엄종 개창, 관음 신앙, 문무왕의 성 쌓기를 글로 만류한 일은 자료로 확인
  - 성 쌓기 만류는 『삼국사기』 문무왕 21년(681) 기록. 글의 내용은 원문을 풀어 쓴 뜻으로 표현(직접 인용 아님)
  - 진정(군졸 출신)·지통(노비 출신) 제자는 『삼국유사』 전승을 따름
  - 낙산사 창건은 『삼국유사』 전승이라 전해요로 표현
  - 입당 시기 650년대 초(삼국유사)와 661년(백과사전) 차이 → 각주
  - 670년 무렵 당의 침공 계획을 알리러 귀국했다는 이야기는 흐름에서 벗어나 쓰지 않음
  - 선묘 설화(부석 전설)는 쓰지 않음
  - 2장은 주인공 없이 편지를 읽는 왕(얼굴 가림)
  - 3장 종남산, 3.5장 부석사 공사, 4장 제자 장면은 연출
  - 7장 얼굴은 상상화
