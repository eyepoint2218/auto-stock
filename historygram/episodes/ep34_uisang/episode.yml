exam_keywords: [화엄종, 『화엄일승법계도』, 부석사(676년), 관음 신앙(낙산사), 지엄, 일즉다 다즉일]

images:
  era: 신라 7세기(삼국 통일 전후, 650~702년)와 당나라
  hero: 신라의 승려. 30대(당 유학)부터 50~60대까지. 삭발한 머리, 단정하고 곧은 자세, 회색 승복 위 짙은 갈색 가사, 손에 염주. 앞 회차 원효(황갈색 삼베 승복, 표주박)와 구별되게 단정하고 정갈한 차림
  scenes:
    2: 681년 신라 경주 궁궐. 높은 기단 위 왕좌에 앉은 왕(얼굴은 그림자로 가림)이 두 손으로 펼친 편지를 읽고 있고, 신하가 그 앞에 엎드려 있다. 창밖 멀리 성벽 공사를 위해 쌓아 둔 돌무더기와 일손을 멈춘 백성들. 주인공(승려)은 이 그림에 나오지 않는다. 차분하고 생각에 잠긴 분위기.
    3: 7세기 당나라 종남산의 절. 안개 낀 깊은 산속 절의 마루에서 나이 든 스승 승려(얼굴은 그림자) 앞에 무릎 꿇고 가르침을 듣는 젊은 승려의 뒷모습(회색 승복, 갈색 가사). 펼쳐진 경전 두루마리(글자는 알아볼 수 없게). 고요하고 경건한 분위기.
    3.5: 676년 깊은 산 중턱. 큰 바위 아래 새로 짓고 있는 절의 나무 기둥과 기와 지붕, 목수와 승려들이 함께 일하는 모습. 공사장 위 돌계단에 서서 산과 골짜기를 내려다보는 승려의 뒷모습(회색 승복, 갈색 가사). 겹겹이 이어진 소백산 줄기, 맑은 가을 하늘.
    4: 신라 절 마당(부석사 느낌의 산사). 큰 나무 아래 둥글게 둘러앉은 다양한 제자들. 해진 옷의 젊은 병사 출신, 허름한 차림의 노비 출신, 귀족 차림의 청년이 섞여 있다. 그들 앞에 서서 가르치는 승려의 뒷모습(회색 승복, 갈색 가사, 염주). 따뜻한 햇살, 평등하고 온화한 분위기. 넓고 맑은 하늘과 산 능선이 화면 위쪽을 넓게 채운다.
    5: 60대 신라 승려의 정면 상반신. 삭발한 머리, 단정하고 맑은 얼굴, 회색 승복 위 짙은 갈색 가사, 손에 염주, 고요하고 깊은 눈빛과 엷은 미소, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 부석사 느낌의 산사 지붕과 겹겹이 이어진 소백산 능선, 저녁 노을.

caption: |
  왕이 쌓으려던 성을 한 승려가 글 한 통으로 멈춰 세웠어요. 그 승려는 신라 화엄종을 연 의상이었죠.

  의상은 원효와 함께 당나라 유학길에 나섰다가, 원효는 돌아가고 홀로 바다를 건넜어요. 당나라 종남산에서 스승 지엄에게 화엄 사상을 배웠고, 그 핵심을 210자의 시로 정리한 『화엄일승법계도』를 지었어요. 하나 속에 모든 것이 있고 모든 것이 곧 하나라는 가르침이에요.

  신라로 돌아온 의상은 676년 태백산 자락에 부석사를 세웠고, 이곳은 신라 화엄종의 중심이 되었어요. 그는 신분을 가리지 않고 제자를 받아, 가난한 군인 출신 진정과 노비 출신 지통도 그의 제자가 되었어요. 또 관세음보살을 믿으면 고통에서 벗어날 수 있다는 관음 신앙을 널리 알렸고, 동해 바닷가에 낙산사를 세웠다고 전해요.

  681년 문무왕이 서라벌에 새 성을 쌓으려 하자, 의상은 글을 올렸어요. 정치가 바르면 풀밭에 금만 그어도 백성이 넘지 않지만, 그렇지 않으면 아무리 높은 성도 소용없다는 뜻이었죠. 문무왕은 그 말을 듣고 공사를 멈췄어요.

  높은 성보다 바른 정치를 말한 승려, 여러분은 의상의 말을 어떻게 보시나요?

  * 1장 내용은 『삼국사기』 문무왕 21년 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 당나라로 건너간 해는 자료에 따라 650년대 초 또는 661년으로 다르게 전합니다.

