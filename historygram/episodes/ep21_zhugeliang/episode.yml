images:
  era: 중국 후한 말~삼국 시대(3세기 초)
  hero: 촉한의 재상. 20대 후반(첫 두 그림)부터 50대까지. 후한·삼국 시대 선비 복식(흰색·연회색 넓은 소매 도포, 머리에 두건(윤건)), 손에 깃털 부채. 재상이 된 뒤에는 짙은 녹색 관복과 관모. 3세기 후한 복식(명·청·일본풍 금지)
  scenes:
    2: 안개 낀 장강 위 밤. 짚단을 실은 배들이 강 위에 떠 있고 배에 화살이 잔뜩 꽂혀 있는 장면이 마치 무대 그림처럼 희미하게 사라지고 있다(연극 무대의 그림막처럼). 그 앞에 서서 사라지는 장면을 등지고 돌아선 선비의 뒷모습(흰 도포, 윤건, 깃털 부채). 몽환적이고 상징적인 분위기.
    3: 207년 겨울 융중의 초가. 눈 덮인 대숲과 작은 초가, 문 앞에서 두 손을 모으고 예를 갖춘 장군 일행(갑옷 차림, 뒷모습)이 서 있고, 초가 안 창가에 앉아 책을 펼친 젊은 선비의 뒷모습(흰 도포, 윤건). 고요한 겨울 분위기.
    3.5: 220년대 성도의 관청. 등불 아래 산더미 같은 죽간과 문서를 펼쳐 놓고 붓을 든 재상의 뒷모습(짙은 녹색 관복, 관모). 창밖으로 논밭과 수로가 펼쳐진 촉 땅. 늦은 밤까지 일하는 차분한 분위기.
    4: 234년 가을 오장원 진영. 밤하늘에 큰 별 하나가 떨어지고, 진영 막사 안 등불 아래 깃털 부채를 무릎에 내려놓고 앉은 늙은 재상의 뒷모습(흰 도포 위 짙은 녹색 겉옷). 막사 밖으로 늘어선 촉나라 군 진영과 깃발(글자 없이 무늬만). 쓸쓸하고 고요한 분위기. 밤하늘이 화면 위쪽을 넓게 채운다.
    5: 50대 촉한 재상의 정면 상반신. 윤건 또는 관모, 흰 도포 위 짙은 녹색 겉옷, 손에 깃털 부채, 다듬은 수염, 지적이고 지친 듯 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화·신선 같은 과장 금지). 뒤로 촉 땅의 산과 성도의 지붕, 저녁 하늘.

caption: |
  동남풍을 부르고 짚단 배로 화살 십만 개를 빌린 천재 군사 제갈량. 사실 이 장면들은 소설 『삼국지연의』가 만든 이야기예요. 그렇다면 진짜 제갈량은 어떤 사람이었을까요?

  제갈량은 난리를 피해 형주 융중에서 농사를 지으며 공부하던 선비였어요. 207년 유비가 세 번이나 찾아오자(삼고초려) 그를 따라나섰다고 정사 『삼국지』에 적혀 있어요.

  정사 속 제갈량의 진짜 힘은 '살림'에 있었어요. 221년 유비가 촉한을 세우자 재상이 되었고, 223년 유비가 세상을 떠난 뒤에는 어린 황제 유선을 대신해 나라를 이끌었어요. 셋 중 가장 작고 약한 나라의 법을 바로 세우고 백성을 다독여 나라를 버티게 했죠. 정사를 쓴 진수도 그를 뛰어난 정치가로 높이 평가했어요.

  그는 출사표를 올리고 여러 차례 북쪽 위나라로 나아갔어요. 234년 봄 다시 오장원에 진을 치고 사마의와 맞섰지만, 백여 일 만에 진중에서 병으로 세상을 떠났습니다. 쉰넷이었어요.

  소설 속 신선 같은 군사와 기록 속 성실한 재상, 여러분은 어느 쪽 제갈량이 더 멋지다고 생각하시나요?

  * 동남풍·화살 이야기는 『삼국지연의』의 창작이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 정사 기록에서 적벽 전투의 승패에는 조조군에 돈 전염병도 큰 역할을 했다고 나옵니다.

hashtags: [역사그램, 제갈량, 삼국지, 출사표, 정사삼국지]

# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
