staging:
  - 181~234 생몰, 221년 재상, 223년부터 섭정, 삼고초려가 정사 제갈량전에 기록, 출사표와 북벌, 234년 오장원에서 사마의와 대치 중 병사(54세), 진수가 정치가로 높이 평가는 자료로 확인
  - 화살 십만 개(연의 46회)와 동남풍은 연의의 창작으로 여러 자료가 지적
  - 적벽 패배에 조조군 역질이 기록된 점(정사 다섯 곳 중 네 곳)은 프레시안 기사로 확인
  - 진수의 '응변장략' 평가 원문과 뽕나무 800그루 일화는 확인 못 해서 쓰지 않음
  - 오장원 별똥별은 연의·전승의 이미지를 빌린 연출
  - 2장 사라지는 무대 그림(연의 상징), 3장 삼고초려, 3.5장 성도 관청, 4장 오장원 막사 장면은 연출
  - 7장 얼굴은 상상화
