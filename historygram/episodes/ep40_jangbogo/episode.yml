images:
  era: 통일신라 9세기 전반(810~846년), 당나라 산둥과 신라 서남해
  hero: 신라 출신 무장이자 바다의 상인. 20대(당나라 군인)부터 50대까지. 햇볕에 그을린 얼굴, 다부진 체격, 짧은 수염. 당나라 군인 시절에는 당식 갑옷과 붉은 띠, 청해진에서는 짙은 바다색(청록 남색) 겉옷 위 가죽 갑옷, 허리에 칼. 앞 회차 인물들과 구별되는 청록 남색
  scenes:
    2: 9세기 초 서해 바다 위. 해적선이 신라 어선을 덮쳐 사람들을 밧줄로 묶어 끌고 가는 장면(멀리서, 얼굴은 작게). 파도가 높고 하늘은 어둡다. 주인공은 나오지 않는다. 피는 그리지 않는다. 안타깝고 무거운 분위기.
    3: 820년 무렵 당나라 군영의 연병장. 당식 갑옷을 입은 병사들이 줄지어 서 있고, 그 앞에 서서 창을 들고 병사들을 지휘하는 젊은 장교의 뒷모습(당식 갑옷, 붉은 띠). 뒤로 당나라 성곽과 깃발(글자 없이 무늬만). 맑은 하늘, 씩씩한 분위기.
    3.5: 828년 완도 장도 앞바다. 바다 위 작은 섬에 새로 쌓은 나무 목책과 토성, 줄지어 정박한 신라 군선들. 섬 언덕 위에 서서 바다를 바라보는 장수의 뒷모습(청록 남색 겉옷, 가죽 갑옷, 칼). 멀리 달아나는 해적선. 맑게 갠 하늘과 푸른 바다.
    4: 9세기 청해진 항구. 커다란 돛을 단 무역선들이 드나들고, 부두에 도자기 상자, 비단, 차, 향료 꾸러미가 쌓여 있다. 신라·당·일본 상인들이 어울려 흥정한다(옷차림으로만 구별). 높은 망루 위에서 항구를 내려다보는 주인공의 뒷모습(청록 남색 겉옷). 넓은 바다와 맑은 하늘이 화면 위쪽을 넓게 채운다.
    5: 50대 신라 해상왕의 정면 상반신. 햇볕에 그을린 얼굴, 짧은 수염, 청록 남색 겉옷 위 가죽 갑옷, 바다를 오래 본 듯 깊고 당당한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 청해진의 목책과 돛단배들이 떠 있는 바다, 저녁 노을.

caption: |
  신라 사람들이 해적에게 붙잡혀 노비로 팔려 가던 시절이 있었어요. 그 바다를 되찾은 사람이 바로 해상왕 장보고예요.

  장보고는 신라의 섬에서 태어난 평민 출신이었어요. 젊은 시절 친구 정년과 함께 당나라로 건너가 무령군의 군인이 되었고, 실력을 인정받아 소장이라는 장교 자리에 올랐어요. 그곳에서 그는 당나라 해적에게 끌려와 노비로 팔리는 신라 사람들을 보게 되었어요.

  828년 신라로 돌아온 장보고는 흥덕왕에게 해적을 막겠다고 청했어요. 왕은 그를 청해진대사로 삼고 1만 명의 군사를 맡겼죠. 그는 지금의 완도에 청해진을 세우고 바다의 해적을 몰아냈어요.

  해적이 사라진 바다에서 장보고는 신라와 당, 일본을 잇는 무역을 이끌었어요. 당나라 산둥반도 적산에는 법화원이라는 절을 세워 그곳의 신라 사람들을 모았고, 일본 승려 엔닌은 일기에 장보고의 도움을 받은 이야기를 남겼어요. 훗날 그는 신무왕이 왕위에 오르는 데도 큰 힘을 보탰지만, 846년 염장에게 목숨을 잃었어요.

  노비로 팔려 가던 바다를 무역의 바다로 바꾼 사람, 여러분은 장보고를 어떻게 보시나요?

  * 1장 내용은 『삼국사기』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 장보고가 세상을 떠난 해는 『삼국사기』에 846년, 일본 기록에 841년으로 다르게 전합니다.

