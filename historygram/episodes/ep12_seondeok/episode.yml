# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [선덕여왕, 최초의 여왕, 첨성대, 황룡사 9층 목탑, 비담의 난, 자장, 아비지, 김춘추, 김유신, 진덕여왕, 신라, 드라마 문무]

sources:
  - itwiki 선덕여왕 항목
  - 매일신문, 선덕여왕·황룡사 관련 기사(2023-04-20, 2023-05-03)
  - 경북매일, 선덕여왕 관련 기사
  - 경주시 웹진, 선덕여왕 관련 글
