images:
  era: 신라 선덕여왕 시대(7세기 전반)
  hero: 신라의 여왕. 40~50대 여성, 단정히 올린 머리에 금관(나뭇가지·사슴뿔 모양 장식이 있는 신라 금관 느낌), 붉은 계열의 신라 왕실 여성 복식(긴 저고리, 넓은 소매, 어깨에 두른 숄), 기품 있고 단단한 자세
  scenes:
    2: 647년 정월 밤 신라 서라벌. 명활성 쪽 언덕에 횃불을 든 반란군이 모여 있고, 그 너머 하늘에 큰 별똥별이 떨어진다. 궁궐 누각 위에서 그 모습을 내려다보는 여왕의 뒷모습(금관, 붉은 왕실 복식). 긴장된 밤. 깃발은 글자 없이 무늬만.
    3: 632년 신라 월성 궁궐 대전. 신하들이 양옆에 늘어서 고개를 숙인 가운데, 붉은 융단을 따라 어좌로 걸어 올라가는 여왕의 뒷모습(금관, 끌리는 붉은 비단 옷자락). 창으로 들어오는 아침 햇빛, 장엄하고 조용한 분위기.
    3.5: 645년 무렵 서라벌의 맑은 날. 완공된 거대한 황룡사 9층 목탑과 그 앞 넓은 마당, 멀리 들판에 돌로 쌓은 첨성대. 탑을 올려다보는 여왕의 뒷모습과 그 곁의 승려(자장), 장인들과 백성들. 밝고 웅장한 분위기.
    4: 640년대 신라 궁궐 정원. 연못가 정자에 앉은 여왕의 뒷모습, 그 앞에 예를 갖춰 선 두 신하(자줏빛 관복의 귀족, 짙은 청색 망토의 장군)의 뒷모습이나 옆 실루엣. 맑고 넓은 가을 하늘이 화면 위쪽을 넓게 채운다.
    5: 40~50대 신라 여왕의 정면 상반신. 신라 금관 느낌의 관, 붉은 왕실 복식과 숄, 지혜롭고 단단하며 온화한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화된 미인형 금지). 뒤로 첨성대와 경주 들판, 별이 뜨기 시작하는 저녁 하늘.

caption: |
  "여자 임금은 나라를 잘 다스릴 수 없다!" 647년, 신라의 귀족 비담은 이렇게 외치며 반란을 일으켰어요. 그 말을 들어야 했던 왕은 한국사 최초의 여왕, 선덕여왕이었어요.

  632년, 진평왕이 아들 없이 세상을 떠나자 맏딸 덕만이 왕위에 올랐어요. 성골 남자가 없었기 때문이었죠. 여왕을 바라보는 눈길은 곱지 않았고, 이웃 나라들의 공격도 거셌습니다.

  그녀는 별을 관측하는 첨성대를 세웠다고 전해지고, 승려 자장의 건의로 황룡사에 아홉 나라를 누른다는 뜻을 담은 9층 목탑을 세웠어요. 백제 장인 아비지까지 불러 지은, 당시 동아시아에서 손꼽히는 높이의 탑이었죠.

  무엇보다 그녀는 사람을 알아봤어요. 김춘추와 김유신을 곁에 두고 힘을 실어 주었고, 두 사람은 훗날 삼국통일을 이끌었습니다. 비담의 난이 진압되던 무렵인 647년, 선덕여왕은 세상을 떠났어요.

  최초의 여왕이 견뎌야 했던 시선, 여러분은 어떻게 느껴지시나요?

  * 1장 반란군의 말은 『삼국사기』에 전하는 기록이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 첨성대를 선덕여왕 때 세웠다는 것은 『삼국유사』 등에 전하는 내용입니다.

