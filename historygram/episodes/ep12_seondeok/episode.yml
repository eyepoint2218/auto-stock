staging:
  - 1장 비담의 구호(여주불능선리)는 『삼국사기』 기록으로 알려짐, 따옴표 대사는 그 뜻을 우리말로 옮긴 것
  - 632년 즉위·최초의 여왕, 647년 비담의 난과 사망, 황룡사 9층 목탑(자장 건의, 아비지)은 자료로 확인. 목탑 완공 연도는 643~645년으로 자료마다 차이 → 연도 생략
  - 첨성대 축조 시기는 전승(『삼국유사』) → "세웠다고 전해지고"
  - 모란꽃 일화·지기삼사는 확인 못 해서 쓰지 않음
  - 4장 "삼국통일의 기틀"은 해석(김춘추·김유신을 등용한 시기라는 통설)
  - 2장 반란 밤, 3장 즉위, 3.5장 목탑, 4장 정원 장면은 연출
  - 생년 미상
  - 7장 얼굴은 상상화
