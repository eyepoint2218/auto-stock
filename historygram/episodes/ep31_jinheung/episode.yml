images:
  era: 신라 6세기(540~576년)
  hero: 신라의 왕. 10대 후반(첫 그림)부터 40대까지 나이가 드는 모습. 6세기 신라 복식(나뭇가지 모양 장식과 곱은옥이 달린 신라 금관, 통 넓은 소매), 상아빛 흰 비단 겉옷과 금 허리띠, 전장에서는 은빛 비늘 갑옷과 흰 망토. 앞 회차 신라 인물(김춘추 자줏빛·김유신 청색·김품석 청록·비담 검붉은색·김인문 남청색)과 구별
  scenes:
    2: 6세기 신라 궁궐(경주 월성) 안. 등불 아래 넓은 탁자에 펼친 큰 지도 위로, 굽이쳐 흐르는 큰 강을 손가락으로 짚는 젊은 왕의 손과 뒷모습(상아빛 흰 겉옷, 신라 금관). 지도에는 산과 강만 있고 글자는 없다. 탁자 건너편 신하들은 그림자로만. 고민 끝에 결심하는 긴장된 분위기.
    3: 551년 한강 상류의 깊은 산과 계곡. 굽이도는 강을 따라 줄지어 나아가는 신라 군대와 깃발(글자 없이 무늬만). 산 고개 위에서 말을 타고 강을 내려다보는 젊은 왕의 뒷모습(은빛 비늘 갑옷, 흰 망토). 맑은 초여름 하늘. 피는 그리지 않는다.
    3.5: 553년 한강 하류의 넓은 강과 강가의 토성. 성벽 위에 새로 꽂히는 신라 깃발(글자 없이 무늬만), 강가에 늘어선 신라 병사들, 멀리 넓은 평야와 바다 쪽 하늘. 성벽 위에서 강을 내려다보는 왕의 뒷모습(흰 망토). 피는 그리지 않는다. 주인공 얼굴은 보이지 않게.
    4: 높은 바위산 꼭대기(북한산 비봉 느낌). 새로 세운 키 큰 돌비석(글자는 알아볼 수 없게 흐릿하게) 옆에 서서 발아래 굽이치는 큰 강과 산들을 내려다보는 왕의 뒷모습(상아빛 흰 겉옷, 흰 망토, 신라 금관). 곁에 신하 몇 명. 끝없이 펼쳐진 산줄기와 넓고 맑은 하늘이 화면 위쪽을 넓게 채운다.
    5: 40대 신라 왕의 정면 상반신. 나뭇가지 모양 장식과 곱은옥이 달린 신라 금관, 상아빛 흰 비단 겉옷과 금 허리띠, 짧은 수염, 넓은 땅을 품은 듯 담대하고 차분한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 굽이치는 한강과 산, 저녁 노을.

caption: |
  함께 고구려를 친 지 2년 만에, 신라는 백제의 등을 쳤어요. 그 결정을 내린 사람은 신라의 진흥왕이었죠.

  진흥왕은 540년 어린 나이에 왕위에 올라 처음에는 어머니가 나라를 대신 돌봤어요. 직접 나라를 다스리게 된 그는 551년 '개국'이라는 연호를 쓰고, 백제와 손잡고 고구려를 공격해 한강 상류 지역을 차지했어요.

  그런데 553년, 진흥왕은 백제가 되찾은 한강 하류까지 빼앗고 그곳에 신주를 두었어요. 화가 난 백제 성왕은 이듬해 군대를 이끌고 쳐들어왔지만, 관산성 전투에서 오히려 목숨을 잃었죠. 한강을 얻은 신라는 서해를 건너 중국과 직접 오갈 길을 열었어요.

  진흥왕은 562년 대가야를 정복했고, 동북쪽으로는 지금의 함경도까지 나아갔어요. 넓힌 땅을 직접 돌아보며 세운 북한산비, 창녕비, 황초령비, 마운령비가 지금도 남아 있어요. 또 화랑도를 나라의 인재를 기르는 조직으로 정비하고, 거칠부에게 역사책 『국사』를 쓰게 했어요.

  약속보다 나라의 앞날을 택한 왕, 여러분은 진흥왕의 선택을 어떻게 보시나요?

  * 1장 내용은 『삼국사기』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 즉위 나이는 『삼국사기』에 7세, 『삼국유사』에 15세로 다르게 전합니다. 한강 하류를 차지한 경위(고구려와의 밀약 여부)는 학계 해석이 엇갈립니다.

hashtags: [역사그램, 진흥왕, 신라, 한국사, 한능검]

