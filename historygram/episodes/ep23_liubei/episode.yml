images:
  era: 중국 후한 말~삼국 시대(2세기 말~3세기 초)
  hero: 촉한의 건국자. 첫 그림은 10대 소년, 이후 30~60대 남성. 귀가 크고 팔이 긴 편, 단정한 수염. 소년 시절에는 거친 베옷, 이후 후한식 찰갑과 붉은 망토, 황제가 된 뒤에는 검은 면류관과 검은·붉은 황제 예복. 3세기 후한 복식(명·청·일본풍 금지)
  scenes:
    2: 170년대 탁현의 가난한 시골집 마당. 커다란 뽕나무 아래에서 어머니(뒷모습)와 나란히 앉아 짚신과 자리를 엮는 소년의 뒷모습(거친 베옷). 쌓여 있는 짚단, 소박한 초가. 저녁 햇살, 따뜻하지만 가난한 분위기.
    3: 184년 무렵 황건적의 난이 일어난 들판. 마을 청년들과 의병들이 모여든 가운데, 칼을 차고 맨 앞에 선 젊은 장수의 뒷모습(소박한 갑옷, 붉은 망토). 그 곁에 수염이 긴 녹색 옷의 장수와 검은 갑옷의 장수(뒷모습). 깃발은 글자 없이 무늬만. 결의에 찬 분위기.
    3.5: 208년 무렵 피난길. 비가 내리는 진흙길을 따라 수많은 백성들이 짐을 지고 걸어가고, 말에서 내려 백성들과 함께 걸으며 노인을 부축하는 장수의 뒷모습(낡은 붉은 망토, 찰갑). 깃발은 글자 없이 무늬만. 고단하지만 따뜻한 분위기.
    4: 221년 성도. 높은 제단 위에 서서 하늘을 향해 의식을 올리는 황제의 뒷모습(검은 면류관, 검은·붉은 예복). 제단 아래 늘어선 신하들과 깃발(글자 없이 무늬만). 맑고 넓은 하늘이 화면 위쪽을 넓게 채운다. 장엄한 분위기.
    5: 60대 촉한 황제의 정면 상반신. 검은 면류관 또는 관, 검은·붉은 황제 예복, 큰 귀, 단정한 수염, 온화하지만 지친 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 장강 절벽 위 백제성과 저녁 노을.

caption: |
  어머니와 함께 짚신과 자리를 엮어 팔던 소년이 있었어요. 그 소년은 훗날 황제가 되었죠. 삼국지의 유비 이야기예요.

  유비는 한나라 황실의 먼 후손이었지만, 집안은 이미 몰락해 있었어요. 정사 『삼국지』에는 그가 어려서 아버지를 잃고 어머니와 함께 짚신과 자리를 엮어 생계를 꾸렸다고 적혀 있어요.

  184년 황건적의 난이 일어나자 유비는 의병을 일으켰어요. 관우, 장비와 형제처럼 가까웠다는 기록은 있지만, 복숭아밭에서 의형제를 맺은 '도원결의'는 소설 『삼국지연의』가 만든 장면이에요. 그 뒤 유비는 수없이 지고 이곳저곳을 떠돌았지만, 사람을 아끼는 모습으로 많은 인재와 백성의 마음을 얻었어요. 제갈량을 세 번 찾아간 것도 그였죠.

  마침내 그는 촉 땅을 차지했고, 221년 한나라를 잇는다며 황제의 자리에 올랐어요. 하지만 관우의 원수를 갚겠다며 나선 이릉 전투에서 오나라 육손에게 크게 졌고, 223년 백제성에서 아들을 제갈량에게 맡기고 세상을 떠났습니다.

  짚신 장수에서 황제까지, 여러분은 유비의 어떤 점이 가장 인상 깊으신가요?

  * 도원결의는 『삼국지연의』의 창작이며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 유비의 생년은 161년 설이 일반적이며 162년 설도 있습니다.

hashtags: [역사그램, 유비, 삼국지, 촉한, 정사삼국지]

# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
search_keywords: [유비, 유현덕, 삼국지, 정사 삼국지, 삼국지연의, 도원결의, 짚신, 촉한, 관우, 장비, 제갈량, 이릉 전투, 백제성]

sources:
  - Wikipedia, "Liu Bei", "Battle of Xiaoting", "Shu Han"
  - Britannica, "Liu Bei"
  - 프레시안, 삼국지 정사와 연의 비교 연재
  - 브런치, 유비 관련 글
  - 진수, 정사 『삼국지』 촉서 선주전(원문 직접 대조는 못 함)

staging:
  - 161(또는 162)~223 생몰, 중산정왕 유승의 후손이나 몰락, 짚신과 자리를 엮어 생계(선주전), 221년 황제 즉위, 221~222년 이릉 전투 패배(육손), 223년 백제성에서 사망하며 제갈량에게 유선을 맡김은 자료로 확인
  - 도원결의는 정사에 없고 연의의 창작, 관우전의 형제처럼 아꼈다는 기록이 출발점일 가능성(프레시안)
  - 184년 의병 기병은 황건적의 난 시기 통설
  - 피난길에 백성과 함께한 장면(3.5장)은 208년 당양 피난을 빌린 연출
  - 백제성 유언의 정확한 문구(군가자취)는 해석이 갈려 카드·게시글에 인용하지 않음
  - 2장 짚신, 3장 의병, 3.5장 피난길, 4장 즉위 장면은 연출
  - 7장 얼굴은 상상화
