  - 칠지도는 이소노카미 신궁 소장, 하사·헌상 여부와 명문 해석이 엇갈려 게시글에 알려져 있어요로 표현
  - 요서·산둥 진출설은 논쟁이 커서 본문에 쓰지 않고 각주에만 밝힘
  - 4세기 백제 왕의 복식은 자료가 적어 후대 금제관식을 참고한 재구성
  - 2장 한성, 3장 마한, 3.5장 평양성, 4장 항구 장면은 연출
  - 7장 얼굴은 상상화
