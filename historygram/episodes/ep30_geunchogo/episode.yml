images:
  era: 백제 4세기(346~375년), 한성 백제
  hero: 백제의 왕. 40대(첫 그림)부터 60대까지 나이가 드는 모습. 4세기 백제풍 복식을 재구성(검은 비단 관에 금꽃 장식, 통 넓은 소매), 짙은 황토빛 금색 비단 겉옷과 검은 띠, 전장에서는 청동빛 비늘 갑옷과 황토빛 금색 망토. 앞 회차 백제 인물(계백 붉은색·윤충 남색·의자왕 붉은 옷·성충 보라색)과 구별
  scenes:
    2: 4세기 한강가의 한성(풍납토성). 흙으로 높이 쌓은 성벽과 기와 지붕의 궁궐, 강 위에 떠 있는 돛단배들. 궁궐 누각 위에 서서 넓은 한강과 들판을 내려다보는 왕의 뒷모습(검은 비단 관, 황토빛 금색 겉옷). 맑은 아침, 큰 꿈을 품은 분위기.
    3: 369년 남쪽 마한 땅(지금의 전라도)의 너른 평야와 낮은 언덕. 백제 군대의 깃발(글자 없이 무늬만)과 행렬이 마을로 들어서고, 마을 사람들이 길가에 모여 바라본다. 말을 탄 왕의 뒷모습(청동빛 비늘 갑옷, 황토빛 금색 망토). 황금빛 들판, 싸움이 끝난 평온한 분위기. 피는 그리지 않는다.
    3.5: 371년 겨울 고구려 평양성. 눈 덮인 들판 너머 높은 돌 성벽, 성을 향해 진격하는 백제 군대와 날아가는 화살들. 맨 앞에서 말을 타고 칼을 든 왕의 뒷모습(황토빛 금색 망토)과 그 곁의 젊은 장수(태자) 뒷모습. 회색 겨울 하늘, 긴박한 분위기. 피와 시신은 그리지 않는다.
    4: 4세기 백제 바닷가 항구. 큰 돛을 단 배들이 바다로 떠날 준비를 하고, 사신이 두 손으로 받쳐 든 상자 안에 가지가 일곱 개 달린 칼(글자는 보이지 않게)이 놓여 있다. 부두에 서서 배들을 바라보는 나이 든 왕의 뒷모습(황토빛 금색 겉옷). 넓은 바다와 맑은 하늘이 화면 위쪽을 넓게 채운다.
    5: 60대 백제 왕의 정면 상반신. 검은 비단 관에 금꽃 장식, 황토빛 금색 비단 겉옷, 희끗한 수염, 단단하고 자신감 있는 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 한강과 한성의 흙 성벽, 저녁 노을.

caption: |
  371년, 백제 군대가 평양성에서 고구려 왕을 쓰러뜨렸어요. 그 군대를 이끈 사람은 백제의 전성기를 연 근초고왕이었죠.

  근초고왕은 백제 제13대 왕으로, 346년 왕위에 올라 375년까지 나라를 다스렸어요. 이 무렵부터 왕위를 아들에게 물려주는 부자 상속이 자리 잡아, 왕의 힘이 한층 강해졌어요.

  369년 그는 남쪽의 마한 세력을 아울러 지금의 전라도 일대까지 땅을 넓혔어요. 같은 해 고구려 고국원왕이 쳐들어오자 치양에서 물리쳤고, 371년에는 태자(훗날 근구수왕)와 함께 정예군 3만을 이끌고 평양성을 공격했어요. 이 싸움에서 고국원왕이 화살에 맞아 세상을 떠났고, 백제는 지금의 황해도 일대까지 차지했죠.

  근초고왕은 바다 건너 중국 동진에 사신을 보내고, 왜와도 활발히 교류했어요. 일본 이소노카미 신궁에 전하는 칠지도는 이 무렵 백제가 왜왕에게 보낸 칼로 알려져 있어요. 또 박사 고흥에게 백제의 역사책 『서기』를 쓰게 했지만, 아쉽게도 지금은 전하지 않아요.

  안으로는 왕권을 다지고 밖으로는 바다를 연 왕, 여러분은 근초고왕의 어떤 업적이 가장 대단하다고 생각하시나요?

  * 1장 내용은 『삼국사기』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 태어난 해는 전하지 않으며, 칠지도의 성격과 명문 해석, 요서 진출설은 학계에서 의견이 엇갈립니다.

hashtags: [역사그램, 근초고왕, 백제, 한국사, 한능검]

# 게시글 끝에 한 줄로 붙는 검색 노출 키워드(해시태그 아님)
