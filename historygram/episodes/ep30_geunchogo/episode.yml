  - 346년 즉위·375년 사망, 비류왕의 둘째 아들, 부자 상속 정착, 369년 마한 잔여 세력 병합, 369년 치양에서 고구려군 격퇴, 371년 태자와 정병 3만으로 평양성 공격·고국원왕 전사, 372년 동진에 사신, 박사 고흥의 『서기』 편찬은 자료로 확인
  - 고국원왕은 날아온 화살에 맞아 죽었다고 전해 1장은 쓰러뜨렸어요로 표현
