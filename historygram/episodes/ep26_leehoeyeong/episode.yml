images:
  era: 대한제국 말~일제강점기(1900~1930년대)
  hero: 독립운동가. 40~60대 남성, 마른 체격, 단정한 콧수염, 둥근 안경(나이 들어서). 처음에는 흰 두루마기와 갓, 망명 뒤에는 짙은 회색 두루마기나 검은 양복 위 두루마기, 겨울에는 털모자. 1910~1930년대 한국인 복식
  scenes:
    2: 1910년 서울 명동의 큰 한옥 대문 앞. 대대로 내려온 넓은 기와집과 행랑채, 마당에 짐을 꾸리는 하인들과 쌓인 짐 보따리. 대문을 등지고 집을 마지막으로 돌아보는 흰 두루마기 차림 선비의 뒷모습(갓). 늦가을 쓸쓸한 분위기.
    3: 1910년 12월 꽁꽁 언 압록강. 눈보라 속에서 짐을 실은 썰매와 소달구지, 아이를 업은 여인들과 노인들이 줄지어 얼음 위를 건너간다. 맨 앞에서 일행을 이끄는 두루마기 차림 남성의 뒷모습(털모자). 고단하지만 결연한 분위기.
    3.5: 1911년 만주 서간도 삼원보의 너른 벌판. 흙벽과 초가로 지은 소박한 학교 건물, 운동장에서 목총을 들고 훈련하는 한복 차림 청년들. 학교 마당에 서서 그들을 지켜보는 회색 두루마기 차림 남성의 뒷모습. 맑고 차가운 하늘.
    4: 1920년 무렵 만주의 산과 들. 소총을 메고 줄지어 행군하는 독립군 행렬(군복과 각반, 모자), 깃발은 글자 없이 무늬만. 언덕 위에서 그 행렬을 바라보는 나이 든 남성의 뒷모습(검은 두루마기, 둥근 안경을 쓴 옆모습은 보이지 않게). 넓은 하늘이 화면 위쪽을 넓게 채운다.
    5: 60대 독립운동가의 정면 상반신. 둥근 안경, 단정한 흰 콧수염, 짙은 회색 두루마기, 마르고 꼿꼿한 자세, 맑고 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 만주 벌판과 저녁 하늘.

caption: |
  나라를 잃자 여섯 형제는 모든 재산을 팔았어요. 그리고 독립군을 길러 낼 학교를 세웠죠. 우당 이회영 이야기예요.

  이회영의 집안은 대대로 높은 벼슬을 지낸 조선 최고의 명문가였어요. 1910년 나라가 일본에 넘어가자, 이회영과 여섯 형제는 서울 명동 일대의 땅과 집을 비롯한 전 재산을 처분했어요. 그리고 그해 겨울, 일가 50여 명이 꽁꽁 언 압록강을 건너 만주 서간도로 떠났습니다.

  1911년 이들은 이상룡 등과 함께 서간도에 신흥강습소를 세웠어요. 이 학교가 바로 신흥무관학교예요. 이곳에서 길러진 졸업생은 3,500명에 이르렀다고 전하는데, 이들은 훗날 청산리 전투 등 독립전쟁의 중심이 되었어요.

  그러나 그 대가는 컸어요. 형제들은 모진 가난 속에 하나둘 세상을 떠났고, 이회영도 1932년 일본 경찰에 붙잡혀 뤼순 감옥에서 고문 끝에 순국했어요. 여섯 형제 가운데 살아서 해방된 조국 땅을 밟은 사람은 다섯째 이시영뿐이었습니다.

  가진 모든 것을 내려놓은 선택, 여러분이라면 어떻게 하셨을까요?

  * 2~5장 장면은 재구성한 연출이며, 7장의 얼굴은 상상화입니다. 신흥무관학교 졸업생 수는 자료에 따라 다르게 전합니다.

