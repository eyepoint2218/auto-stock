staging:
  - 1910년 경술국치 후 6형제 전 재산 처분, 일가 50여 명 서간도 망명, 1911년 이상룡 등과 신흥강습소(신흥무관학교) 설립, 1932년 11월 17일 뤼순 감옥 순국, 6형제 중 이시영만 해방을 맞음은 자료로 확인
  - 3,500명은 독립군 수가 아니라 졸업생 수로 여러 기사에 나옴 → 졸업생으로 쓰고 각주에 밝힘
  - 1932년 체포 장소(대련)는 이번 검색에서 확인 못 해서 일본 경찰에 붙잡혀로만 씀
  - 압록강을 건넌 시기는 1910년 12월 무렵 통설
  - 청산리 전투에 신흥무관학교 출신이 중심이 되었다는 것은 통설(직접 대조는 못 함)
  - 2장 명동 한옥, 3장 압록강, 3.5장 학교, 4장 독립군 행렬 장면은 연출
  - 7장 얼굴은 상상화(실제 사진은 남아 있음)
