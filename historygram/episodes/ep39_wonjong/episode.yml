images:
  era: 고려 13세기 후반(1259~1274년), 몽골 제국과 강화도·개경
  hero: 고려의 왕. 40대(태자 시절)부터 50대까지. 단정한 수염, 차분하고 신중한 인상. 태자 시절에는 붉은 자홍색 비단 포와 검은 관, 먼 길을 떠날 때는 그 위에 회색 털 망토. 왕이 된 뒤에는 짙은 자홍색 비단 포와 옥대, 검은 관. 앞 회차 고려 고종(자줏빛)·김준(쑥색)과 구별
  scenes:
    2: 1270년 봄 개경 들판. 강화도에서 나와 개경으로 돌아가는 긴 행렬(가마, 수레, 관리와 백성들, 깃발은 글자 없이 무늬만). 행렬 앞쪽에서 말을 타고 멀리 송악산 아래 옛 도읍을 바라보는 왕의 뒷모습(자홍색 포). 맑은 봄 하늘, 오랜 전쟁이 끝난 듯 담담한 분위기.
    3: 1259년 몽골 초원 위의 거대한 군영. 수많은 흰 천막(게르)과 몽골 기병, 펄럭이는 깃발(글자 없이 무늬만). 가장 큰 천막 앞에서 털옷 차림의 몽골 지도자(얼굴은 그림자)가 두 팔을 벌려 맞이하고, 그 앞으로 걸어가는 고려 태자의 뒷모습(자홍색 포 위 회색 털 망토). 넓은 초원과 높은 하늘. 긴장되면서도 새 길이 열리는 분위기.
    3.5: 몽골 대형 천막 안. 등불 아래 낮은 탁자를 사이에 두고, 화려한 털옷 차림의 몽골 지도자(얼굴은 그림자)와 마주 앉아 두루마리 문서를 펼쳐 보이는 고려 태자의 손과 뒷모습(자홍색 포). 문서에는 글자가 알아볼 수 없게 흐릿하게. 진지하고 조심스러운 분위기.
    4: 1270년 강화도 나루. 바다 건너 육지 쪽으로 떠나는 큰 배들과 짐을 실은 작은 배들. 부두에 서서 바다 건너 육지를 바라보는 왕의 뒷모습(자홍색 포, 옥대). 뒤로 텅 빈 강화도의 흙 성벽과 궁궐 지붕. 넓은 바다와 맑은 하늘이 화면 위쪽을 넓게 채운다.
    5: 50대 고려 왕의 정면 상반신. 검은 관, 짙은 자홍색 비단 포와 옥대, 단정한 수염, 신중하고 고단하지만 단단한 눈빛, 꾸미지 않은 자연스러운 얼굴(미화 금지). 뒤로 송악산 아래 개경의 궁궐 지붕, 저녁 노을.

caption: |
  전쟁을 끝내러 몽골로 간 고려의 태자는, 누가 다음 황제가 될지 먼저 알아봤어요. 그가 바로 고려 제24대 왕 원종이에요.

  1259년, 30년 가까이 이어진 몽골과의 전쟁을 끝내기 위해 고종은 태자를 몽골에 보냈어요. 그런데 태자가 가는 도중 몽골의 황제 몽케가 세상을 떠났고, 제국은 후계 다툼에 들어갔어요. 태자는 고민 끝에 몽케의 동생 쿠빌라이를 찾아갔어요. 쿠빌라이는 크게 기뻐했고, 훗날 실제로 황제가 되었죠.

  이 만남에서 고려는 고려의 풍속을 바꾸지 않는다는 약속, 이른바 불개토풍을 받아 냈어요. 몽골에 항복한 다른 나라들과 달리 고려가 나라와 왕실을 지킬 수 있었던 바탕이었죠. 그사이 고종이 세상을 떠나자, 태자는 고려로 돌아와 왕위에 올랐어요.

  하지만 나라 안에는 여전히 무신 정권이 있었어요. 몽골과의 화해를 반대하던 김준은 1268년 임연에게 제거되었고, 1269년에는 임연이 원종을 쫓아내기까지 했어요. 원종은 몽골의 도움으로 다시 왕위에 올랐고, 1270년 마침내 강화도를 떠나 도읍을 개경으로 옮겼어요. 이로써 100년 가까운 무신 정권도 막을 내렸어요. 이에 반발한 삼별초는 진도와 제주도로 옮겨 가며 몽골에 맞섰어요.

  12월 5일 시작하는 드라마 〈신의 구슬〉은 원종이 몽골로 떠나기 한 해 전, 1258년 고려를 배경으로 해요.

  싸움 대신 협상을 택한 왕, 여러분은 원종의 선택을 어떻게 보시나요?

  * 1장 내용은 『고려사』 기록을 바탕으로 했으며, 2~5장 장면은 재구성한 연출, 7장의 얼굴은 상상화입니다. 원종과 몽골의 관계에 대한 평가는 지금도 엇갈립니다.

