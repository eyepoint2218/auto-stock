staging:
  - 1259년 태자로 몽골행, 몽케 사망 뒤 쿠빌라이를 택해 만남, 불개토풍 등 요구 수용, 고종 사망 뒤 쿠빌라이의 책봉으로 귀국 즉위, 1268년 임연이 김준 제거, 1269년 임연의 원종 폐위와 몽골 개입으로 복위, 1270년 개경 환도와 삼별초 해산 명령, 삼별초 진도·제주 항쟁(1273년 진압)은 자료로 확인
  - 쿠빌라이가 크게 기뻐했다는 것은 『고려사』 전하는 기록을 따른 널리 알려진 서술
  - 100년 가까운 무신 정권은 1170년 무신정변부터 1270년까지
  - 불개토풍이 이후 얼마나 지켜졌는지는 평가가 엇갈려 바탕이었죠 정도로 표현
  - 원종 즉위 연도는 귀국 즉위(1260)로 연도 없이 씀
  - 3장 몽골 군영, 3.5장 천막 협상, 4장 강화도 나루, 2장 환도 행렬은 연출. 쿠빌라이 얼굴은 가림
  - 7장 얼굴은 상상화
