ep: {NUM}
status: draft   # draft → images → done

# [대괄호] = 노란색 강조. 1~4장에는 이름을 쓰지 않는다.
slides:
  1:          # 후킹: 가장 인상적인 발언이나 결말. 검은 배경 + 글자만. 줄당 8자 안팎, 3줄
    lines: ["“첫 줄", "[핵심 단어] 둘째 줄", "셋째 줄.”"]
    # note: 재구성 대사     # 기록 그대로가 아닌 대사일 때 (선택)
  2:          # 궁금증: 1장이 왜 일어났는지 질문
    lines: ["", "", ""]
    # note: 재구성 연출     # 사료와 다른 장면 연출일 때
  3:          # 숨겨진 사연: 실제 사건 중심
    lines: ["", "", ""]
  4:          # 업적: 무엇을 했는지가 문구만으로 드러나게. 글자는 위쪽(pos: top)
    lines: ["", ""]
  5:          # 인물 공개
    intro: 그의 이름은     # 여성이면 그녀의 이름은
    name: {NAME}
    years: "0000~0000"
    desc: 한 줄 소개(핵심 업적)
    note: 상상화           # 실제 생전 초상이 있으면 지운다

