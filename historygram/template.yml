ep: {NUM}
status: draft   # draft → images → done

# [대괄호] = 노란색 강조. 퀴즈 장까지 이름을 쓰지 않는다. 말투는 부드러운 해요체.
# 흐름: 문제 → 누가? → 계기·배움 → 전환점 → 업적 → (퀴즈) → 인물 공개  (기준 예시 episodes/ep02_kimjeomdong)
slides:
  1:          # 당시의 문제·상황. 검은 배경 + 글자만. 줄당 8자 안팎, 3~4줄
    lines: ["", "[핵심 단어]", "", ""]
  2:          # 질문: 이 문제를 누가, 어떻게?
    lines: ["", "", ""]
    # note: 재구성 연출     # 사료와 다른 장면 연출일 때
  3:          # 계기와 준비(결심·배움·노력)
    lines: ["", "", ""]
  3.5:        # 전환점(돌아옴·떠남·결단). 마땅치 않으면 이 장을 지운다
    lines: ["", "", ""]
  4:          # 업적: 무엇을 했는지가 문구만으로 드러나게. 글자는 위쪽
    lines: ["", "", ""]
  5:          # 인물 공개
    intro: 그의 이름은     # 여성이면 그녀의 이름은
    name: {NAME}
    years: "0000~0000"
    desc: 한 줄 소개(핵심 업적)
    note: 상상화           # 실제 생전 초상이 있어도 그림은 상상화

images:
  era: 조선 후기(18세기)          # 시대
  hero: 30대 조선 남성, 직업      # 주인공 나이·성별·신분 (모든 그림 공통, 나이 변화가 있으면 적기)
  scenes:                          # 장소·연도·구도·복식. 스토리 장은 얼굴 노출 금지, 이름 쓰지 않기
    2: ""
    3: ""
    3.5: ""
    4: ""
    5: ""

caption: |
  첫 문장 후킹.

  배경과 사건.

  업적(누구를 위해 무엇을, 왜 중요했는지). 독자에게 묻는 문장?

  * 재구성·연출·상상화 표기.

hashtags: [역사그램, {NAME}]    # 최대 5개

sources: []    # 확인한 사료·문헌
staging: []    # 사실과 연출 구분
