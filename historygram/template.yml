  era: 조선 후기(18세기)          # 시대
  hero: 30대 조선 남성, 직업      # 주인공 나이·성별·신분 (4장 공통)
  scenes:                          # 장소·연도·구도·복식. 2~4장 얼굴 노출 금지, 이름 쓰지 않기
    2: ""
    3: ""
    4: ""
    5: ""

