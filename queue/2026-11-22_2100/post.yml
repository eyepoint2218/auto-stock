# 배우 맞히기 2회: 허성태
# 출처: 스포츠경향(2025.11.24), 뉴스와(2025.11.24), 텐아시아(2021.10.06), 위키트리 — PR 본문 참고
publish_at: "2026-11-22 21:00"
format: carousel
label: ACTOR
theme: dark
actor: 허성태
reveal: true
reveal_text: "대기업 회사원에서 ‘오징어 게임’ 덕수까지"
title: "대기업을 그만두고\n배우가 된 남자,\n누굴까요?"
subtitle: "끝까지 넘기면 정답이 나와요"
bubble: "맞혀보세요!"
outro_question: "맞히셨나요? 다음엔 누구 이야기가 궁금하세요?"
items:
  - type: story
    stage: 회사원 시절
    title: "‘러시아 판매왕’이라\n불린 회사원"
    desc: LG전자 해외영업부에서 러시아 TV 영업을 맡아 ‘러시아 판매왕’이라는 별명을 얻었어요. 이후 대우조선해양 기획조정실에서 일했죠. 누가 봐도 안정적인 삶이었어요.
  - type: story
    year: "2011"
    stage: 사표
    title: 연봉 7~8천만 원을 내려놓다
    desc: 2011년, 사표를 내고 배우 오디션 프로그램 〈기적의 오디션〉에 도전했어요. 당시 연봉은 7천만~8천만 원 정도였고, 가족의 반대도 컸다고 회상했죠.
  - type: story
    stage: 오디션 그 후
    title: "5등을 하고도,\n기회는 오지 않았다"
    desc: 오디션에서 5등이라는 성적을 냈지만 별다른 기회가 찾아오지 않았다고 털어놨어요. 늦은 나이에 시작한 배우의 길은 생각보다 훨씬 막막했어요.
    bubble: "현실..."
  - type: story
    stage: 바닥
    title: "아파트는 경매로,\n월세를 걱정하던 날들"
    desc: 빚이 쌓여 살던 아파트가 경매로 넘어갔고, 다음 달 월세를 걱정할 정도였다고 해요. 불규칙한 촬영 일정 사이사이 단기 아르바이트로 생계를 이어갔죠.
  - type: story
    stage: 버티는 시간
    title: 짧게 나와도 잊히지 않는 악역
    desc: 영화 〈밀정〉, 〈범죄도시〉에서 짧은 분량에도 강렬한 악역으로 관객의 눈에 띄기 시작했어요. ‘얼굴은 아는데 이름은 모르는’ 배우가 되어 갔죠.
  - type: story
    year: "2021"
    stage: 전환점
    title: "‘오징어 게임’ 덕수"
    desc: 넷플릭스 〈오징어 게임〉의 덕수 역. 역할을 위해 한 달 반 만에 15~17kg을 찌웠고, 종아리 근육이 끊어지고 무릎 통증까지 겪었다고 해요. 그렇게 전 세계가 그의 얼굴을 알게 됐어요.
  - type: quote
    year: "2025"
    stage: 대기업 퇴사에 대해
    title: 다시 돌아가도 또 그럴 겁니다.
    desc: 데뷔 14년 만에 첫 단독 주연 영화 〈정보원〉을 앞두고 한 인터뷰에서 남긴 말. 연기를 자신의 ‘천직’이라고 생각한다고 했어요.
caption: |
