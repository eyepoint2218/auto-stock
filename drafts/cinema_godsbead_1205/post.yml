  안보현 배우가 처음으로 사극에 도전해요. 곁에는 이성민, 수현 배우가 함께합니다.

  때는 1258년, 몽골과의 긴 전쟁에 지쳐 가던 고려. 나라를 지켜 줄 호국의 성물을 찾아 호송대가 길을 나서고, 위험에 빠진 그들을 구하려 황녀가 뒤를 따릅니다. 끝을 알 수 없는 원정길에서 이들은 무엇을 찾게 될까요.

