items:
  - type: story
    stage: 배경
    title: "1960년대,\n가진 건 없던 소녀"
    desc: 1960~80년대 한국 연예계가 무대예요. 가난한 어린 시절을 지나 음반 산업에 뛰어든 '민자'의 이야기. 송혜교가 민자를 맡았어요.
  - type: story
    stage: 소꿉친구
    title: "그 꿈을 위해\n함께 달린 남자"
    desc: 민자 곁을 지키며 꿈을 위해 함께 내달리는 소꿉친구 '동구'. 공유가 연기해요. 두 배우가 드라마에서 호흡을 맞추는 건 이번이 처음이에요.
    bubble: "벌써 설렘"
  - type: story
    stage: 극본
    title: "송혜교와 세 번째,\n그 작가"
    desc: 〈그들이 사는 세상〉, 〈그 겨울, 바람이 분다〉를 함께한 작가가 다시 송혜교와 손잡았어요. 세 번째 만남이에요.
  - type: story
    stage: 연출
    title: "〈커피프린스 1호점〉\n그 감독과 다시"
    desc: 연출은 〈커피프린스 1호점〉, 〈치즈인더트랩〉의 감독. 공유와는 〈커피프린스 1호점〉 이후 다시 만났어요.
  - type: story
    year: "22부작"
    stage: 함께하는 배우
    title: "김설현·차승원\n이하늬·나문희까지"
    desc: 가진 건 없지만 빛나는 성공을 꿈꾸며 온몸을 던진 사람들의 성장기. 22부작으로 그려요.
