# 배우 맞히기 1회: 오정세
# 출처: 일간·헤럴드경제·GQ·OSEN·더팩트 기사 (PR 본문 참고)
publish_at: "2026-11-13 07:40"
format: carousel
label: ACTOR
theme: dark
actor: 오정세
title: "이름 없는 단역 28년,\n이 배우는\n누굴까요?"
subtitle: "끝까지 넘기면 정답이 나와요"
bubble: "맞혀보세요!"
outro_question: "맞히셨나요? 다음엔 누구 이야기가 궁금하세요?"
reveal: true
reveal_text: "‘손님2’에서 시작해, 백상 조연상 2년 연속까지"
items:
  - type: story
    year: "1997"
    stage: 데뷔
    title: "이름도 없는 ‘손님2’"
    desc: 영화 〈아버지〉에서 이름 대신 ‘손님2’로 불린 단역. 그것이 이 배우의 첫 배역이었어요.
  - type: story
    stage: 무명 시절
    title: "오디션만 1,000번 넘게"
    desc: 붙는 날보다 떨어지는 날이 훨씬 많았어요. 2023년 〈유 퀴즈 온 더 블럭〉에서 무명 시절 1,000번이 넘는 오디션을 봤다고 직접 털어놨죠.
    bubble: "1,000번..."
  - type: story
    stage: 프로필에 쓸 게 없던 시절
    title: "경력 칸에 적은 건\n‘3차 오디션’"
    desc: 내세울 출연작이 없어, 프로필에 영화 〈살인의 추억〉 3차 오디션까지 올라갔던 일을 적었다고 해요. 합격도 아닌 ‘3차 오디션’이 그가 쓸 수 있는 경력이었던 거죠.
  - type: story
    year: "2006"
    stage: 첫 주연, 그 후
    title: 주연 한 번, 그리고 다시 긴 기다림
    desc: 데뷔 9년 만에 독립영화 〈팔월의 일요일들〉로 첫 주연을 맡았어요. 그 뒤에도 한 해 3~9편씩 단역과 조연으로 출연했지만, 주연의 기회는 쉽게 오지 않았습니다. 무명은 15년 넘게 이어졌어요.
  - type: story
    year: "2019"
    stage: 전환점
    title: "‘노규태’가 바꾼 인생"
    desc: 2017년 〈조작된 도시〉로 ‘저 배우 누구지?’ 소리를 듣기 시작했고, 2019년 〈동백꽃 필 무렵〉의 노규태로 ‘노큐티’라는 별명까지 얻었어요. 그리고 다음 해, 백상예술대상 조연상을 받습니다.
  - type: quote
    year: "2020"
    stage: 백상예술대상 수상 소감
    title: "저한테는 동백이가 그랬습니다."
    desc: 힘든 시기를 보내는 사람들에게 자책하지 말라며, 꾸준히 하다 보면 받지 못했던 위로와 보상이 찾아온다는 이야기를 전했어요.
  - type: story
    stage: 지금
    title: 버틴 시간은 헛되지 않았다
    desc: 2021년 백상 조연상 2년 연속 수상, 2025년 넷플릭스 〈폭싹 속았수다〉까지. 최근 인터뷰에서 무명 시절 ‘무가치함’을 느낀 적 없냐는 질문에, 그는 단호하게 고개를 저었다고 해요.
caption: |
  1997년, 이름도 없는 ‘손님2’로 시작한 배우가 있어요 🎬
  오디션만 1,000번 넘게 보며 버틴 28년. 이 배우는 누굴까요?
  끝까지 넘기면 정답이 나와요 👉

  몇 번째 장에서 맞히셨나요? 댓글로 알려주세요 👇
