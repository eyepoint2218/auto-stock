items:
  - type: story
    year: "2002"
    stage: 데뷔
    title: 시작은 작은 뮤지컬 무대
    desc: 2002년 뮤지컬 〈짱따〉로 데뷔했어요. 화려한 조명보다 무대 위에서 하나씩 실력을 쌓아 가던 시간이었죠.
  - type: story
    stage: 어린 시절
    title: "빨간 딱지,\n산동네 판자촌"
    desc: 집에 빨간 딱지가 붙고 산동네 판자촌에서 살았던 시절이 있었다고 방송에서 직접 털어놨어요.
  - type: story
    stage: 무명 시절
    title: "뮤지컬로 1년에\n번 돈, 20만 원"
    desc: 무대에 서도 생활이 되지 않던 시절. 뮤지컬로 1년 동안 번 돈이 20만 원이었다고 회상했어요.
    bubble: "1년에..."
  - type: story
    stage: 버티는 시간
    title: 안 해본 일이 없었다
    desc: 일용직, 휴대전화 공장, 건물 경비, 배달, 전단지, 찹쌀떡 판매까지. 연기를 이어 가기 위해 수많은 아르바이트를 했다고 해요.
  - type: story
    year: "2007"
    stage: 전환점
    title: "‘쓰릴미’로\n이름을 알리다"
    desc: 2007~2008년 뮤지컬 〈쓰릴미〉로 존재감을 알리기 시작했고, 이후 스크린과 드라마, OTT로 무대를 넓혀 갔어요.
  - type: quote
    year: "2026"
    stage: ‘참교육’ 흥행 이후
    title: 오랫동안 인연을 가진 분들이 자기 일처럼 기뻐해 주신다.
    desc: 넷플릭스 〈참교육〉 흥행 뒤 주변에서 축하 연락을 정말 많이 받는다며 남긴 말이에요.
